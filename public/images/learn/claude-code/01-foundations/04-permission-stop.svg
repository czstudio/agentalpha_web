<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f6f6f2"/><text x="70" y="90" font-family="Arial, PingFang SC" font-size="36" font-weight="700">它为什么突然停下来问你？因为动作的风险不同</text>
  <g font-family="Arial, PingFang SC"><rect x="75" y="155" width="320" height="390" rx="28" fill="#e8f7ef" stroke="#16875f" stroke-width="3"/><text x="120" y="215" font-size="28" font-weight="700" fill="#126044">通常可直接进行</text><text x="120" y="285" font-size="24">阅读文件</text><text x="120" y="335" font-size="24">搜索代码</text><text x="120" y="385" font-size="24">分析依赖关系</text><text x="120" y="465" font-size="20" fill="#466">没有改变外部状态</text>
  <rect x="440" y="155" width="320" height="390" rx="28" fill="#fff4d6" stroke="#d28b00" stroke-width="3"/><text x="487" y="215" font-size="28" font-weight="700" fill="#835500">需要看清再同意</text><text x="487" y="285" font-size="24">修改文件</text><text x="487" y="335" font-size="24">运行某些命令</text><text x="487" y="385" font-size="24">安装依赖</text><text x="487" y="465" font-size="20" fill="#765">会改变当前项目</text>
  <rect x="805" y="155" width="320" height="390" rx="28" fill="#ffe8e8" stroke="#d9363e" stroke-width="3"/><text x="850" y="215" font-size="28" font-weight="700" fill="#8f2026">必须谨慎决定</text><text x="850" y="285" font-size="24">删除数据</text><text x="850" y="335" font-size="24">发布到线上</text><text x="850" y="385" font-size="24">触碰密钥和账号</text><text x="850" y="465" font-size="20" fill="#765">后果可能难以恢复</text></g>
  <text x="75" y="610" font-family="Arial, PingFang SC" font-size="24" fill="#333">弹出确认不是它“变笨了”，而是把最终决定留给真正承担后果的人。</text>
</svg>
