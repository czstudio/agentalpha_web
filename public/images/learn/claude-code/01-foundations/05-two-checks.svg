<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f4f7fb"/><text x="70" y="90" font-family="Arial, PingFang SC" font-size="36" font-weight="700">改完以后，用两副不同的“眼镜”检查</text>
  <rect x="80" y="155" width="480" height="375" rx="28" fill="#fff" stroke="#315efb" stroke-width="4"/><text x="130" y="220" font-family="Arial, PingFang SC" font-size="31" font-weight="700" fill="#1d46bf">diff：它到底改了什么</text><text x="130" y="285" font-family="Menlo, monospace" font-size="22" fill="#b42318">- return '登录失败'</text><text x="130" y="335" font-family="Menlo, monospace" font-size="22" fill="#087443">+ return `登录失败，还可尝试 ${left} 次`</text><text x="130" y="410" font-family="Arial, PingFang SC" font-size="23" fill="#444">检查范围、意外删除、无关修改</text><text x="130" y="465" font-family="Arial, PingFang SC" font-size="21" fill="#666">回答：改动是否符合你的意思？</text>
  <rect x="640" y="155" width="480" height="375" rx="28" fill="#fff" stroke="#16a36a" stroke-width="4"/><text x="690" y="220" font-family="Arial, PingFang SC" font-size="31" font-weight="700" fill="#087443">test：项目还能不能工作</text><text x="690" y="295" font-family="Menlo, monospace" font-size="24" fill="#087443">✓ shows remaining attempts</text><text x="690" y="345" font-family="Menlo, monospace" font-size="24" fill="#087443">✓ locks after third failure</text><text x="690" y="410" font-family="Arial, PingFang SC" font-size="23" fill="#444">检查功能、旧行为和边界条件</text><text x="690" y="465" font-family="Arial, PingFang SC" font-size="21" fill="#666">回答：代码是否真的达到要求？</text>
  <rect x="250" y="565" width="700" height="62" rx="18" fill="#171717"/><text x="360" y="605" font-family="Arial, PingFang SC" font-size="24" fill="#fff">只看“任务完成”四个字，两副眼镜都没戴。</text>
</svg>
