  <text x="822" y="218" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#66766f">commit 必须携带：</text>
  <text x="822" y="251" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#66766f">结果摘要 · evidence_refs</text>
  <text x="822" y="284" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#66766f">trace_id · 版本 · 影响范围</text>
  <text x="822" y="334" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#996c3d">unknown 不能直接重放：</text>
  <text x="822" y="367" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#996c3d">查询幂等状态 → 恢复 / 取消 / 对账</text>
