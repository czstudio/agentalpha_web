<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">视觉缓存版本卡</title>
  <desc id="desc">父图哈希、预处理版本和坐标系不一致时自动失效</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Crop cache version</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">缓存命中前，先确认坐标仍然属于同一张父图</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">父图</text>
    <text x="147" y="194" font-size="15" fill="#365b61">sha256 + page</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">原图版本</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">预处理</text>
    <text x="357" y="194" font-size="15" fill="#365b61">deskew-v3</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">旋转 / 遮罩</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">坐标系</text>
    <text x="567" y="194" font-size="15" fill="#365b61">normalized-page</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">crop box</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">不一致</text>
    <text x="777" y="194" font-size="15" fill="#365b61">invalidate</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">重新切片</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">引用</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">版本一致</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">可复用</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：父图哈希、预处理版本、坐标系一致后，crop 才能进入引用链</text>
</svg>
