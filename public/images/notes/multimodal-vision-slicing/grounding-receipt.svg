<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">视觉答案定位凭证</title><desc id="desc">答案文字与页码、坐标、crop 版本和置信度绑定</desc>
  <rect width="1080" height="420" rx="28" fill="#f7f8f5"/>
  <text x="54" y="56" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#173f3d">Grounding receipt</text>
  <text x="54" y="84" font-family="Arial,sans-serif" font-size="15" fill="#58716e">每个数字都能点回原图，才算真正可核验</text>
  <g font-family="Arial,sans-serif" font-size="15" fill="#173f3d">
    <rect x="54" y="126" width="218" height="112" rx="16" fill="#eaf3f7" stroke="#b9d3df"/><text x="163" y="160" text-anchor="middle" font-weight="700">答案</text><text x="163" y="192" text-anchor="middle">10% · grounded</text><text x="163" y="216" text-anchor="middle">status</text>
    <rect x="296" y="126" width="218" height="112" rx="16" fill="#fff1d9" stroke="#e8c891"/><text x="405" y="160" text-anchor="middle" font-weight="700">来源位置</text><text x="405" y="192" text-anchor="middle">page 2 · box</text><text x="405" y="216" text-anchor="middle">原图坐标</text>
    <rect x="538" y="126" width="218" height="112" rx="16" fill="#dfeee8" stroke="#afd0c3"/><text x="647" y="160" text-anchor="middle" font-weight="700">读取证据</text><text x="647" y="192" text-anchor="middle">crop_id · OCR</text><text x="647" y="216" text-anchor="middle">confidence 0.97</text>
    <rect x="780" y="126" width="246" height="112" rx="16" fill="#173f3d"/><text x="903" y="160" text-anchor="middle" font-weight="700" fill="#fff">策略</text><text x="903" y="192" text-anchor="middle" fill="#dbe9e5">冲突检查</text><text x="903" y="216" text-anchor="middle" fill="#dbe9e5">可回答 / 待复核</text>
  </g>
  <g stroke="#79908c" stroke-width="3" fill="none" stroke-linecap="round"><path d="M272 182h24"/><path d="M514 182h24"/><path d="M756 182h24"/></g>
  <rect x="54" y="294" width="972" height="62" rx="16" fill="#182033"/><text x="80" y="331" font-family="monospace" font-size="15" fill="#f7f8f5">answer → citation → crop → coordinates → parser_version → policy gate</text>
</svg>
