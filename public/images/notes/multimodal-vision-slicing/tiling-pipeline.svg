<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">长图视觉切片流程</title>
  <desc id="desc">长图先低分辨率定位，再切出高分辨率区域，最后合并 OCR 和视觉证据。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <path d="M205 180h100M420 180h100M635 180h100" stroke="#8eb8af" stroke-width="4" stroke-linecap="round"/><path d="m294 170 18 10-18 10M509 170l18 10-18 10M724 170l18 10-18 10" fill="#8eb8af"/>
  <rect x="35" y="64" width="170" height="230" rx="18" fill="#fff" stroke="#b9cbc6" stroke-width="3"/>
  <rect x="62" y="90" width="116" height="176" rx="8" fill="#e9f1ed"/><path d="M74 112h92M74 138h80M74 164h92M74 190h62M74 216h85" stroke="#7ca89d" stroke-width="8" stroke-linecap="round"/>
  <text x="120" y="319" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#173f3d">全图定位</text>
  <rect x="315" y="92" width="104" height="176" rx="8" fill="#f4dca6" stroke="#e5c58a" stroke-width="3"/><path d="M327 114h80M327 140h64M327 166h80M327 192h50M327 218h76" stroke="#9a743e" stroke-width="8" stroke-linecap="round"/>
  <rect x="309" y="151" width="116" height="55" rx="6" fill="none" stroke="#c37651" stroke-width="5" stroke-dasharray="8 6"/>
  <text x="367" y="319" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#704c20">高分辨率 crop</text>
  <rect x="530" y="105" width="100" height="150" rx="12" fill="#eaf3f7" stroke="#a7c8d6"/>
  <text x="580" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24556a">OCR</text><text x="580" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#587783">文字</text><text x="580" y="212" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#587783">坐标</text>
  <rect x="745" y="105" width="120" height="150" rx="14" fill="#f2eaf7" stroke="#c6aed7"/><text x="805" y="150" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#604774">证据</text><text x="805" y="183" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#765d86">合并</text><text x="805" y="216" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#765d86">回答</text>
  <text x="35" y="40" font-family="sans-serif" font-size="16" fill="#647775">切片要带原图坐标，不是切完就丢掉来源。</text>
</svg>
