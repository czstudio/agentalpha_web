<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">能力反证卡</title>
  <desc id="desc">保持任务目标不变，替换租户、工具顺序和快照版本，验证能力是否能迁移。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">路线退出前：做一条能力反证</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">通过金样本之后，换条件看你能不能预测首处分叉</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="167" font-size="18" font-weight="700" fill="#275261">固定目标</text><text x="147" y="199" font-size="15" fill="#52727a">保留验收规则</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="167" font-size="18" font-weight="700" fill="#6e5223">替换条件</text><text x="357" y="199" font-size="15" fill="#806a3d">租户 / 顺序 / 版本</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="167" font-size="18" font-weight="700" fill="#2b6353">先做预测</text><text x="567" y="199" font-size="15" fill="#53786b">写出首处分叉</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="167" font-size="18" font-weight="700" fill="#78454d">回放对照</text><text x="777" y="199" font-size="15" fill="#855c63">错了就继续</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="175" font-size="18" font-weight="700" fill="#ffffff">可迁移</text><text x="960" y="207" font-size="15" fill="#d8ebe5">再退出</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round"><path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/></g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">路线的出口不是“看过”，而是能解释条件变化后的首处分叉</text>
</svg>
