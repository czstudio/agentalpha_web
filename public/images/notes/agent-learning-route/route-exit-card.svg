<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">学习路线退出回执</title><desc id="desc">目标能力、证据、未答追问和复查时间组成路线退出回执</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">路线退出回执：该主题现在够用了吗？</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">退出不是放弃，是把能力封存成可复用证据</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">目标能力</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">定位首处分叉</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">安全回滚</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">回放 640 条</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">脚本 + 失败样本</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">未答追问</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">跨租户版本</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">转入灰度观测</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">决定</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">pause</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">保留产物</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">复查</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">09-03</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">新证据</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">没有结束条件的路线，会把收藏量误当成能力增长</text>
</svg>
