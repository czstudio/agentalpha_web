<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">每周主问题循环</title><desc id="desc">一个主问题在阅读、实现、实验和复述之间循环。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><path d="M145 210h610" stroke="#86a59d" stroke-width="6"/><g font-size="18" font-weight="700"><circle cx="145" cy="210" r="62" fill="#eaf3f7" stroke="#24556a"/><text x="145" y="216">阅读</text><circle cx="348" cy="210" r="62" fill="#dfeee8" stroke="#86a59d"/><text x="348" y="216">实现</text><circle cx="552" cy="210" r="62" fill="#fff1d9" stroke="#c69a58"/><text x="552" y="216">实验</text><circle cx="755" cy="210" r="62" fill="#173f3d"/><text x="755" y="216" fill="#fff">复述</text></g><text x="450" y="335" font-size="17" fill="#4d6562">每周只追一个能验证的问题</text></g></svg>
