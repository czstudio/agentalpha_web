<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">反向证据检索</title>
  <desc id="desc">支持证据、冲突探针和范围收窄一起关闭 claim</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Inverse grounding</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">先找到支持句，再主动寻找例外、更新版本和冲突范围</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">Claim</text>
    <text x="147" y="194" font-size="15" fill="#365b61">refund-window</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">拆成可验收命题</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">支持证据</text>
    <text x="357" y="194" font-size="15" fill="#365b61">版本 / 时间 / 范围</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">正向检索</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">反向探针</text>
    <text x="567" y="194" font-size="15" fill="#365b61">例外 / 暂停 / 冲突</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">主动搜索</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">范围收窄</text>
    <text x="777" y="194" font-size="15" fill="#365b61">拆分普遍规则</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">保留例外条件</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">关闭</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">带范围回答</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">或保持开放</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：引用不仅存在，还要与时间、地域、对象和例外条件匹配</text>
</svg>
