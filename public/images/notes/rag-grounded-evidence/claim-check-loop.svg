<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Claim 检查闭环</title><desc id="desc">拆分 claim，检索证据，检查支持关系，决定回答或拒答。</desc><rect width="900" height="330" rx="28" fill="#f7f8f5"/><g font-family="sans-serif"><circle cx="150" cy="165" r="78" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="150" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#24556a">Split</text><text x="150" y="184" text-anchor="middle" font-size="14" fill="#5a737d">拆 claim</text><circle cx="370" cy="165" r="78" fill="#dfeee8" stroke="#173f3d" stroke-width="2"/><text x="370" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#173f3d">Retrieve</text><text x="370" y="184" text-anchor="middle" font-size="14" fill="#52706b">找证据</text><circle cx="590" cy="165" r="78" fill="#fff1d9" stroke="#704c20" stroke-width="2"/><text x="590" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#704c20">Ground</text><text x="590" y="184" text-anchor="middle" font-size="14" fill="#856a42">判支持</text><circle cx="810" cy="165" r="78" fill="#fae8e1" stroke="#753f32" stroke-width="2"/><text x="810" y="158" text-anchor="middle" font-size="19" font-weight="700" fill="#753f32">Answer</text><text x="810" y="184" text-anchor="middle" font-size="14" fill="#845a50">回答 / 拒答</text><path d="M228 165h64M448 165h64M668 165h64" stroke="#24556a" stroke-width="3" marker-end="url(#m)"/><path d="M810 243C690 315 250 315 150 243" fill="none" stroke="#9baba6" stroke-width="2" stroke-dasharray="7 7"/><text x="480" y="302" text-anchor="middle" font-size="14" fill="#68706c">把失败的 claim 回写成下一轮评测样本</text><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#24556a"/></marker></defs></g></svg>
