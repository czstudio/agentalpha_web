<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Grounding 证据覆盖表</title><desc id="desc">按 claim 类型拆分支持、不足、冲突和正确拒答</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Grounding 报告：平均分会掩盖哪类 claim 在漏</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">分母按 claim 计算，严重漏判单独设门槛</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">数字 / 单位</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">320 claims</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">支持 287 · 冲突 15</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">时间 / 版本</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">240 claims</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">旧版冲突 21</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">因果 / 建议</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">180 claims</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">不足 42 · 人工 38</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">发布门槛</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">高风险漏判 = 0</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">切片差异不能被平均分掩盖</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">“回答对了”要落到每个 claim：支持、不足、冲突或正确拒答</text>
</svg>
