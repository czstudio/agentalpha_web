<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">像素到视觉 token 的多模态输入链路</title>
  <desc id="desc">图片经过 patch 切分、视觉编码和投影后，与文本 token 一起进入 Transformer。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <path d="M188 180h80M400 180h80M612 180h80" stroke="#8eb8af" stroke-width="4" stroke-linecap="round"/>
  <path d="m258 170 18 10-18 10M470 170l18 10-18 10M682 170l18 10-18 10" fill="#8eb8af"/>
  <rect x="28" y="105" width="160" height="150" rx="20" fill="#e9f1ed" stroke="#9bc1b5"/>
  <rect x="55" y="132" width="106" height="78" rx="8" fill="#d7e9e2"/>
  <path d="M65 194l27-28 17 15 17-20 34 33" fill="none" stroke="#4c8a7e" stroke-width="5"/>
  <text x="108" y="238" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#173f3d">像素图片</text>
  <rect x="268" y="105" width="132" height="150" rx="20" fill="#fff3dd" stroke="#e5c58a"/>
  <path d="M292 132h84v96h-84z" fill="#f4dca6"/>
  <path d="M320 132v96M348 132v96M292 164h84M292 196h84" stroke="#9a743e" stroke-width="2" opacity=".65"/>
  <text x="334" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#704c20">Patch</text>
  <rect x="480" y="105" width="132" height="150" rx="20" fill="#eaf3f7" stroke="#a7c8d6"/>
  <circle cx="516" cy="155" r="13" fill="#5d94a7"/><circle cx="554" cy="145" r="13" fill="#7faec0"/><circle cx="572" cy="184" r="13" fill="#5d94a7"/><circle cx="520" cy="201" r="13" fill="#7faec0"/>
  <path d="M516 155l38-10 18 39-52 17z" fill="none" stroke="#3f7384" stroke-width="3"/>
  <text x="546" y="238" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#24556a">视觉编码</text>
  <rect x="692" y="105" width="180" height="150" rx="20" fill="#f2eaf7" stroke="#c6aed7"/>
  <text x="782" y="151" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#604774">视觉 token</text>
  <text x="782" y="185" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#765d86">+ 文本 token</text>
  <text x="782" y="219" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#765d86">→ Transformer</text>
  <text x="40" y="312" font-family="sans-serif" font-size="16" fill="#647775">语言模型接收的是带空间信息的向量序列，不是原始像素。</text>
</svg>
