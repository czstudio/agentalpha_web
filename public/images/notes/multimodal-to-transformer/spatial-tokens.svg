<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">带二维位置的视觉 token</title>
  <desc id="desc">同一张文档中的标题、金额和脚注通过内容 token 与二维位置保持关系。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <rect x="54" y="45" width="290" height="238" rx="14" fill="#fff" stroke="#b9cbc6" stroke-width="3"/>
  <text x="80" y="82" font-family="sans-serif" font-size="20" font-weight="700" fill="#173f3d">报销单</text>
  <rect x="78" y="103" width="230" height="18" rx="5" fill="#d7e9e2"/>
  <rect x="78" y="143" width="100" height="22" rx="5" fill="#f4dca6"/><rect x="188" y="143" width="120" height="22" rx="5" fill="#eaf3f7"/>
  <rect x="78" y="182" width="230" height="22" rx="5" fill="#eaf3f7"/>
  <rect x="78" y="220" width="140" height="18" rx="5" fill="#f2eaf7"/>
  <path d="M382 100h120M382 180h120M382 250h120" stroke="#8eb8af" stroke-width="3" stroke-linecap="round"/>
  <path d="m492 90 16 10-16 10M492 170l16 10-16 10M492 240l16 10-16 10" fill="#8eb8af"/>
  <rect x="528" y="64" width="300" height="50" rx="14" fill="#d7e9e2"/><text x="678" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#173f3d">token: 标题 · x=0.1 y=0.1</text>
  <rect x="528" y="144" width="300" height="50" rx="14" fill="#f4dca6"/><text x="678" y="176" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#704c20">token: 金额 · x=0.6 y=0.4</text>
  <rect x="528" y="224" width="300" height="50" rx="14" fill="#eaf3f7"/><text x="678" y="256" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#24556a">token: 脚注 · x=0.1 y=0.8</text>
  <text x="54" y="323" font-family="sans-serif" font-size="16" fill="#647775">内容告诉模型“是什么”，位置告诉模型“在哪里、和谁相邻”。</text>
</svg>
