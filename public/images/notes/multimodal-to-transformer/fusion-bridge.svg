<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">视觉投影与文本融合</title>
  <desc id="desc">投影层将视觉隐藏维度映射到语言模型空间，注意力层让文本读取视觉证据。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <rect x="42" y="82" width="210" height="170" rx="20" fill="#e9f1ed" stroke="#9bc1b5"/>
  <text x="147" y="128" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#173f3d">视觉空间</text>
  <text x="147" y="168" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4c7068">dᵥ 维向量</text>
  <circle cx="102" cy="207" r="12" fill="#4c8a7e"/><circle cx="146" cy="207" r="12" fill="#82aea4"/><circle cx="190" cy="207" r="12" fill="#4c8a7e"/>
  <path d="M252 167h135" stroke="#8eb8af" stroke-width="5" stroke-linecap="round"/><path d="m375 157 20 10-20 10" fill="#8eb8af"/>
  <rect x="395" y="106" width="150" height="112" rx="18" fill="#fff3dd" stroke="#e5c58a"/>
  <text x="470" y="148" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#704c20">Wproj</text>
  <text x="470" y="181" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#87683d">维度与分布对齐</text>
  <path d="M545 167h110" stroke="#8eb8af" stroke-width="5" stroke-linecap="round"/><path d="m644 157 20 10-20 10" fill="#8eb8af"/>
  <rect x="664" y="50" width="190" height="232" rx="20" fill="#eaf3f7" stroke="#a7c8d6"/>
  <text x="759" y="94" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#24556a">Transformer</text>
  <text x="759" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#587783">视觉 token</text>
  <text x="759" y="169" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#587783">文本 token</text>
  <text x="759" y="201" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#587783">Cross attention</text>
  <text x="759" y="245" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#587783">回答 + 证据</text>
  <text x="42" y="323" font-family="sans-serif" font-size="16" fill="#647775">投影负责“对得上”，注意力负责“用得上”。</text>
</svg>
