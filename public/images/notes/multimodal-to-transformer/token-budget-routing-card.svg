<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">视觉 token 预算路由</title>
  <desc id="desc">文字、布局和粗分类使用不同预算与保真门槛。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F8F5"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#173F3D">视觉 token 预算按任务路由</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#5B7470">读小字、看布局和粗分类不该共用一把尺子</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="214" height="126" rx="18" fill="#EAF3F7"/><text x="161" y="172" font-size="19" font-weight="700" fill="#275261">文字精读</text><text x="161" y="207" font-size="15" fill="#52727A">1024 tokens</text><text x="161" y="233" font-size="15" fill="#52727A">2x crop / OCR ≥ .90</text>
    <rect x="292" y="132" width="214" height="126" rx="18" fill="#E5F0ED"/><text x="399" y="172" font-size="19" font-weight="700" fill="#1C615A">布局推理</text><text x="399" y="207" font-size="15" fill="#31514E">768 tokens</text><text x="399" y="233" font-size="15" fill="#31514E">full + overlap</text>
    <rect x="530" y="132" width="214" height="126" rx="18" fill="#FFF0D6"/><text x="637" y="172" font-size="19" font-weight="700" fill="#875B26">粗分类</text><text x="637" y="207" font-size="15" fill="#6C5632">256 tokens</text><text x="637" y="233" font-size="15" fill="#6C5632">thumbnail</text>
    <rect x="768" y="132" width="260" height="126" rx="18" fill="#173F3D"/><text x="898" y="182" font-size="19" font-weight="700" fill="#FFFFFF">低置信度</text><text x="898" y="218" font-size="15" fill="#D8EBE5">二次 crop / 请求清晰输入</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M268 195h24"/><path d="M506 195h24"/><path d="M744 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">预算和区域 ACL 由服务端约束，模型只在允许的观察范围内规划</text>
</svg>
