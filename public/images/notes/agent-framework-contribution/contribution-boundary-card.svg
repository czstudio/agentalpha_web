<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">贡献边界卡</title>
  <desc id="desc">移除框架默认能力后，项目不变量逐项验收</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Contribution boundary</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">把框架默认行为、项目约束和剩余依赖分开</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">移除默认</text>
    <text x="147" y="194" font-size="15" fill="#365b61">retry / memory</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">最小适配器</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">项目约束</text>
    <text x="357" y="194" font-size="15" fill="#365b61">ACL / 幂等</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">审计 / 评测</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">逐项探针</text>
    <text x="567" y="194" font-size="15" fill="#365b61">pass / fail</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">回放同一任务集</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">边界</text>
    <text x="777" y="194" font-size="15" fill="#365b61">remaining dependency</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">模型适配器</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">归因</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">可迁移</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">可交接</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：去掉框架能力后，项目不变量仍能被逐项回放和解释</text>
</svg>
