<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">框架与项目贡献</title><desc id="desc">框架能力、项目系统和个人贡献分成三层说明。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" text-anchor="middle"><path d="M160 330h580L625 72H275Z" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><path d="M215 270h470l-38-88H253Z" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><path d="M280 165h340" stroke="#fff1d9" stroke-width="48"/><g fill="#173f3d" font-size="19" font-weight="700"><text x="450" y="110">框架：提供通用能力</text><text x="450" y="224">项目：组合成业务系统</text><text x="450" y="309">贡献：决策、边界与证据</text></g><text x="450" y="382" font-size="16" fill="#4d6562">能被替换的部分，不能算完整贡献</text></g></svg>
