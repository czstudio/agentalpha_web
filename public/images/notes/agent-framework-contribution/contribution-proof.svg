<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">个人贡献证据</title><desc id="desc">契约、策略、状态和评测证明个人在框架之上的贡献。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><rect x="70" y="70" width="170" height="105" rx="18" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="155" y="112" text-anchor="middle" font-size="19" font-weight="700">契约</text><text x="155" y="143" text-anchor="middle" font-size="14">输入 / 输出 / 错误</text><rect x="270" y="70" width="170" height="105" rx="18" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><text x="355" y="112" text-anchor="middle" font-size="19" font-weight="700">策略</text><text x="355" y="143" text-anchor="middle" font-size="14">路由 / 重试 / 降级</text><rect x="470" y="70" width="170" height="105" rx="18" fill="#fff1d9" stroke="#c69a58" stroke-width="2"/><text x="555" y="112" text-anchor="middle" font-size="19" font-weight="700">状态</text><text x="555" y="143" text-anchor="middle" font-size="14">恢复 / 幂等 / 审计</text><rect x="670" y="70" width="170" height="105" rx="18" fill="#fae8e1" stroke="#b96d59" stroke-width="2"/><text x="755" y="112" text-anchor="middle" font-size="19" font-weight="700">评测</text><text x="755" y="143" text-anchor="middle" font-size="14">基线 / 指标 / 回归</text><path d="M155 175v83M355 175v83M555 175v83M755 175v83" stroke="#86a59d" stroke-width="3"/><rect x="180" y="258" width="540" height="80" rx="20" fill="#173f3d"/><text x="450" y="292" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">可复述、可验证、可迁移</text><text x="450" y="319" text-anchor="middle" font-size="14" fill="#dfeee8">这是项目贡献的证据链</text></g></svg>
