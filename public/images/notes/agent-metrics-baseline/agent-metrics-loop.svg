<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Agent 指标闭环</title><desc id="desc">定义指标、建立基线、进行实验、观察线上和回归复盘。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><path d="M150 210a300 140 0 1 0 600 0a300 140 0 1 0-600 0" fill="none" stroke="#dfeee8" stroke-width="38"/><g text-anchor="middle" font-size="18" font-weight="700"><rect x="80" y="180" width="150" height="60" rx="16" fill="#eaf3f7" stroke="#24556a"/><text x="155" y="217">定义指标</text><rect x="270" y="55" width="150" height="60" rx="16" fill="#fff1d9" stroke="#c69a58"/><text x="345" y="92">建立基线</text><rect x="480" y="55" width="150" height="60" rx="16" fill="#dfeee8" stroke="#86a59d"/><text x="555" y="92">离线实验</text><rect x="670" y="180" width="150" height="60" rx="16" fill="#fae8e1" stroke="#b96d59"/><text x="745" y="217">线上观察</text><rect x="480" y="305" width="150" height="60" rx="16" fill="#173f3d"/><text x="555" y="342" fill="#fff">回归复盘</text></g><text x="450" y="211" text-anchor="middle" font-size="26" font-weight="700">可比较</text><text x="450" y="242" text-anchor="middle" font-size="15" fill="#4d6562">只改一个变量</text></g></svg>
