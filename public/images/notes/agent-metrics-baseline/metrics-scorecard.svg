<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent 评测 scorecard</title>
  <desc id="desc">硬门槛和软指标分层，并映射到阻断、灰度、优化和成本动作。</desc>
  <rect width="1080" height="360" rx="28" fill="#f7f8f5"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="46" y="82" width="190" height="188" rx="18" fill="#173f3d"/><text x="141" y="120" font-size="19" font-weight="700" fill="#fff">硬门槛</text><text x="141" y="154" font-size="14" fill="#dfeee8">越权 · 副作用</text><text x="141" y="180" font-size="14" fill="#dfeee8">引用失真</text><text x="141" y="226" font-size="16" font-weight="700" fill="#fff">阻断 / 回滚</text>
    <rect x="278" y="82" width="190" height="188" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="373" y="120" font-size="19" font-weight="700" fill="#24556a">结果</text><text x="373" y="154" font-size="14" fill="#5a737d">成功率 · 拒答</text><text x="373" y="180" font-size="14" fill="#5a737d">证据覆盖</text><text x="373" y="226" font-size="16" font-weight="700" fill="#24556a">灰度 / 继续</text>
    <rect x="510" y="82" width="190" height="188" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="605" y="120" font-size="19" font-weight="700" fill="#173f3d">过程</text><text x="605" y="154" font-size="14" fill="#52706b">工具 · 步骤</text><text x="605" y="180" font-size="14" fill="#52706b">重试 · P95</text><text x="605" y="226" font-size="16" font-weight="700" fill="#173f3d">定位 / 优化</text>
    <rect x="742" y="82" width="190" height="188" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="837" y="120" font-size="19" font-weight="700" fill="#704c20">成本体验</text><text x="837" y="154" font-size="14" fill="#856a42">单位成功成本</text><text x="837" y="180" font-size="14" fill="#856a42">接管 · 满意度</text><text x="837" y="226" font-size="16" font-weight="700" fill="#704c20">路由 / 预算</text>
  </g>
</svg>
