<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">指标口径桥接</title>
  <desc id="desc">旧新定义双跑，逐 trace 映射并保留换尺子的断点。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F8F5"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#173F3D">指标口径升级要双跑</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#5B7470">分母、unknown 或成功定义变化，都要标记换尺子</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="246" height="126" rx="18" fill="#EAF3F7"/><text x="177" y="172" font-size="19" font-weight="700" fill="#275261">v1</text><text x="177" y="207" font-size="15" fill="#52727A">HTTP 200</text><text x="177" y="233" font-size="15" fill="#52727A">unknown excluded</text>
    <rect x="324" y="132" width="246" height="126" rx="18" fill="#FFF0D6"/><text x="447" y="172" font-size="19" font-weight="700" fill="#875B26">桥接</text><text x="447" y="207" font-size="15" fill="#6C5632">dual run 14d</text><text x="447" y="233" font-size="15" fill="#6C5632">per trace map</text>
    <rect x="594" y="132" width="246" height="126" rx="18" fill="#E5F0ED"/><text x="717" y="172" font-size="19" font-weight="700" fill="#1C615A">v2</text><text x="717" y="207" font-size="15" fill="#31514E">state committed</text><text x="717" y="233" font-size="15" fill="#31514E">unknown separate</text>
    <rect x="864" y="132" width="164" height="126" rx="18" fill="#173F3D"/><text x="946" y="182" font-size="19" font-weight="700" fill="#FFFFFF">断点</text><text x="946" y="218" font-size="15" fill="#D8EBE5">break marker</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M300 195h24"/><path d="M570 195h24"/><path d="M840 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">同名指标不能直接拼趋势线：历史序列与新序列要带 metric version</text>
</svg>
