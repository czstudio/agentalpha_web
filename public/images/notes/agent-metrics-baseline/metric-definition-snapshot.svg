<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">指标口径快照卡</title><desc id="desc">定义、分子、分母、切片和版本组成可复算的指标口径</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">指标口径快照卡</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">同一个名字，必须能复算出同一个数字</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="178" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="141" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">定义</text><text x="141" y="191" text-anchor="middle" font-size="13" fill="#48635f">成功是什么</text><text x="141" y="215" text-anchor="middle" font-size="13" fill="#48635f">副作用可核对</text>
    <rect x="250" y="122" width="178" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="339" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">分子</text><text x="339" y="191" text-anchor="middle" font-size="13" fill="#48635f">committed</text><text x="339" y="215" text-anchor="middle" font-size="13" fill="#48635f">receipt verified</text>
    <rect x="448" y="122" width="178" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="537" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">分母</text><text x="537" y="191" text-anchor="middle" font-size="13" fill="#48635f">eligible</text><text x="537" y="215" text-anchor="middle" font-size="13" fill="#48635f">unknown 单列</text>
    <rect x="646" y="122" width="178" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="735" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">切片</text><text x="735" y="191" text-anchor="middle" font-size="13" fill="#48635f">tenant / task</text><text x="735" y="215" text-anchor="middle" font-size="13" fill="#48635f">model version</text>
    <rect x="844" y="122" width="184" height="126" rx="17" fill="#173f3d"/><text x="936" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">版本</text><text x="936" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">contract-v3</text><text x="936" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">窗口 + owner</text>
  </g>
  <path d="M230 185h20M428 185h20M626 185h20M824 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">先固定口径，再谈指标涨跌</text>
</svg>
