<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">跨模态证据对齐</title>
  <desc id="desc">数值、单位和规则分别来自表格、图片脚注与正文，但通过对象和版本关系串起。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F4EE"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#193C3A">跨模态冲突先对齐对象</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#58706D">同一订单、同一版本、同一单位，才有资格比较置信度</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="206" height="126" rx="18" fill="#EAF3F7"/><text x="157" y="172" font-size="19" font-weight="700" fill="#275261">表格</text><text x="157" y="207" font-size="15" fill="#52727A">value</text><text x="157" y="233" font-size="15" fill="#52727A">cell + parent</text>
    <rect x="278" y="132" width="206" height="126" rx="18" fill="#E5F0ED"/><text x="381" y="172" font-size="19" font-weight="700" fill="#1C615A">图片脚注</text><text x="381" y="207" font-size="15" fill="#31514E">unit</text><text x="381" y="233" font-size="15" fill="#31514E">bbox + version</text>
    <rect x="502" y="132" width="206" height="126" rx="18" fill="#FFF0D6"/><text x="605" y="172" font-size="19" font-weight="700" fill="#875B26">正文规则</text><text x="605" y="207" font-size="15" fill="#6C5632">policy</text><text x="605" y="233" font-size="15" fill="#6C5632">source version</text>
    <rect x="726" y="132" width="302" height="126" rx="18" fill="#173F3D"/><text x="877" y="172" font-size="19" font-weight="700" fill="#FFFFFF">证据链</text><text x="877" y="207" font-size="15" fill="#D8EBE5">parent / version / unit</text><text x="877" y="233" font-size="15" fill="#D8EBE5">否则追问或拒答</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M260 195h18"/><path d="M484 195h18"/><path d="M708 195h18"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">引用路径要保留跨模态角色：数值、单位、规则各自可回指到具体区域</text>
</svg>
