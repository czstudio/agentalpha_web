<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">跨模态重排与去重</title><desc id="desc">文本、图片和表格候选统一打分，按区域和父文档去重后形成证据组</desc>
  <rect width="1080" height="360" rx="24" fill="#f7f8f5"/>
  <text x="52" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#173f3d">跨模态重排：不是“像”就应该进上下文</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#5b7470">模态匹配、版本一致、父文档关系一起决定证据位置</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="52" y="126" width="190" height="154" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="76" y="158" font-size="18" font-weight="700" fill="#173f3d">多路候选</text><text x="76" y="190" font-size="14" fill="#48635f">文本摘要</text><text x="76" y="216" font-size="14" fill="#48635f">图片区域</text><text x="76" y="242" font-size="14" fill="#48635f">表格行 / 空间关系</text>
    <rect x="290" y="126" width="220" height="154" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="314" y="158" font-size="18" font-weight="700" fill="#173f3d">统一重排</text><text x="314" y="190" font-size="14" fill="#48635f">semantic + lexical</text><text x="314" y="216" font-size="14" fill="#48635f">modality_fit</text><text x="314" y="242" font-size="14" fill="#48635f">version + parent_coherence</text>
    <rect x="558" y="126" width="220" height="154" rx="18" fill="#fae8e1" stroke="#e0b9ae"/><text x="582" y="158" font-size="18" font-weight="700" fill="#173f3d">两次去重</text><text x="582" y="190" font-size="14" fill="#48635f">同图整页 / 局部框</text><text x="582" y="216" font-size="14" fill="#48635f">同 parent_id + version</text><text x="582" y="242" font-size="14" fill="#48635f">合并为证据组</text>
    <rect x="826" y="126" width="202" height="154" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="850" y="158" font-size="18" font-weight="700" fill="#173f3d">可解释上下文</text><text x="850" y="190" font-size="14" fill="#48635f">每个槽位有理由</text><text x="850" y="216" font-size="14" fill="#48635f">可回链原图 / 单元格</text><text x="850" y="242" font-size="14" fill="#48635f">冲突时允许拒答</text>
  </g>
  <path d="M242 203h48M510 203h48M778 203h48" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
</svg>
