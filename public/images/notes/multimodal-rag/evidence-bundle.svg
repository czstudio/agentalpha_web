<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">多模态 RAG 证据包</title>
  <desc id="desc">证据包同时包含图片区域、表格行、来源版本和可点击引用。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <rect x="55" y="64" width="210" height="224" rx="18" fill="#eaf3f7" stroke="#a7c8d6"/><text x="160" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#24556a">E1 · image_region</text><rect x="86" y="126" width="148" height="95" rx="8" fill="#fff"/><path d="M100 200l42-42 28 25 22-30 30 47" fill="none" stroke="#5d94a7" stroke-width="5"/><text x="160" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#587783">p42 · bbox · 版本</text>
  <rect x="345" y="64" width="210" height="224" rx="18" fill="#f4dca6" stroke="#e5c58a"/><text x="450" y="103" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#704c20">E2 · table_row</text><path d="M375 138h150M375 178h150M430 118v100M490 118v100" stroke="#9a743e" stroke-width="3"/><text x="450" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#87683d">row · unit · parent</text>
  <path d="M265 176h72M555 176h72" stroke="#8eb8af" stroke-width="4" stroke-linecap="round"/><path d="m327 166 18 10-18 10M617 166l18 10-18 10" fill="#8eb8af"/>
  <rect x="637" y="104" width="210" height="145" rx="18" fill="#d7e9e2" stroke="#9bc1b5"/><text x="742" y="145" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#173f3d">回答</text><text x="742" y="177" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4c7068">结论 + E1/E2</text><text x="742" y="208" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4c7068">点击回原图/表格</text>
  <text x="55" y="324" font-family="sans-serif" font-size="16" fill="#647775">模型输出的是可归因结论，不是一堆没有来源的上下文。</text>
</svg>
