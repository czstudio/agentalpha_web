<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">跨模态冲突校验卡</title><desc id="desc">图片和表格冲突时先校验版本、单位、设备和空间关系</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">跨模态冲突：先验关系，再比置信度</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">看起来都相关，不代表它们属于同一个版本和单位</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">图片区域</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">panel-a / v2</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">24 V DC</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">表格行</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">panel-a / v1</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">24 kV</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">关系校验</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">version false</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">unit false</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">处置</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">clarify model</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">or refuse</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">留证</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">evidence_id</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">bbox / row</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">跨模态系统宁可追问型号，也不要把旧版数字拼进答案</text>
</svg>
