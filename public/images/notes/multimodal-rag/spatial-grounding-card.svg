<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">跨模态空间定位凭证</title><desc id="desc">图片区域、表格行、版本单位和最终判定组成空间证据包</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">跨模态证据包：先锁定空间范围</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">让每条结论都能回到页面中的准确区域</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">图片区域</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">page 42</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">bbox / region</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">表格行列</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">row 6</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">rated_voltage</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">版本 / 单位</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">same version</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">V DC</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">一致性</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">overlap 0.81</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">conflict = none</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">判定</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">grounded</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">可回链</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">没有空间范围的引用，只能证明“相关”，不能证明“支持”</text>
</svg>
