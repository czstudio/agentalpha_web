<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">多模态 RAG 查询路由</title>
  <desc id="desc">问题先判断证据类型，再选择文本、表格、图片区域和空间关系。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <rect x="50" y="118" width="220" height="116" rx="20" fill="#fff3dd" stroke="#e5c58a"/><text x="160" y="160" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#704c20">用户问题</text><text x="160" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#87683d">“蓝线接哪个端子？”</text>
  <path d="M270 176h112" stroke="#8eb8af" stroke-width="4" stroke-linecap="round"/><path d="m370 166 18 10-18 10" fill="#8eb8af"/>
  <rect x="388" y="92" width="176" height="168" rx="20" fill="#e9f1ed" stroke="#9bc1b5"/><text x="476" y="132" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#173f3d">查询路由</text><text x="476" y="166" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4c7068">where / visual</text><text x="476" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4c7068">table / amount</text><text x="476" y="222" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4c7068">compare / trend</text>
  <path d="M564 140h100M564 176h100M564 212h100" stroke="#8eb8af" stroke-width="4" stroke-linecap="round"/><path d="m654 130 18 10-18 10M654 166l18 10-18 10M654 202l18 10-18 10" fill="#8eb8af"/>
  <rect x="682" y="90" width="160" height="56" rx="14" fill="#eaf3f7"/><text x="762" y="125" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#24556a">图片区域</text>
  <rect x="682" y="152" width="160" height="56" rx="14" fill="#f4dca6"/><text x="762" y="187" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#704c20">表格 / OCR</text>
  <rect x="682" y="214" width="160" height="56" rx="14" fill="#f2eaf7"/><text x="762" y="249" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#604774">空间关系</text>
  <text x="50" y="320" font-family="sans-serif" font-size="16" fill="#647775">路由先缩小证据空间，再把相关模态交给重排器。</text>
</svg>
