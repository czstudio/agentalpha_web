<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">环境漂移扫描卡</title>
  <desc id="desc">打开复现包前比较预期与实际运行时指纹，发现漂移后降低结论等级。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">复现包打开前：先扫环境漂移</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">同一份 manifest，也要和真实运行时指纹对上</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="167" font-size="18" font-weight="700" fill="#275261">读取 bundle</text><text x="147" y="199" font-size="15" fill="#52727a">固定快照</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="167" font-size="18" font-weight="700" fill="#6e5223">采集指纹</text><text x="357" y="199" font-size="15" fill="#806a3d">镜像 / 驱动 / 时区</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="167" font-size="18" font-weight="700" fill="#2b6353">逐项 diff</text><text x="567" y="199" font-size="15" fill="#53786b">标出第一处漂移</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="167" font-size="18" font-weight="700" fill="#78454d">调整等级</text><text x="777" y="199" font-size="15" fill="#855c63">阻断或标注警告</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="175" font-size="18" font-weight="700" fill="#ffffff">可比较</text><text x="960" y="207" font-size="15" fill="#d8ebe5">留证据</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round"><path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/></g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">发现 cuda / fixture / timezone 漂移时，不把方向性回放伪装成严格复现</text>
</svg>
