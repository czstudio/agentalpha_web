<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">复现实验统计</title>
  <desc id="desc">按风险和长尾分配重复次数，报告置信区间与硬状态差异。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F4EE"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#193C3A">可复现还要报告不确定性</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#58706D">一次跑通不等于结论稳定，重复次数要按风险分配</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="206" height="126" rx="18" fill="#EAF3F7"/><text x="157" y="172" font-size="19" font-weight="700" fill="#275261">重复</text><text x="157" y="207" font-size="15" fill="#52727A">3 / 8 / 10</text><text x="157" y="233" font-size="15" fill="#52727A">按风险分层</text>
    <rect x="278" y="132" width="206" height="126" rx="18" fill="#E5F0ED"/><text x="381" y="172" font-size="19" font-weight="700" fill="#1C615A">配对</text><text x="381" y="207" font-size="15" fill="#31514E">same manifest</text><text x="381" y="233" font-size="15" fill="#31514E">same fixture</text>
    <rect x="502" y="132" width="206" height="126" rx="18" fill="#FFF0D6"/><text x="605" y="172" font-size="19" font-weight="700" fill="#875B26">统计</text><text x="605" y="207" font-size="15" fill="#6C5632">mean + CI95</text><text x="605" y="233" font-size="15" fill="#6C5632">unknown rate</text>
    <rect x="726" y="132" width="302" height="126" rx="18" fill="#173F3D"/><text x="877" y="182" font-size="19" font-weight="700" fill="#FFFFFF">门禁</text><text x="877" y="218" font-size="15" fill="#D8EBE5">hard state diff = 0</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M260 195h18"/><path d="M484 195h18"/><path d="M708 195h18"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">平均成功率稳定也不够：安全、unknown 和高风险切片要有独立上限</text>
</svg>
