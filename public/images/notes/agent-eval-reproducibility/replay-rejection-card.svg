<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">复现验收拒绝卡</title><desc id="desc">失败原因、检查项、责任人和重跑条件组成不可判定记录</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">复现验收拒绝卡：跑不起来不等于通过</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">先分类原因，再决定重跑、修环境还是判定失败</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">Bundle</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">r39-0042</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">样本锁定</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">原因</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">fixture 过期</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">不可判定</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">检查</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">manifest ✓</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">tool fixture ×</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">责任人</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">platform-eval</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">刷新 fixture</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">重跑</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">同一包</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">不改样本</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">不可判定率也是评测基础设施的健康指标</text>
</svg>
