<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MoE 负载均衡与容量</title>
  <desc id="desc">左侧显示路由倾斜导致热门专家溢出，右侧显示均衡分配和容量余量。</desc>
  <rect width="1200" height="520" rx="24" fill="#f7f3ec"/>
  <text x="70" y="70" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#323e3e">路由不是只要“选得准”，还要“分得开”</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <text x="100" y="132" font-size="20" font-weight="700" fill="#ce741e">倾斜路由</text><text x="680" y="132" font-size="20" font-weight="700" fill="#7fb069">均衡路由</text>
    <g fill="#fffaf1" stroke="#d8c7b4" stroke-width="1"><rect x="90" y="165" width="420" height="260" rx="14"/><rect x="670" y="165" width="420" height="260" rx="14"/></g>
    <g fill="#ce741e"><rect x="135" y="230" width="52" height="140" rx="7"/><rect x="225" y="278" width="52" height="92" rx="7"/><rect x="315" y="310" width="52" height="60" rx="7"/><rect x="405" y="330" width="52" height="40" rx="7"/></g>
    <g fill="#7fb069"><rect x="715" y="274" width="52" height="96" rx="7"/><rect x="805" y="266" width="52" height="104" rx="7"/><rect x="895" y="280" width="52" height="90" rx="7"/><rect x="985" y="270" width="52" height="100" rx="7"/></g>
    <g stroke="#625e58" stroke-width="2"><path d="M120 370h350M700 370h350"/></g>
    <g fill="#323e3e" font-size="16" text-anchor="middle"><text x="161" y="400">E1 热门</text><text x="251" y="400">E2</text><text x="341" y="400">E3</text><text x="431" y="400">E4 冷门</text><text x="741" y="400">E1</text><text x="831" y="400">E2</text><text x="921" y="400">E3</text><text x="1011" y="400">E4</text></g>
    <text x="300" y="205" font-size="15" fill="#7b7770">容量线 ─────────</text><path d="M130 220H470" stroke="#ce741e" stroke-width="2" stroke-dasharray="6 6"/><text x="880" y="205" font-size="15" fill="#7b7770">capacity factor 留余量</text><path d="M710 250H1050" stroke="#7fb069" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="90" y="470" font-size="16" fill="#7b7770">热门专家溢出 → 丢 token、热点卡、冷门专家没训练信号</text><text x="670" y="470" font-size="16" fill="#7b7770">均衡不等于最优，但至少让容量与通信可控</text>
  </g>
</svg>
