<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">未知状态回放</title><desc id="desc">未知样本、抽样、归类、影响分析和发布决策组成评测未知状态回放</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">未知回放：别把“没判定”当成成功</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">未知桶的变化，可能只是标注流程变化</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">未知桶</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">timeout / abstain</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">unknown_n</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">抽样</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">seed fixed</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">slice aware</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">归类</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">label / infra</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">policy / data</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">影响</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">success delta</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">risk slice</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">决策</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">ship / hold</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">owner</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">未知率下降要先解释原因，再决定是否真的更好了</text>
</svg>
