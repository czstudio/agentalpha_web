<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Agent 评测切片</title><desc id="desc">按能力和故障类型拆分评测集。</desc><rect width="900" height="380" rx="28" fill="#f7f8f5"/><g font-family="sans-serif"><text x="68" y="66" font-size="20" font-weight="700" fill="#173f3d">评测集 = 能力切片 × 故障扰动</text><text x="68" y="98" font-size="14" fill="#68706c">不要只随机抽题，先确认覆盖了哪些责任边界。</text><g transform="translate(70 140)"><rect width="210" height="70" rx="14" fill="#dfeee8"/><text x="105" y="31" text-anchor="middle" font-size="16" font-weight="700" fill="#173f3d">事实与状态</text><text x="105" y="54" text-anchor="middle" font-size="13" fill="#52706b">字段、金额、权限</text><rect x="230" width="210" height="70" rx="14" fill="#eaf3f7"/><text x="335" y="31" text-anchor="middle" font-size="16" font-weight="700" fill="#24556a">规划与工具</text><text x="335" y="54" text-anchor="middle" font-size="13" fill="#5a737d">顺序、参数、停止</text><rect x="460" width="210" height="70" rx="14" fill="#fff1d9"/><text x="565" y="31" text-anchor="middle" font-size="16" font-weight="700" fill="#704c20">证据与表达</text><text x="565" y="54" text-anchor="middle" font-size="13" fill="#856a42">引用、澄清、拒答</text></g><g transform="translate(70 250)"><rect width="210" height="58" rx="14" fill="#fae8e1"/><text x="105" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#753f32">超时 / 空响应</text><rect x="230" width="210" height="58" rx="14" fill="#f0eee8"/><text x="335" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#4b514e">重复 / 乱序</text><rect x="460" width="210" height="58" rx="14" fill="#eaf3f7"/><text x="565" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#24556a">权限 / 副作用</text></g></g></svg>
