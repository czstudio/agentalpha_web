<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390"><rect width="1080" height="390" rx="28" fill="#f7f9fc"/><text x="56" y="62" font-family="Arial,'PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#172033">WILSON RELEASE GATE · 置信下界闸门</text><text x="56" y="94" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#637083">点估计先经过不确定性，再决定是否放量</text><g font-family="Arial,'PingFang SC',sans-serif"><rect x="56" y="138" width="214" height="148" rx="18" fill="#e8f0ff" stroke="#b7ccf0"/><text x="78" y="174" font-size="16" font-weight="700" fill="#244a83">01 · 样本</text><text x="78" y="211" font-size="15" fill="#3b4d67">success / total</text><text x="78" y="239" font-size="15" fill="#3b4d67">slice identity</text><rect x="310" y="138" width="214" height="148" rx="18" fill="#edf8f1" stroke="#b8ddc6"/><text x="332" y="174" font-size="16" font-weight="700" fill="#296444">02 · 区间</text><text x="332" y="211" font-size="15" fill="#3e5a4b">Wilson lower bound</text><text x="332" y="239" font-size="15" fill="#3e5a4b">z / n</text><rect x="564" y="138" width="214" height="148" rx="18" fill="#fff4df" stroke="#e5c98d"/><text x="586" y="174" font-size="16" font-weight="700" fill="#7b571a">03 · 约束</text><text x="586" y="211" font-size="15" fill="#6a5734">min samples</text><text x="586" y="239" font-size="15" fill="#6a5734">hard failures</text><rect x="818" y="138" width="206" height="148" rx="18" fill="#f2ecff" stroke="#cfc0ee"/><text x="840" y="174" font-size="16" font-weight="700" fill="#5b428f">04 · 决策</text><text x="840" y="211" font-size="15" fill="#5d5370">release</text><text x="840" y="239" font-size="15" fill="#5d5370">hold / sample more</text></g><path d="M278 212h22m224 0h22m224 0h22" stroke="#8a98aa" stroke-width="3"/><path d="m294 204 10 8-10 8m240-8 10 8-10 8m240-8 10 8-10 8" fill="none" stroke="#8a98aa" stroke-width="3"/><text x="56" y="344" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#637083"