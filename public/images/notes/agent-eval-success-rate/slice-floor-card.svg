<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">切片成功率与最小样本门槛</title><desc id="desc">切片分母、置信区间和最小样本门槛共同决定发布资格</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">切片成功率：先问分母，再问能否放量</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">低频高风险任务不能被总体流量稀释</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">原始分母</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">n / success</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">hard failure</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">不确定性</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">CI95</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">slice mix</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">门槛</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">min_n</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">zero hard-fail</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">发布资格</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">eligible / observe</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">hold risky path</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">总体分数只是摘要，切片门槛才决定风险路径是否能发布</text>
</svg>
