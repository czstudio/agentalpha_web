<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">提议、命令与结果分离</title>
  <desc id="desc">模型生成的提议不等于已经执行的命令，工具回传的结果也必须保留状态和证据。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="60" y="72" width="220" height="194" rx="20" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="170" y="113" font-size="22" font-weight="700" fill="#24556a">Proposal</text><text x="170" y="151" font-size="16" fill="#5a737d">模型想做什么</text><text x="170" y="190" font-size="14" fill="#5a737d">可被拒绝、改写、补问</text><text x="170" y="228" font-size="14" fill="#5a737d">还没有副作用</text>
    <rect x="340" y="72" width="220" height="194" rx="20" fill="#fff1d9" stroke="#e8c891"/>
    <text x="450" y="113" font-size="22" font-weight="700" fill="#704c20">Command</text><text x="450" y="151" font-size="16" fill="#856a42">系统准许做什么</text><text x="450" y="190" font-size="14" fill="#856a42">经过 schema 与 policy</text><text x="450" y="228" font-size="14" fill="#856a42">带 request_id 与幂等键</text>
    <rect x="620" y="72" width="220" height="194" rx="20" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="730" y="113" font-size="22" font-weight="700" fill="#173f3d">Result</text><text x="730" y="151" font-size="16" fill="#52706b">外部系统实际发生了什么</text><text x="730" y="190" font-size="14" fill="#52706b">状态、摘要、证据</text><text x="730" y="228" font-size="14" fill="#52706b">成功、失败或未知</text>
  </g>
  <g fill="none" stroke="#86a59d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M280 169h60l-10-8m10 8-10 8"/><path d="M560 169h60l-10-8m10 8-10 8"/></g>
</svg>
