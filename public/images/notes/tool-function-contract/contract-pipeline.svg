<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Function Calling 契约链路</title>
  <desc id="desc">模型提议经过解析、校验、策略检查、执行和回执后才成为一次可靠的工具调用。</desc>
  <rect width="980" height="300" rx="28" fill="#f7f8f5"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="34" y="92" width="150" height="94" rx="18" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="109" y="128" font-size="18" font-weight="700" fill="#24556a">模型提议</text><text x="109" y="157" font-size="14" fill="#5a737d">name + arguments</text>
    <rect x="214" y="92" width="150" height="94" rx="18" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="289" y="128" font-size="18" font-weight="700" fill="#173f3d">解析与 schema</text><text x="289" y="157" font-size="14" fill="#52706b">类型、必填、范围</text>
    <rect x="394" y="92" width="150" height="94" rx="18" fill="#fff1d9" stroke="#e8c891"/>
    <text x="469" y="128" font-size="18" font-weight="700" fill="#704c20">策略网关</text><text x="469" y="157" font-size="14" fill="#856a42">身份、权限、预算</text>
    <rect x="574" y="92" width="150" height="94" rx="18" fill="#fae8e1" stroke="#e0b9ae"/>
    <text x="649" y="128" font-size="18" font-weight="700" fill="#753f32">执行适配器</text><text x="649" y="157" font-size="14" fill="#8c5d51">超时、重试、幂等</text>
    <rect x="754" y="92" width="190" height="94" rx="18" fill="#173f3d"/>
    <text x="849" y="128" font-size="18" font-weight="700" fill="#fff">结构化回执</text><text x="849" y="157" font-size="14" fill="#dfeee8">result + evidence</text>
  </g>
  <g fill="none" stroke="#86a59d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M184 139h30l-9-7m9 7-9 7"/><path d="M364 139h30l-9-7m9 7-9 7"/><path d="M544 139h30l-9-7m9 7-9 7"/><path d="M724 139h30l-9-7m9 7-9 7"/></g>
</svg>
