<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">工具契约状态探针</title>
  <desc id="desc">把拒绝、超时、部分成功和幂等回读映射到不同动作边界。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F4EE"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#193C3A">工具契约状态探针</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#58706D">不要只断言 200：状态决定 Agent 下一步</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="130" width="206" height="128" rx="18" fill="#F5D9DC"/><text x="157" y="171" font-size="19" font-weight="700" fill="#78454D">拒绝</text><text x="157" y="207" font-size="15" fill="#855C63">403 / policy</text><text x="157" y="233" font-size="15" fill="#855C63">clarify</text>
    <rect x="278" y="130" width="206" height="128" rx="18" fill="#FFF0D6"/><text x="381" y="171" font-size="19" font-weight="700" fill="#875B26">未知</text><text x="381" y="207" font-size="15" fill="#6C5632">timeout</text><text x="381" y="233" font-size="15" fill="#6C5632">reconcile</text>
    <rect x="502" y="130" width="206" height="128" rx="18" fill="#E5F0ED"/><text x="605" y="171" font-size="19" font-weight="700" fill="#1C615A">部分成功</text><text x="605" y="207" font-size="15" fill="#31514E">207 / side effect</text><text x="605" y="233" font-size="15" fill="#31514E">read back</text>
    <rect x="726" y="130" width="206" height="128" rx="18" fill="#DCEBE8"/><text x="829" y="171" font-size="19" font-weight="700" fill="#174F4A">幂等回读</text><text x="829" y="207" font-size="15" fill="#31514E">same request_id</text><text x="829" y="233" font-size="15" fill="#31514E">return existing</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M260 194h18"/><path d="M484 194h18"/><path d="M708 194h18"/></g>
  <rect x="54" y="296" width="878" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">拒绝、未知、部分成功都要有稳定内部状态，不能把供应商堆栈直接交给模型</text>
</svg>
