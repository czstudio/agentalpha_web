<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">授权撤销演练</title><desc id="desc">审批、授权范围、撤销、异步队列和最终阻断组成撤销演练</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">高风险授权：必须能撤销和阻断</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">审批与执行之间的时间差，正是事故窗口</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">审批</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">resource / fields</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">short expiry</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">撤销</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">role changed</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">decision revoked</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">队列</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">async dispatch</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">old token</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">重校验</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">expiry / hash</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">revoke state</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">阻断</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">no side effect</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">audit</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">审批是起点，执行前复核和撤销才是边界</text>
</svg>
