<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">安全授权决策卡</title><desc id="desc">主体、资源、策略判断、义务和回执共同构成一次授权决策</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">安全授权决策卡</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">拒绝也要告诉系统下一步怎么收敛</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="180" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="142" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">主体</text><text x="142" y="191" text-anchor="middle" font-size="13" fill="#48635f">user + tenant</text><text x="142" y="215" text-anchor="middle" font-size="13" fill="#48635f">环境与角色</text>
    <rect x="252" y="122" width="180" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="342" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">目标</text><text x="342" y="191" text-anchor="middle" font-size="13" fill="#48635f">resource + action</text><text x="342" y="215" text-anchor="middle" font-size="13" fill="#48635f">字段与额度</text>
    <rect x="452" y="122" width="180" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="542" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">判断</text><text x="542" y="191" text-anchor="middle" font-size="13" fill="#48635f">allow / deny</text><text x="542" y="215" text-anchor="middle" font-size="13" fill="#48635f">reason_code</text>
    <rect x="652" y="122" width="180" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="742" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">义务</text><text x="742" y="191" text-anchor="middle" font-size="13" fill="#48635f">脱敏 / 审批</text><text x="742" y="215" text-anchor="middle" font-size="13" fill="#48635f">重新核对</text>
    <rect x="852" y="122" width="176" height="126" rx="17" fill="#173f3d"/><text x="940" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回执</text><text x="940" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">decision_id</text><text x="940" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">审计与过期</text>
  </g>
  <path d="M232 185h20M432 185h20M632 185h20M832 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">对用户说清边界，对审计保留完整规则命中</text>
</svg>
