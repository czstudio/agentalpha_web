<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Tool call mediation</title>
  <desc id="desc">A tool call passes schema, policy, approval and execution checks before producing an audited result.</desc>
  <rect width="1200" height="500" rx="28" fill="#f7f8f5"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#17211d">Valid JSON is not automatically a valid action</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="16" fill="#5f6d66">Schema validates shape; policy validates permission; approval validates risk.</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="184" width="190" height="100" rx="16" fill="#e7f2ef" stroke="#4d9d8e" stroke-width="2"/>
    <text x="126" y="224" font-size="20" font-weight="700" fill="#246d60">模型意图</text>
    <text x="103" y="253" font-size="15" fill="#314d47">tool + args</text>
    <path d="M260 234h58" stroke="#6d8c82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="318" y="184" width="190" height="100" rx="16" fill="#ffffff" stroke="#9ab8ad" stroke-width="2"/>
    <text x="384" y="224" font-size="20" font-weight="700" fill="#21473d">Schema</text>
    <text x="350" y="253" font-size="15" fill="#5f6d66">types · required</text>
    <path d="M508 234h58" stroke="#6d8c82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="566" y="184" width="190" height="100" rx="16" fill="#f4e7d9" stroke="#bc8052" stroke-width="2"/>
    <text x="615" y="224" font-size="20" font-weight="700" fill="#8f5430">策略</text>
    <text x="593" y="253" font-size="15" fill="#5a3f31">who · resource · action</text>
    <path d="M756 234h58" stroke="#6d8c82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="814" y="184" width="150" height="100" rx="16" fill="#f0eee3" stroke="#b8a766" stroke-width="2"/>
    <text x="855" y="224" font-size="20" font-weight="700" fill="#7a681d">审批</text>
    <text x="838" y="253" font-size="15" fill="#514b31">risk gate</text>
    <path d="M964 234h58" stroke="#6d8c82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1022" y="184" width="130" height="100" rx="16" fill="#217d6e"/>
    <text x="1054" y="224" font-size="20" font-weight="700" fill="#ffffff">执行</text>
    <text x="1045" y="253" font-size="15" fill="#d8efe7">receipt</text>
  </g>
  <rect x="222" y="360" width="760" height="60" rx="16" fill="#ffffff" stroke="#d5ddd8"/>
  <text x="267" y="397" font-family="Arial, sans-serif" font-size="16" fill="#5f6d66">任一层拒绝：不执行 + 写审计事件 + 返回可解释原因</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#6d8c82"/></marker></defs>
</svg>
