<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">偏好稳定性卡</title>
  <desc id="desc">改写、盲评和工具结果复核共同检查标签是否可训练</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Preference stability</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">确认偏好来自任务质量，而不是长度、格式和语气</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">Pair</text>
    <text x="147" y="194" font-size="15" fill="#365b61">chosen / rejected</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">同题对比</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">改写</text>
    <text x="357" y="194" font-size="15" fill="#365b61">paraphrase</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">观察翻转率</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">盲评</text>
    <text x="567" y="194" font-size="15" fill="#365b61">agreement</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">去掉展示偏差</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">工具结果</text>
    <text x="777" y="194" font-size="15" fill="#365b61">hard eval</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">任务可归因</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">发布</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">分桶监控</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">稳定偏好</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：偏好在改写、盲评和真实任务结果下仍稳定，才进入训练</text>
</svg>
