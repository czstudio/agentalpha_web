<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">偏好对质量检查</title>
  <desc id="desc">DPO 偏好数据需要检查事实、任务完成、风格、安全和长度偏置。</desc>
  <rect width="1200" height="410" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">chosen 不是“写得更长”的同义词</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="15">
    <rect x="70" y="145" width="180" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="160" y="178" fill="#1d1d1f" font-weight="700">事实</text><text x="160" y="202" fill="#6b6e70">有没有说对</text>
    <rect x="285" y="145" width="180" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="375" y="178" fill="#1d1d1f" font-weight="700">任务</text><text x="375" y="202" fill="#6b6e70">有没有完成</text>
    <rect x="500" y="145" width="180" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="590" y="178" fill="#1d1d1f" font-weight="700">边界</text><text x="590" y="202" fill="#6b6e70">有没有越权</text>
    <rect x="715" y="145" width="180" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="805" y="178" fill="#1d1d1f" font-weight="700">表达</text><text x="805" y="202" fill="#6b6e70">是否自然清楚</text>
    <rect x="930" y="145" width="200" height="78" rx="14" fill="#e6f1ed" stroke="#9bc9bc"/><text x="1030" y="178" fill="#1d1d1f" font-weight="700">长度偏置</text><text x="1030" y="202" fill="#6b6e70">不能替代质量</text>
    <g fill="#247a6b" font-size="26"><text x="265" y="190">→</text><text x="480" y="190">→</text><text x="695" y="190">→</text><text x="910" y="190">→</text></g>
    <rect x="170" y="285" width="860" height="56" rx="12" fill="#ffffff" stroke="#dfe4df"/>
    <text x="600" y="320" fill="#247a6b">偏好对要能解释“为什么赢”，而不是只记录“谁被选中”</text>
  </g>
</svg>
