<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">SFT 监督覆盖率</title>
  <desc id="desc">把 mask 正确性与不同任务桶实际获得的 loss 预算分开审计。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">监督覆盖率</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">mask 没有偏移，不代表关键行为拿到了足够的训练预算</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="222" height="132" rx="17" fill="#dcecf4"/>
    <text x="75" y="154" font-size="17" font-weight="700" fill="#244f62">token mask</text>
    <text x="75" y="184" font-size="13" fill="#365e67">assistant 计算 loss</text>
    <text x="75" y="210" font-size="13" fill="#365e67">system / user 默认屏蔽</text>
    <rect x="292" y="122" width="222" height="132" rx="17" fill="#f4e9bd"/>
    <text x="315" y="154" font-size="17" font-weight="700" fill="#5a4b19">bucket</text>
    <text x="315" y="184" font-size="13" fill="#786726">tool / refusal / grounded</text>
    <text x="315" y="210" font-size="13" fill="#786726">按任务与风险切片</text>
    <rect x="532" y="122" width="222" height="132" rx="17" fill="#f4dfe5"/>
    <text x="555" y="154" font-size="17" font-weight="700" fill="#6b3349">coverage</text>
    <text x="555" y="184" font-size="13" fill="#7d5060">loss token / 全部 loss</text>
    <text x="555" y="210" font-size="13" fill="#7d5060">发现“有样本没信号”</text>
    <rect x="772" y="122" width="222" height="132" rx="17" fill="#173f3d"/>
    <text x="795" y="154" font-size="17" font-weight="700" fill="#f7f8f5">rebalance</text>
    <text x="795" y="184" font-size="13" fill="#d8e7e1">重采样 / 修模板</text>
    <text x="795" y="210" font-size="13" fill="#d8e7e1">再用固定集验证行为</text>
  </g>
  <path d="M274 188H286M514 188H526M754 188H766" fill="none" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <path d="m280 180 8 8-8 8M520 180l8 8-8 8M760 180l8 8-8 8" fill="none" stroke="#7d9a95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="52" y="296" width="976" height="42" rx="14" fill="#e8efeb"/>
  <text x="78" y="323" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#173f3d">监督覆盖率是训练预算的账本，不是模型质量的替代品</text>
</svg>
