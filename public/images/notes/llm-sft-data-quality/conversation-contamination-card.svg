  <path d="M726 211h62" stroke="#86A4D7" stroke-width="6" stroke-linecap="round"/><path d="m774 192 25 19-25 19" fill="none" stroke="#86A4D7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
