<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">SFT 对话打包 mask 探针</title>
  <desc id="desc">角色边界、assistant mask 和事件隔离一起验收。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F4EE"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#193C3A">SFT 对话打包：边界和 mask 一起验</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#58706D">训练 assistant，不要把用户隐私和工具回执误当监督信号</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="206" height="126" rx="18" fill="#EAF3F7"/><text x="157" y="172" font-size="19" font-weight="700" fill="#275261">system</text><text x="157" y="207" font-size="15" fill="#52727A">loss = 0</text><text x="157" y="233" font-size="15" fill="#52727A">span checked</text>
    <rect x="278" y="132" width="206" height="126" rx="18" fill="#FFF0D6"/><text x="381" y="172" font-size="19" font-weight="700" fill="#875B26">user</text><text x="381" y="207" font-size="15" fill="#6C5632">loss = 0</text><text x="381" y="233" font-size="15" fill="#6C5632">event isolated</text>
    <rect x="502" y="132" width="206" height="126" rx="18" fill="#E5F0ED"/><text x="605" y="172" font-size="19" font-weight="700" fill="#1C615A">assistant</text><text x="605" y="207" font-size="15" fill="#31514E">loss = 1</text><text x="605" y="233" font-size="15" fill="#31514E">train target</text>
    <rect x="726" y="132" width="302" height="126" rx="18" fill="#173F3D"/><text x="877" y="172" font-size="19" font-weight="700" fill="#FFFFFF">token 回放</text><text x="877" y="207" font-size="15" fill="#D8EBE5">role spans roundtrip</text><text x="877" y="233" font-size="15" fill="#D8EBE5">cross-event = blocked</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M260 195h18"/><path d="M484 195h18"/><path d="M708 195h18"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">loss 下降不是目标，监督信号落在正确角色上才是可交付门槛</text>
</svg>
