<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">SFT 训练验收闭环</title>
  <desc id="desc">训练前冻结基线，训练后按能力、格式、安全、回归四类评测，失败时回到数据而不是盲目加轮数。</desc>
  <rect width="1200" height="390" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">训练闭环：失败先回到数据</text>
  <text x="58" y="88" fill="#6b6e70" font-family="Arial, sans-serif" font-size="16">loss 只是训练信号，能否交付要看固定回归集和真实任务</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="16">
    <rect x="70" y="155" width="190" height="76" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="165" y="187" fill="#1d1d1f" font-weight="700">冻结基线</text><text x="165" y="211" fill="#6b6e70">任务 / 版本 / seed</text>
    <rect x="310" y="155" width="190" height="76" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="405" y="187" fill="#1d1d1f" font-weight="700">SFT 训练</text><text x="405" y="211" fill="#6b6e70">mask + checkpoint</text>
    <rect x="550" y="155" width="190" height="76" rx="14" fill="#e6f1ed" stroke="#9bc9bc"/><text x="645" y="187" fill="#1d1d1f" font-weight="700">分层评测</text><text x="645" y="211" fill="#6b6e70">能力 / 安全 / 格式</text>
    <rect x="790" y="155" width="190" height="76" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="885" y="187" fill="#1d1d1f" font-weight="700">bad case 归因</text><text x="885" y="211" fill="#6b6e70">数据 / 目标 / 过拟合</text>
    <g fill="#247a6b" font-size="28"><text x="280" y="201">→</text><text x="520" y="201">→</text><text x="760" y="201">→</text></g>
    <path d="M885 255 C885 316 258 316 165 255" fill="none" stroke="#247a6b" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="600" y="345" fill="#247a6b">失败时回到可解释的环节，而不是只增加 epochs</text>
  </g>
</svg>
