<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">SFT 数据发布回执</title><desc id="desc">来源、去重、泄漏、难例和发布决定组成训练数据验收链路</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">SFT 数据发布回执：先把污染对账清楚</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">样本数量不是质量，来源和边界才是发布依据</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">来源</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">时间窗口</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">raw 182k</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">去重</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">exact / semantic</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">保留理由</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">泄漏</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">train / eval = 0</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">benchmark = 0</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">难例 / mask</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">unsupported</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">assistant only</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">发布</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">排除污染</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">可签字</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">先证明没有污染，再讨论 loss 降了多少</text>
</svg>
