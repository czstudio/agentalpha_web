<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">并发分支关闭回执</title>
  <desc id="desc">取消、未知和补偿路径分开核对</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Branch closeout</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">取消只是本地状态，副作用要用回执关闭</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">DAG</text>
    <text x="147" y="194" font-size="15" fill="#365b61">分支清单</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">branch_id</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">取消</text>
    <text x="357" y="194" font-size="15" fill="#365b61">cancelled</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">保留发送证据</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">未知</text>
    <text x="567" y="194" font-size="15" fill="#365b61">provider 对账</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">冻结自动重放</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">副作用</text>
    <text x="777" y="194" font-size="15" fill="#365b61">补偿或接管</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">写入审计账本</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">恢复</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">只重放</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">无发送证据</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：completed / cancelled / unknown 分账，未知分支先对账再恢复</text>
</svg>
