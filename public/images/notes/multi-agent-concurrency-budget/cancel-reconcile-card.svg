<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">并发取消与对账</title>
  <desc id="desc">先停止新工作，再收拢在途请求，最后用恢复配额关闭 unknown。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F8F5"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#173F3D">取消不是结束：还要收拢 unknown</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#5B7470">超时后的写操作不能被简单标成失败</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="214" height="126" rx="18" fill="#EAF3F7"/><text x="161" y="172" font-size="19" font-weight="700" fill="#275261">停止新工作</text><text x="161" y="207" font-size="15" fill="#52727A">draining</text><text x="161" y="233" font-size="15" fill="#52727A">no new tasks</text>
    <rect x="292" y="132" width="214" height="126" rx="18" fill="#FFF0D6"/><text x="399" y="172" font-size="19" font-weight="700" fill="#875B26">收拢在途</text><text x="399" y="207" font-size="15" fill="#6C5632">cancel / pending</text><text x="399" y="233" font-size="15" fill="#6C5632">state = unknown</text>
    <rect x="530" y="132" width="214" height="126" rx="18" fill="#E5F0ED"/><text x="637" y="172" font-size="19" font-weight="700" fill="#1C615A">恢复查询</text><text x="637" y="207" font-size="15" fill="#31514E">request_id</text><text x="637" y="233" font-size="15" fill="#31514E">idempotency ledger</text>
    <rect x="768" y="132" width="260" height="126" rx="18" fill="#173F3D"/><text x="898" y="182" font-size="19" font-weight="700" fill="#FFFFFF">关闭</text><text x="898" y="218" font-size="15" fill="#D8EBE5">committed / failed / gap</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M268 195h24"/><path d="M506 195h24"/><path d="M744 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">只有远端回执、幂等账本和本地状态对上，unknown 才能关闭</text>
</svg>
