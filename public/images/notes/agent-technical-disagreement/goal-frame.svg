<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">争议目标框</title><desc id="desc">目标、指标、约束和方案被分层，避免把偏好当事实。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><rect x="120" y="58" width="660" height="286" rx="22" fill="#fff" stroke="#86a59d" stroke-width="3"/><rect x="156" y="92" width="588" height="52" rx="14" fill="#173f3d"/><text x="450" y="126" fill="#fff" font-size="19" font-weight="700">共同目标：在约束下完成什么</text><rect x="156" y="162" width="280" height="60" rx="14" fill="#eaf3f7" stroke="#24556a"/><text x="296" y="198" font-size="17" font-weight="700">指标：怎样算有效</text><rect x="464" y="162" width="280" height="60" rx="14" fill="#dfeee8" stroke="#86a59d"/><text x="604" y="198" font-size="17" font-weight="700">约束：不能牺牲什么</text><rect x="156" y="240" width="588" height="60" rx="14" fill="#fff1d9" stroke="#c69a58"/><text x="450" y="276" font-size="17" font-weight="700">方案：只是实现路径，不是目标本身</text></g></svg>
