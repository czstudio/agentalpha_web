<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">技术争议证据卡</title><desc id="desc">主张、样本、版本、护栏和决策边界组成可复查的证据卡</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">争议证据卡：先把结论放回边界里</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">同一个平均分，换一组样本可能就是另一条决策</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="182" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="143" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">主张</text><text x="143" y="190" text-anchor="middle" font-size="13" fill="#48635f">hybrid 更好？</text><text x="143" y="214" text-anchor="middle" font-size="13" fill="#48635f">先写可证伪句子</text>
    <rect x="254" y="122" width="182" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="345" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">样本与版本</text><text x="345" y="190" text-anchor="middle" font-size="13" fill="#48635f">long_query / private_docs</text><text x="345" y="214" text-anchor="middle" font-size="13" fill="#48635f">run-204 · n=1200</text>
    <rect x="456" y="122" width="182" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="547" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">护栏</text><text x="547" y="190" text-anchor="middle" font-size="13" fill="#48635f">P95 &lt; 1s</text><text x="547" y="214" text-anchor="middle" font-size="13" fill="#48635f">cross_tenant = 0</text>
    <rect x="658" y="122" width="182" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="749" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">边界</text><text x="749" y="190" text-anchor="middle" font-size="13" fill="#48635f">短问题未证明</text><text x="749" y="214" text-anchor="middle" font-size="13" fill="#48635f">不能全量外推</text>
    <rect x="860" y="122" width="168" height="126" rx="17" fill="#173f3d"/><text x="944" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">决策</text><text x="944" y="190" text-anchor="middle" font-size="13" fill="#dbe9e5">canary_only</text><text x="944" y="214" text-anchor="middle" font-size="13" fill="#dbe9e5">七天后复查</text>
  </g>
  <path d="M234 185h20M436 185h20M638 185h20M840 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">链接 trace · 脚本 · 失败样本：下次争议从证据卡继续</text>
</svg>
