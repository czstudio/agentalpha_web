<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">技术争议闭环</title><desc id="desc">共同目标、假设、实验、决策和复查将争议转成事实。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><path d="M120 210a330 140 0 1 0 660 0a330 140 0 1 0-660 0" fill="none" stroke="#dfeee8" stroke-width="34"/><g font-size="17" font-weight="700"><rect x="67" y="180" width="145" height="60" rx="14" fill="#eaf3f7" stroke="#24556a"/><text x="139" y="217">共同目标</text><rect x="220" y="65" width="145" height="60" rx="14" fill="#fff1d9" stroke="#c69a58"/><text x="292" y="102">假设</text><rect x="378" y="35" width="145" height="60" rx="14" fill="#dfeee8" stroke="#86a59d"/><text x="450" y="72">实验</text><rect x="535" y="65" width="145" height="60" rx="14" fill="#fae8e1" stroke="#b96d59"/><text x="607" y="102">决策</text><rect x="688" y="180" width="145" height="60" rx="14" fill="#173f3d"/><text x="760" y="217" fill="#fff">复查</text></g><text x="450" y="330" font-size="17" fill="#4d6562">不是让某个人赢，是让约束可验证</text></g></svg>
