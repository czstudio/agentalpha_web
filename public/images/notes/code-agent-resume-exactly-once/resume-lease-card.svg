<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">恢复租约与 fencing token</title>
  <desc id="desc">恢复 UNKNOWN 操作时先取得短租约，用递增 fencing token 拒绝旧 worker 写入。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">恢复 UNKNOWN：先确认谁有资格写</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">幂等键合并意图，fencing token 关闭旧 worker 的写入口</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="167" font-size="18" font-weight="700" fill="#275261">发现 UNKNOWN</text><text x="147" y="199" font-size="15" fill="#52727a">同一 operation</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="167" font-size="18" font-weight="700" fill="#6e5223">领取租约</text><text x="357" y="199" font-size="15" fill="#806a3d">短时 owner</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="167" font-size="18" font-weight="700" fill="#2b6353">递增 token</text><text x="567" y="199" font-size="15" fill="#53786b">新旧可比较</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="167" font-size="18" font-weight="700" fill="#78454d">提交校验</text><text x="777" y="199" font-size="15" fill="#855c63">拒绝过期写</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="175" font-size="18" font-weight="700" fill="#ffffff">唯一写者</text><text x="960" y="207" font-size="15" fill="#d8ebe5">可审计</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round"><path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/></g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">旧 worker 即使晚到，也只能读到已接管，不能覆盖 checkpoint</text>
</svg>
