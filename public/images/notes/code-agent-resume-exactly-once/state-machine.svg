<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Code Agent 可恢复状态机</title>
  <desc id="desc">从计划到运行、成功、失败和未知状态的持久化工作流。</desc>
  <rect width="1200" height="640" fill="#f7f4ee"/>
  <text x="72" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17221b">恢复的核心是状态机，不是继续生成上一段文本</text>
  <text x="72" y="106" font-family="Arial,sans-serif" font-size="16" fill="#627066">UNKNOWN 是一个正式状态：先查事实，再决定是否重试。</text>
  <g font-family="Arial,sans-serif">
    <rect x="80" y="260" width="170" height="90" rx="18" fill="#17221b"/><text x="120" y="315" font-size="19" font-weight="700" fill="#f7f4ee">PLANNED</text>
    <rect x="330" y="260" width="170" height="90" rx="18" fill="#e9edf4" stroke="#7f93b0" stroke-width="2"/><text x="380" y="315" font-size="19" font-weight="700" fill="#334b6a">RUNNING</text>
    <rect x="580" y="150" width="170" height="90" rx="18" fill="#e7f1e8" stroke="#7ca587" stroke-width="2"/><text x="631" y="205" font-size="19" font-weight="700" fill="#285339">SUCCEEDED</text>
    <rect x="580" y="260" width="170" height="90" rx="18" fill="#f2e6e5" stroke="#ba7a73" stroke-width="2"/><text x="642" y="315" font-size="19" font-weight="700" fill="#703e39">FAILED</text>
    <rect x="580" y="370" width="170" height="90" rx="18" fill="#f3ead9" stroke="#c39b55" stroke-width="2"/><text x="649" y="425" font-size="19" font-weight="700" fill="#705426">UNKNOWN</text>
    <rect x="850" y="370" width="240" height="90" rx="18" fill="#17221b"/><text x="892" y="410" font-size="18" font-weight="700" fill="#f7f4ee">RECONCILE</text><text x="892" y="438" font-size="14" fill="#cbd7ce">lookup(operation_id)</text>
  </g>
  <g stroke="#51645a" stroke-width="3" fill="none"><path d="M250 305 H320"/><path d="M500 280 C540 220 550 200 570 195"/><path d="M500 305 H570"/><path d="M500 330 C540 390 550 410 570 415"/><path d="M750 415 H840"/></g><g fill="#51645a"><path d="M320 305 l-12 -8 v16z"/><path d="M570 195 l-12 -8 v16z"/><path d="M570 305 l-12 -8 v16z"/><path d="M570 415 l-12 -8 v16z"/><path d="M840 415 l-12 -8 v16z"/></g>
  <text x="850" y="500" font-family="Arial,sans-serif" font-size="16" fill="#627066">查到已成功 → 补 checkpoint</text><text x="850" y="528" font-family="Arial,sans-serif" font-size="16" fill="#627066">确认未执行 → 安全重试</text>
</svg>
