<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">bbox 回投影探针</title>
  <desc id="desc">把归一化坐标投影回原图、预览和裁剪视图，检查引用区域是否一致。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">解析升级：做一次 bbox 回投影</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">字段兼容之后，版面证据也要仍然落在正确的字上</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="167" font-size="18" font-weight="700" fill="#275261">归一化 bbox</text><text x="147" y="199" font-size="15" fill="#52727a">保存坐标与版本</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="167" font-size="18" font-weight="700" fill="#6e5223">回投影</text><text x="357" y="199" font-size="15" fill="#806a3d">原图 / 预览 / 裁剪</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="167" font-size="18" font-weight="700" fill="#2b6353">算 IoU</text><text x="567" y="199" font-size="15" fill="#53786b">文本 / 表格 / 图表</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="167" font-size="18" font-weight="700" fill="#78454d">阻断偏移</text><text x="777" y="199" font-size="15" fill="#855c63">citation_ready=false</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="175" font-size="18" font-weight="700" fill="#ffffff">可高亮</text><text x="960" y="207" font-size="15" fill="#d8ebe5">再引用</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round"><path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/></g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">坐标偏移时先暂停引用，不用模型猜相邻数字的归属</text>
</svg>
