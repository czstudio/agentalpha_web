<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">文档块结构图</title>
  <desc id="desc">章节、表格、单元格和脚注通过 parent_id 与 continuation 关系连接。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <path d="M190 128l120 58M190 128l120 150M510 186l120-58M510 186l120 92M330 186h180" stroke="#9bb8b1" stroke-width="4"/>
  <rect x="62" y="80" width="128" height="96" rx="18" fill="#d7e9e2"/><text x="126" y="118" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#173f3d">章节</text><text x="126" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4c7068">parent</text>
  <rect x="310" y="138" width="200" height="96" rx="18" fill="#f4dca6"/><text x="410" y="178" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#704c20">表格 / 图表</text><text x="410" y="207" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#87683d">table_group_id</text>
  <rect x="630" y="80" width="128" height="96" rx="18" fill="#eaf3f7"/><text x="694" y="118" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#24556a">单元格</text><text x="694" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#587783">row / col</text>
  <rect x="630" y="230" width="128" height="72" rx="18" fill="#f2eaf7"/><text x="694" y="259" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#604774">脚注</text><text x="694" y="283" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#765d86">引用</text>
  <text x="62" y="324" font-family="sans-serif" font-size="16" fill="#647775">文档图保留关系，生成模型只负责解释，不负责猜结构。</text>
</svg>
