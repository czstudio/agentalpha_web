<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">版面证据图</title>
  <desc id="desc">节点、表头归属、跨页关系和不确定性共同支撑引用。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F4EE"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#193C3A">版面解析要输出证据图</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#58706D">bbox 是节点，归属和不确定性才是可用结构</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="214" height="126" rx="18" fill="#EAF3F7"/><text x="161" y="172" font-size="19" font-weight="700" fill="#275261">节点</text><text x="161" y="207" font-size="15" fill="#52727A">cell / header</text><text x="161" y="233" font-size="15" fill="#52727A">bbox + version</text>
    <rect x="292" y="132" width="214" height="126" rx="18" fill="#E5F0ED"/><text x="399" y="172" font-size="19" font-weight="700" fill="#1C615A">关系</text><text x="399" y="207" font-size="15" fill="#31514E">column_of</text><text x="399" y="233" font-size="15" fill="#31514E">continuation</text>
    <rect x="530" y="132" width="214" height="126" rx="18" fill="#FFF0D6"/><text x="637" y="172" font-size="19" font-weight="700" fill="#875B26">不确定性</text><text x="637" y="207" font-size="15" fill="#6C5632">candidate edges</text><text x="637" y="233" font-size="15" fill="#6C5632">confidence .74</text>
    <rect x="768" y="132" width="260" height="126" rx="18" fill="#173F3D"/><text x="898" y="182" font-size="19" font-weight="700" fill="#FFFFFF">引用决策</text><text x="898" y="218" font-size="15" fill="#D8EBE5">low confidence → review</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M268 195h24"/><path d="M506 195h24"/><path d="M744 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">高风险字段宁可 citation_ready=false，也不要把猜测变成确定关系</text>
</svg>
