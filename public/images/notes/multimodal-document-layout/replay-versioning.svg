<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">文档解析版本与回放</title>
  <desc id="desc">源文件哈希、解析器版本、结构差异报告和人工抽样构成安全的文档解析回放闭环。</desc>
  <rect width="1080" height="360" rx="28" fill="#f7f8f5"/>
  <text x="54" y="58" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">解析升级后，先做差异回放，再重建索引</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="54" y="124" width="208" height="106" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="158" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">源文件</text><text x="158" y="190" text-anchor="middle" font-size="13" fill="#55706b">sha256 · 页码</text>
    <rect x="292" y="124" width="208" height="106" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="396" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">解析版本</text><text x="396" y="190" text-anchor="middle" font-size="13" fill="#55706b">OCR · layout · rules</text>
    <rect x="530" y="124" width="208" height="106" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="634" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">结构差异</text><text x="634" y="190" text-anchor="middle" font-size="13" fill="#55706b">bbox · 行列 · 低置信</text>
    <rect x="768" y="124" width="258" height="106" rx="17" fill="#173f3d"/><text x="897" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">抽样 / 回滚</text><text x="897" y="190" text-anchor="middle" font-size="13" fill="#dbe9e5">通过才重建索引</text>
  </g>
  <path d="M158 268 C330 320 730 320 897 268" fill="none" stroke="#89aaa5" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="540" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">答案变化 = 文档变化？还是解析器变化？</text>
</svg>
