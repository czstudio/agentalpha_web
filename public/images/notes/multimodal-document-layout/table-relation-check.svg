<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">表格关系候选与校验</title>
  <desc id="desc">先生成候选网格，再使用表头、单位和跨页键校验</desc>
  <rect width="1080" height="390" rx="28" fill="#f7f8f5"/>
  <text x="56" y="56" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#173f3d">Table relation check</text>
  <text x="56" y="84" font-family="Arial,sans-serif" font-size="15" fill="#58716e">关系不确定时保留候选，不要提前拍死</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#173f3d">
    <rect x="56" y="132" width="230" height="112" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="82" y="168">candidate grid</text><text x="82" y="202">线条 · bbox · 间距</text><text x="82" y="226">多种行列解释</text>
    <rect x="334" y="132" width="230" height="112" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="360" y="168">validate</text><text x="360" y="202">表头 · 单位</text><text x="360" y="226">continuation key</text>
    <rect x="612" y="132" width="230" height="112" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="638" y="168">evidence pack</text><text x="638" y="202">列关系 + 置信度</text><text x="638" y="226">可回放引用</text>
    <rect x="890" y="132" width="134" height="112" rx="18" fill="#173f3d"/><text x="917" y="168" fill="#f7f8f5">gate</text><text x="917" y="202" fill="#dfeee8">auto / human</text><text x="917" y="226" fill="#dfeee8">拒答</text>
  </g>
  <g stroke="#79908c" stroke-width="3" fill="none" stroke-linecap="round"><path d="M286 188h48"/><path d="M564 188h48"/><path d="M842 188h48"/></g>
  <rect x="56" y="296" width="968" height="50" rx="15" fill="#182033"/><text x="540" y="328" font-family="monospace" font-size="15" text-anchor="middle" fill="#f7f8f5">13.8 → 毛利率？增长率？先看表头、单位、页码与 bbox</text>
</svg>
