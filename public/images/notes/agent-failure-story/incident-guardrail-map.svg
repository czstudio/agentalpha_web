<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">事故到护栏映射卡</title><desc id="desc">症状、根因、护栏、回放样本和发布门槛构成事故修复映射</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">事故到护栏映射卡</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">每个结论都要落到信号、样本和负责人</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="178" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="141" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">症状</text><text x="141" y="191" text-anchor="middle" font-size="13" fill="#48635f">用户影响</text><text x="141" y="215" text-anchor="middle" font-size="13" fill="#48635f">范围与时间</text>
    <rect x="250" y="122" width="178" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="339" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">根因</text><text x="339" y="191" text-anchor="middle" font-size="13" fill="#48635f">断开的契约</text><text x="339" y="215" text-anchor="middle" font-size="13" fill="#48635f">trace 证据</text>
    <rect x="448" y="122" width="178" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="537" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">护栏</text><text x="537" y="191" text-anchor="middle" font-size="13" fill="#48635f">阻断 / 检测</text><text x="537" y="215" text-anchor="middle" font-size="13" fill="#48635f">owner</text>
    <rect x="646" y="122" width="178" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="735" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">样本</text><text x="735" y="191" text-anchor="middle" font-size="13" fill="#48635f">可回放 trace</text><text x="735" y="215" text-anchor="middle" font-size="13" fill="#48635f">回归结果</text>
    <rect x="844" y="122" width="184" height="126" rx="17" fill="#173f3d"/><text x="936" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">门槛</text><text x="936" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">signal = 0</text><text x="936" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">观察期 + 风险</text>
  </g>
  <path d="M230 185h20M428 185h20M626 185h20M824 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">复盘不是结束，是下一次发布的可验证条件</text>
</svg>
