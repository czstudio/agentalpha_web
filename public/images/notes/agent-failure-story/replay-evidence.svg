<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">失败回放证据链</title><desc id="desc">线上 trace、输入证据、根因、补丁和回放结果串成定位链。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><path d="M110 210h680" stroke="#86a59d" stroke-width="6"/><g font-size="17" font-weight="700"><circle cx="110" cy="210" r="52" fill="#eaf3f7" stroke="#24556a"/><text x="110" y="216">trace</text><circle cx="280" cy="210" r="52" fill="#fae8e1" stroke="#b96d59"/><text x="280" y="216">输入证据</text><circle cx="450" cy="210" r="52" fill="#fff1d9" stroke="#c69a58"/><text x="450" y="216">根因</text><circle cx="620" cy="210" r="52" fill="#dfeee8" stroke="#86a59d"/><text x="620" y="216">补丁</text><circle cx="790" cy="210" r="52" fill="#173f3d"/><text x="790" y="216" fill="#fff">回放</text></g><text x="450" y="335" font-size="17" fill="#4d6562">能复现，才谈得上证明修复有效</text></g></svg>
