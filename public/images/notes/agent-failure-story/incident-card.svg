<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">事故卡</title><desc id="desc">现象、影响、责任和行动分成四栏。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><rect x="72" y="72" width="180" height="250" rx="18" fill="#fae8e1" stroke="#b96d59" stroke-width="2"/><text x="162" y="122" font-size="19" font-weight="700">现象</text><text x="162" y="170" font-size="15">看到了什么</text><text x="162" y="198" font-size="15">发生多久</text><rect x="262" y="72" width="180" height="250" rx="18" fill="#fff1d9" stroke="#c69a58" stroke-width="2"/><text x="352" y="122" font-size="19" font-weight="700">影响</text><text x="352" y="170" font-size="15">影响谁</text><text x="352" y="198" font-size="15">是否有副作用</text><rect x="452" y="72" width="180" height="250" rx="18" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><text x="542" y="122" font-size="19" font-weight="700">边界</text><text x="542" y="170" font-size="15">我负责哪段</text><text x="542" y="198" font-size="15">依赖是什么</text><rect x="642" y="72" width="180" height="250" rx="18" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="732" y="122" font-size="19" font-weight="700">行动</text><text x="732" y="170" font-size="15">如何止血</text><text x="732" y="198" font-size="15">如何防复发</text></g></svg>
