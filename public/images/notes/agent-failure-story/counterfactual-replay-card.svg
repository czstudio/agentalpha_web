<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">事故反事实回放</title><desc id="desc">基线、只加护栏、候选版本、固定变量和发布决定组成事故反事实回放</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">事故回放：先证明护栏真的有效</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">同时换模型和护栏，就无法归因</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">基线</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">guardrail absent</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">failed</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">只加护栏</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">same model</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">passed</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">候选</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">router / prompt</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">observe</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">不变量</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">no duplicate</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">reconcile</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">发布</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">guardrail first</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">observe</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">先固定触发样本，再用最小变化证明修复有效</text>
</svg>
