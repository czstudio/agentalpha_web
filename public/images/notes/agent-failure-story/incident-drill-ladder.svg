<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">事故复盘与故障演练</title>
  <desc id="desc">从线上现象到止血、修复、回放和演练护栏的闭环</desc>
  <rect width="1080" height="360" rx="28" fill="#f7f8f5"/>
  <text x="54" y="58" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#173f3d">事故复盘阶梯：从“发现了”走到“下次能挡住”</text>
  <text x="54" y="88" font-family="Inter,Arial,sans-serif" font-size="15" fill="#50706c">事实时间线 → 止血 → 根因修复 → 回放与演练</text>
  <g font-family="Inter,Arial,sans-serif">
    <path d="M80 292h190v-42h170v-48h170v-52h170v-44h170v186H80z" fill="#eaf3f7" stroke="#b9d3df" stroke-width="2"/>
    <rect x="104" y="258" width="142" height="30" rx="8" fill="#fae8e1"/><text x="126" y="279" font-size="15" font-weight="700" fill="#173f3d">事实时间线</text>
    <rect x="294" y="216" width="142" height="30" rx="8" fill="#fff1d9"/><text x="316" y="237" font-size="15" font-weight="700" fill="#173f3d">止血开关</text>
    <rect x="484" y="164" width="142" height="30" rx="8" fill="#dfeee8"/><text x="506" y="185" font-size="15" font-weight="700" fill="#173f3d">根因修复</text>
    <rect x="674" y="112" width="142" height="30" rx="8" fill="#dfeee8"/><text x="696" y="133" font-size="15" font-weight="700" fill="#173f3d">回放验证</text>
    <rect x="864" y="68" width="142" height="30" rx="8" fill="#eaf3f7"/><text x="886" y="89" font-size="15" font-weight="700" fill="#173f3d">故障演练</text>
    <text x="104" y="324" font-size="14" fill="#50706c">每一级都留下证据、owner 和复查日期</text>
  </g>
</svg>
