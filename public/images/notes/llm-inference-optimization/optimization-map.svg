<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">大模型推理优化选择地图</title>
  <desc id="desc">按瓶颈选择量化、批处理、缓存、投机解码或并行策略。</desc>
  <rect width="1200" height="520" rx="24" fill="#f7f3ec"/>
  <text x="70" y="70" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#323e3e">先诊断，再选工具</text>
  <g font-family="Arial, PingFang SC, sans-serif" text-anchor="middle">
    <rect x="70" y="200" width="190" height="88" rx="14" fill="#e8d9c4" stroke="#323e3e" stroke-width="2"/><text x="165" y="238" font-size="22" font-weight="700" fill="#323e3e">瓶颈信号</text><text x="165" y="266" font-size="15" fill="#625e58">TTFT / TPOT / OOM</text>
    <path d="M260 244h100" stroke="#ce741e" stroke-width="3"/><path d="m350 236 14 8-14 8" fill="#ce741e"/>
    <g fill="#fffaf1" stroke="#d8c7b4" stroke-width="2"><rect x="370" y="110" width="220" height="74" rx="12"/><rect x="370" y="215" width="220" height="74" rx="12"/><rect x="370" y="320" width="220" height="74" rx="12"/></g>
    <g fill="#323e3e" font-size="19"><text x="480" y="142">权重太大</text><text x="480" y="168" font-size="15" fill="#7b7770">量化 / 并行</text><text x="480" y="247">Prompt 太长</text><text x="480" y="273" font-size="15" fill="#7b7770">Prefix / Chunked Prefill</text><text x="480" y="352">Decode 太慢</text><text x="480" y="378" font-size="15" fill="#7b7770">GQA / Speculative</text></g>
    <path d="M590 147h110M590 252h110M590 357h110" stroke="#7fb069" stroke-width="3"/><path d="m690 139 14 8-14 8m0 97 14 8-14 8m0 97 14 8-14 8" fill="#7fb069"/>
    <g fill="#eef5e9" stroke="#7fb069" stroke-width="2"><rect x="710" y="110" width="330" height="74" rx="12"/><rect x="710" y="215" width="330" height="74" rx="12"/><rect x="710" y="320" width="330" height="74" rx="12"/></g>
    <g fill="#323e3e" font-size="18"><text x="875" y="142">显存下降 + 带宽改善</text><text x="875" y="247">减少重复 Prefill</text><text x="875" y="352">减少大模型解码轮数</text></g>
  </g>
  <text x="70" y="460" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#7b7770">每次实验保留质量、延迟、吞吐、显存和回滚阈值，才能知道收益是否真实。</text>
</svg>
