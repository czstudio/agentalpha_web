<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390">
  <rect width="1080" height="390" rx="28" fill="#f7f9fc"/>
  <text x="56" y="58" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#14233b">Attention 形状审计</text>
  <text x="56" y="86" font-family="Arial, sans-serif" font-size="15" fill="#61708a">让公式、mask 和张量维度在同一条证据链上对齐</text>
  <g font-family="Arial, sans-serif">
    <rect x="56" y="130" width="190" height="112" rx="18" fill="#e8f0ff" stroke="#9bb8ed"/>
    <text x="78" y="165" font-size="18" font-weight="700" fill="#1f4d9c">Q / K / V</text>
    <text x="78" y="194" font-size="15" fill="#355071">[B, H, T, dₖ]</text>
    <text x="78" y="220" font-size="13" fill="#5b6b80">同形状，分工不同</text>
    <path d="M246 185H312" stroke="#5979bd" stroke-width="3"/><path d="m302 176 12 9-12 9" fill="none" stroke="#5979bd" stroke-width="3"/>
    <rect x="314" y="130" width="220" height="112" rx="18" fill="#fff4df" stroke="#e4bd70"/>
    <text x="338" y="165" font-size="18" font-weight="700" fill="#9a6510">Scores + Mask</text>
    <text x="338" y="194" font-size="15" fill="#6f531e">[B, H, T, T]</text>
    <text x="338" y="220" font-size="13" fill="#7d6b43">softmax 前屏蔽未来</text>
    <path d="M534 185H600" stroke="#b8893e" stroke-width="3"/><path d="m590 176 12 9-12 9" fill="none" stroke="#b8893e" stroke-width="3"/>
    <rect x="602" y="130" width="190" height="112" rx="18" fill="#e7f6ef" stroke="#98cdb1"/>
    <text x="626" y="165" font-size="18" font-weight="700" fill="#197145">A = softmax(S)</text>
    <text x="626" y="194" font-size="15" fill="#35624c">row sum = 1</text>
    <text x="626" y="220" font-size="13" fill="#527464">未来权重 = 0</text>
    <path d="M792 185H858" stroke="#4f9c72" stroke-width="3"/><path d="m848 176 12 9-12 9" fill="none" stroke="#4f9c72" stroke-width="3"/>
    <rect x="860" y="130" width="164" height="112" rx="18" fill="#f0eaff" stroke="#b8a3e8"/>
    <text x="884" y="165" font-size="18" font-weight="700" fill="#6445ae">O = AV</text>
    <text x="884" y="194" font-size="15" fill="#51436f">输出可回归</text>
    <text x="884" y="220" font-size="13" fill="#6c5d85">norm / 手算样例</text>
  </g>
  <line x1="56" y1="285" x2="1024" y2="285" stroke="#dbe2ec"/>
  <text x="56" y="324" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263750">验收信号</text>
  <text x="170" y="324" font-family="Arial, sans-serif" font-size="15" fill="#52627a">shape 对齐 · mask 可见性 · row sum · 小输入手算</text>
