<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">工具输出契约卡</title><desc id="desc">摘要、范围、完整性、游标、证据和下一步动作组成大结果的输出契约</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">工具输出契约卡</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">让模型知道当前能下什么结论、还缺什么</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">摘要</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">命中 24 条</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">展示前 20 条</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">范围</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">tenant=t-17</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">日期与过滤条件</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">完整性</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">is_complete: false</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">has_more: true</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">artifact://orders</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">schema v3</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">下一步</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">next_page</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">detail</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">原始响应留在 artifact，模型只消费与当前决策相关的证据</text>
</svg>
