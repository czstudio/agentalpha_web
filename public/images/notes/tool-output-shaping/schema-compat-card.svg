<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">输出 schema 兼容窗口</title><desc id="desc">版本、降级规则、破坏性变化、调用方和退役时间组成迁移卡</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Schema 兼容窗口：字段能加，语义不能偷偷变</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">让旧调用方有时间迁移，让破坏性变化可追踪</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">当前版本</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">v3</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">接受 v2 / v3</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">可加字段</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">is_complete</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">旧版可降级</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">语义变化</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">total 含义改变</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">必须升 v4</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">调用遥测</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">planner / UI</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">旧版 31 次</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">退役</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">09-03</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">阻断 v2</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">类型没变，不代表语义没变；迁移要靠遥测证明完成</text>
</svg>
