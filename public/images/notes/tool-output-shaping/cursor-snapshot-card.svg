<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">分页游标绑定快照</title>
  <desc id="desc">同一请求可以重放，过滤或快照变化会明确返回游标过期。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F8F5"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#173F3D">分页游标要绑定快照</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#5B7470">下一页必须还是同一份排序和数据集合</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="214" height="126" rx="18" fill="#EAF3F7"/><text x="161" y="172" font-size="19" font-weight="700" fill="#275261">第一页</text><text x="161" y="207" font-size="15" fill="#52727A">snapshot = snap-09</text><text x="161" y="233" font-size="15" fill="#52727A">sort + filter hash</text>
    <rect x="292" y="132" width="214" height="126" rx="18" fill="#E5F0ED"/><text x="399" y="172" font-size="19" font-weight="700" fill="#1C615A">稳定游标</text><text x="399" y="207" font-size="15" fill="#31514E">request_id replay</text><text x="399" y="233" font-size="15" fill="#31514E">same page</text>
    <rect x="530" y="132" width="214" height="126" rx="18" fill="#FFF0D6"/><text x="637" y="172" font-size="19" font-weight="700" fill="#875B26">条件变化</text><text x="637" y="207" font-size="15" fill="#6C5632">filter / snapshot</text><text x="637" y="233" font-size="15" fill="#6C5632">cursor_stale</text>
    <rect x="768" y="132" width="260" height="126" rx="18" fill="#173F3D"/><text x="898" y="182" font-size="19" font-weight="700" fill="#FFFFFF">重新建页</text><text x="898" y="218" font-size="15" fill="#D8EBE5">不混合结果</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M268 195h24"/><path d="M506 195h24"/><path d="M744 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">快照、排序、过滤和租户都进 cursor，恢复才可复现</text>
</svg>
