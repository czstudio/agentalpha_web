<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">流式结果与证据包</title>
  <desc id="desc">流式事件按顺序号确认、续接，最终形成带完整性标记的证据包。</desc>
  <rect width="1080" height="360" rx="28" fill="#f7f8f5"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="44" y="128" width="175" height="94" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="131" y="165" font-size="19" font-weight="700" fill="#24556a">事件流</text><text x="131" y="195" font-size="14" fill="#5a737d">event_id + seq</text>
    <rect x="265" y="105" width="190" height="140" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="360" y="145" font-size="19" font-weight="700" fill="#173f3d">确认点</text><text x="360" y="175" font-size="14" fill="#52706b">last_ack + cursor</text><text x="360" y="201" font-size="13" fill="#52706b">断线可续接</text>
    <rect x="501" y="128" width="175" height="94" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="588" y="165" font-size="19" font-weight="700" fill="#704c20">投影结果</text><text x="588" y="195" font-size="14" fill="#856a42">摘要 + 关键字段</text>
    <rect x="722" y="105" width="190" height="140" rx="18" fill="#fae8e1" stroke="#e0b9ae"/><text x="817" y="145" font-size="19" font-weight="700" fill="#753f32">证据包</text><text x="817" y="175" font-size="14" fill="#8c5d51">范围 + hash + artifact</text><text x="817" y="201" font-size="13" fill="#8c5d51">is_complete</text>
    <rect x="958" y="128" width="78" height="94" rx="18" fill="#173f3d"/><text x="997" y="165" font-size="18" font-weight="700" fill="#fff">回答</text><text x="997" y="195" font-size="13" fill="#dfeee8">可验证</text>
  </g>
  <g fill="none" stroke="#86a59d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M219 175h46l-10-7m10 7-10 7"/><path d="M455 175h46l-10-7m10 7-10 7"/><path d="M676 175h46l-10-7m10 7-10 7"/><path d="M912 175h46l-10-7m10 7-10 7"/></g>
</svg>
