<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">工具输出证据闭包</title><desc id="desc">原始 artifact、摘要字段、引用定位、展开决策</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">压缩输出，也要把证据闭包留住</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">摘要字段能回指原始范围，才配进入下一步结论</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">原始</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">artifact</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">snapshot</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">摘要</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">key fields</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">max tokens</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">闭包</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">locator</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">filter_hash</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">决策</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">safe / expand</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">needs_expand</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">摘要不是证据本身，无法回指就展开或明确说不确定</text>
</svg>
