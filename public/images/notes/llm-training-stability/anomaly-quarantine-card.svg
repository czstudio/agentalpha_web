<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">异常 batch 隔离卡</title>
  <desc id="desc">保护训练、保存证据并等待数据复核</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Anomaly quarantine</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">跳过当前步是保护动作，不是把异常从实验中删除</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">Batch</text>
    <text x="147" y="194" font-size="15" fill="#365b61">batch-188</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">数据版本</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">异常信号</text>
    <text x="357" y="194" font-size="15" fill="#365b61">overflow / grad</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">mask / label</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">保护</text>
    <text x="567" y="194" font-size="15" fill="#365b61">skip current step</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">主流程继续</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">隔离区</text>
    <text x="777" y="194" font-size="15" fill="#365b61">artifact + replay</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">禁止自动更新</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">复核</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">修复后放行</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">或停止发布</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：异常样本可复现、可追责，跳过动作不掩盖根因</text>
</svg>
