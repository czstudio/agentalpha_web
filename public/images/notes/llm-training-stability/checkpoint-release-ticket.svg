<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">checkpoint 行为放行单</title><desc id="desc">目标能力、通用回归、安全底线和训练指纹共同决定 checkpoint 是否进入灰度</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">checkpoint 行为放行单</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">别让“最后一步”替代目标、回归和安全三道门</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">目标能力</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">success: 0.84</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">format: 0.98</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">通用回归</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">holdout: 0.91</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">replay_mix: 0.20</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">安全底线</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">block_rate: 1.00</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">nan_steps: 0</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">决策</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">step-1800 → canary</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">step-2400 → rejected</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">硬门槛先过滤，目标能力再比较；拒绝原因必须可回滚</text>
</svg>
