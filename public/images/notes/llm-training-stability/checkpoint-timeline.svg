<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">checkpoint 选择时间线</title>
  <desc id="desc">在多个 checkpoint 上同时看目标任务、通用回归和安全底线，最佳点不一定是最后一步。</desc>
  <rect width="1200" height="350" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">最佳 checkpoint 不一定在训练终点</text>
  <line x1="120" y1="190" x2="1080" y2="190" stroke="#9bc9bc" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="220" cy="190" r="18" fill="#ffffff" stroke="#247a6b" stroke-width="4"/><text x="220" y="242" fill="#1d1d1f" font-size="15" font-weight="700">step 600</text><text x="220" y="270" fill="#6b6e70" font-size="13">目标未起</text>
    <circle cx="470" cy="190" r="18" fill="#e6f1ed" stroke="#247a6b" stroke-width="4"/><text x="470" y="242" fill="#247a6b" font-size="15" font-weight="700">step 1200</text><text x="470" y="270" fill="#6b6e70" font-size="13">目标 ↑ 回归稳</text>
    <circle cx="720" cy="190" r="24" fill="#fff5e8" stroke="#9b6b21" stroke-width="4"/><text x="720" y="242" fill="#9b6b21" font-size="15" font-weight="700">step 1800</text><text x="720" y="270" fill="#6b6e70" font-size="13">最佳综合点</text>
    <circle cx="970" cy="190" r="18" fill="#ffffff" stroke="#247a6b" stroke-width="4"/><text x="970" y="242" fill="#1d1d1f" font-size="15" font-weight="700">step 2400</text><text x="970" y="270" fill="#6b6e70" font-size="13">loss ↓ 回归跌</text>
  </g>
  <path d="M690 127 L720 95 L750 127" fill="none" stroke="#9b6b21" stroke-width="3"/><text x="720" y="84" text-anchor="middle" fill="#9b6b21" font-family="Arial, sans-serif" font-size="15" font-weight="700">保留并回放</text>
</svg>
