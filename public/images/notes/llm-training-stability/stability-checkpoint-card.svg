<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390">
  <rect width="1080" height="390" rx="28" fill="#f7f9fc"/><text x="56" y="62" font-family="Arial,'PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#172033">STABILITY CHECKPOINT · 稳定性回执</text><text x="56" y="94" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#637083">恢复训练必须恢复“下一步会看到什么”</text>
  <g font-family="Arial,'PingFang SC',sans-serif"><rect x="56" y="138" width="214" height="148" rx="18" fill="#e8f0ff" stroke="#b7ccf0"/><text x="78" y="174" font-size="16" font-weight="700" fill="#244a83">01 · 权重</text><text x="78" y="211" font-size="15" fill="#3b4d67">checkpoint hash</text><text x="78" y="239" font-size="15" fill="#3b4d67">step / shard</text><rect x="310" y="138" width="214" height="148" rx="18" fill="#edf8f1" stroke="#b8ddc6"/><text x="332" y="174" font-size="16" font-weight="700" fill="#296444">02 · 优化器</text><text x="332" y="211" font-size="15" fill="#3e5a4b">Adam moments</text><text x="332" y="239" font-size="15" fill="#3e5a4b">scheduler state</text><rect x="564" y="138" width="214" height="148" rx="18" fill="#fff4df" stroke="#e5c98d"/><text x="586" y="174" font-size="16" font-weight="700" fill="#7b571a">03 · 数据游标</text><text x="586" y="211" font-size="15" fill="#6a5734">shard / offset</text><text x="586" y="239" font-size="15" fill="#6a5734">seed / order</text><rect x="818" y="138" width="206" height="148" rx="18" fill="#f2ecff" stroke="#cfc0ee"/><text x="840" y="174" font-size="16" font-weight="700" fill="#5b428f">04 · 诊断</text><text x="840" y="211" font-size="15" fill="#5d5370">GNS / clip</text><text x="840" y="239" font-size="15" fill="#5d5370">canary delta</text></g>
  <path d="M278 212h22m224 0h22m224 0h22" stroke="#8a98aa" stroke-width="3"/><path d="m294 204 10 8-10 8m240-8 10 8-10 8m240-8 10 8-10 8" fill="none" stroke="#8a98aa" stroke-width="3"/><text x="56" y="344" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#637083">只恢复权重，不恢复优化器和数据游标，不能称为可复现恢复</text>
</svg>
