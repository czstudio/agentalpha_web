<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">RAG 与其他方案边界</title><desc id="desc">RAG、工具、微调和直接回答分别解决不同问题。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><rect x="64" y="92" width="170" height="214" rx="20" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><text x="149" y="142" font-size="21" font-weight="700">RAG</text><text x="149" y="186" font-size="15">知识会变</text><text x="149" y="214" font-size="15">需要引用</text><text x="149" y="242" font-size="15">外部语料</text><rect x="264" y="92" width="170" height="214" rx="20" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="349" y="142" font-size="21" font-weight="700">工具</text><text x="349" y="186" font-size="15">要执行动作</text><text x="349" y="214" font-size="15">要精确计算</text><text x="349" y="242" font-size="15">要读实时状态</text><rect x="464" y="92" width="170" height="214" rx="20" fill="#fff1d9" stroke="#c69a58" stroke-width="2"/><text x="549" y="142" font-size="21" font-weight="700">微调</text><text x="549" y="186" font-size="15">改变输出习惯</text><text x="549" y="214" font-size="15">固定格式</text><text x="549" y="242" font-size="15">沉淀行为</text><rect x="664" y="92" width="170" height="214" rx="20" fill="#fae8e1" stroke="#b96d59" stroke-width="2"/><text x="749" y="142" font-size="21" font-weight="700">直接回答</text><text x="749" y="186" font-size="15">稳定常识</text><text x="749" y="214" font-size="15">低风险</text><text x="749" y="242" font-size="15">无需外部事实</text><text x="450" y="360" font-size="17" fill="#4d6562">先判断问题类型，再选择最小可行方案</text></g></svg>
