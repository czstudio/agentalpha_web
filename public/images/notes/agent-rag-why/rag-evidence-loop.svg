<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">RAG 证据闭环</title><desc id="desc">问题路由、召回、引用和验证形成可追溯闭环。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><circle cx="450" cy="210" r="128" fill="none" stroke="#dfeee8" stroke-width="55"/><g text-anchor="middle" font-size="18" font-weight="700"><rect x="355" y="28" width="190" height="58" rx="16" fill="#eaf3f7" stroke="#24556a"/><text x="450" y="64">问题路由</text><rect x="640" y="181" width="190" height="58" rx="16" fill="#dfeee8" stroke="#86a59d"/><text x="735" y="217">召回与重排</text><rect x="355" y="334" width="190" height="58" rx="16" fill="#fff1d9" stroke="#c69a58"/><text x="450" y="370">引用证据</text><rect x="70" y="181" width="190" height="58" rx="16" fill="#fae8e1" stroke="#b96d59"/><text x="165" y="217">验证与反馈</text></g><path d="M450 102v46M640 210h-46M450 334v-46M260 210h46" stroke="#24556a" stroke-width="4"/><text x="450" y="203" text-anchor="middle" font-size="24" font-weight="700">可追溯</text><text x="450" y="236" text-anchor="middle" font-size="15" fill="#4d6562">没有证据，就没有确定语气</text></g></svg>
