<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent 问题路由矩阵</title>
  <desc id="desc">稳定知识、私有文档、实时状态和写操作分别路由到模型、RAG、工具和审批。</desc>
  <rect width="1080" height="360" rx="28" fill="#f7f8f5"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="44" y="128" width="174" height="96" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="131" y="165" font-size="19" font-weight="700" fill="#24556a">问题</text><text x="131" y="195" font-size="14" fill="#5a737d">稳定 / 私有 / 实时 / 写入</text>
    <rect x="262" y="104" width="178" height="144" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="351" y="142" font-size="18" font-weight="700" fill="#173f3d">路由器</text><text x="351" y="172" font-size="14" fill="#52706b">变化 · 权限 · 结构化</text><text x="351" y="198" font-size="13" fill="#52706b">风险 · 引用</text>
    <rect x="484" y="48" width="150" height="76" rx="16" fill="#eaf3f7" stroke="#b9d3df"/><text x="559" y="80" font-size="18" font-weight="700" fill="#24556a">模型</text><text x="559" y="105" font-size="13" fill="#5a737d">稳定通用</text>
    <rect x="484" y="142" width="150" height="76" rx="16" fill="#fff1d9" stroke="#e8c891"/><text x="559" y="174" font-size="18" font-weight="700" fill="#704c20">RAG</text><text x="559" y="199" font-size="13" fill="#856a42">私有可引用</text>
    <rect x="484" y="236" width="150" height="76" rx="16" fill="#dfeee8" stroke="#afd0c3"/><text x="559" y="268" font-size="18" font-weight="700" fill="#173f3d">API / 工具</text><text x="559" y="293" font-size="13" fill="#52706b">实时结构化</text>
    <rect x="704" y="142" width="150" height="76" rx="16" fill="#fae8e1" stroke="#e0b9ae"/><text x="779" y="174" font-size="18" font-weight="700" fill="#753f32">审批</text><text x="779" y="199" font-size="13" fill="#8c5d51">写入副作用</text>
    <rect x="904" y="128" width="136" height="96" rx="18" fill="#173f3d"/><text x="972" y="165" font-size="18" font-weight="700" fill="#fff">答案</text><text x="972" y="195" font-size="13" fill="#dfeee8">证据 + 回执</text>
  </g>
  <g fill="none" stroke="#86a59d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M218 176h44l-10-7m10 7-10 7"/><path d="M440 150l44-64"/><path d="M440 176h44"/><path d="M440 208l44 66"/><path d="M634 86l70 75"/><path d="M634 180h70"/><path d="M634 274l70-75"/><path d="M854 180h50l-10-7m10 7-10 7"/></g>
</svg>
