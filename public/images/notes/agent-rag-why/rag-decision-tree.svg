<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">是否需要 RAG</title><desc id="desc">根据知识是否变化、是否私有、是否需要引用决定是否检索。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><rect x="345" y="30" width="210" height="58" rx="16" fill="#173f3d"/><text x="450" y="66" fill="#fff" font-size="19" font-weight="700">问题需要外部知识？</text><path d="M450 88v36M450 124H230M450 124h220M230 124v30M670 124v30" stroke="#86a59d" stroke-width="3"/><text x="230" y="116" font-size="14">否</text><text x="670" y="116" font-size="14">是</text><rect x="110" y="154" width="240" height="72" rx="16" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="230" y="184" font-size="18" font-weight="700">直接回答 / 工具</text><text x="230" y="209" font-size="14">稳定事实，先省掉检索</text><rect x="550" y="154" width="240" height="72" rx="16" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><text x="670" y="184" font-size="18" font-weight="700">知识会变化或私有？</text><text x="670" y="209" font-size="14">继续判断数据边界</text><path d="M670 226v34M670 260H460M670 260h210M460 260v30M880 260v30" stroke="#86a59d" stroke-width="3"/><text x="460" y="252" font-size="14">否</text><text x="880" y="252" font-size="14">是</text><rect x="360" y="290" width="200" height="72" rx="16" fill="#fff1d9" stroke="#c69a58" stroke-width="2"/><text x="460" y="320" font-size="18" font-weight="700">结构化查询</text><text x="460" y="345" font-size="14">优先工具或数据库</text><rect x="775" y="290" width="110" height="72" rx="16" fill="#fae8e1" stroke="#b96d59" stroke-width="2"/><text x="830" y="320" font-size="18" font-weight="700">RAG</text><text x="830" y="345" font-size="14">带证据回答</text></g></svg>
