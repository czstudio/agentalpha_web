<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">RAG 路由新鲜度门</title>
  <desc id="desc">来源年龄、预算和降级动作共同决定是否放行</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Freshness gate</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">来源可用不代表数据足够新</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">问题</text>
    <text x="147" y="194" font-size="15" fill="#365b61">current status</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">需要多新</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">来源</text>
    <text x="357" y="194" font-size="15" fill="#365b61">API / RAG</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">时间戳 + 租户</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">预算</text>
    <text x="567" y="194" font-size="15" fill="#365b61">max age 5 min</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">新鲜度门槛</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">不通过</text>
    <text x="777" y="194" font-size="15" fill="#365b61">澄清 / 等待</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">带范围降级</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">放行</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">带时间回答</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">可回放</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：来源年龄、最大允许年龄和降级动作一起写入 route receipt</text>
</svg>
