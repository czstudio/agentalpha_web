<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">权限撤销演练卡</title><desc id="desc">发放、撤销、排队、重放和未知结果组成权限演练证据链</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">权限撤销演练：发出去的能力怎么收回来？</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">不只测 403，还要覆盖队列、缓存和在途请求</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">发放</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">contract.write</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">grant-8842</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">撤销</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">10:00 失效</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">缓存清除</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">排队</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">任务阻断</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">在途读回</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">重放</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">旧 token</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">拒绝</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">未知</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">人工复核</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">留时间线</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">权限撤销的验收对象，是所有副作用入口</text>
</svg>
