<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">授权对账卡</title><desc id="desc">申请、审批、派发、外部回执和最终状态逐字段对账</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">高风险授权对账卡</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">申请的能力必须和实际执行的能力逐字段一致</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">申请</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">refund</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">params_hash</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">审批</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">approval_id</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">policy · expiry</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">派发</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">request_id</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">resource v12</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">回执</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">committed</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">reconciled: true</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">失配</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">re-approve</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">stop</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">参数、资源版本或主体变化时，原授权立即失效</text>
</svg>
