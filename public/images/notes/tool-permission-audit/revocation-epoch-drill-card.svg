<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">权限撤销 epoch 演练</title>
  <desc id="desc">主票据、子能力、队列重试和缓存都复核撤销 epoch。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F8F5"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#173F3D">撤销演练要覆盖在途请求</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#5B7470">TTL 未到期，也可能因为 epoch 前进而立即失效</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="206" height="126" rx="18" fill="#E5F0ED"/><text x="157" y="172" font-size="19" font-weight="700" fill="#1C615A">发放</text><text x="157" y="207" font-size="15" fill="#31514E">epoch 41</text><text x="157" y="233" font-size="15" fill="#31514E">parent + child</text>
    <rect x="278" y="132" width="206" height="126" rx="18" fill="#FFF0D6"/><text x="381" y="172" font-size="19" font-weight="700" fill="#875B26">撤销</text><text x="381" y="207" font-size="15" fill="#6C5632">current = 42</text><text x="381" y="233" font-size="15" fill="#6C5632">cache flush</text>
    <rect x="502" y="132" width="206" height="126" rx="18" fill="#F5D9DC"/><text x="605" y="172" font-size="19" font-weight="700" fill="#78454D">在途提交</text><text x="605" y="207" font-size="15" fill="#855C63">ticket 41</text><text x="605" y="233" font-size="15" fill="#855C63">deny</text>
    <rect x="726" y="132" width="302" height="126" rx="18" fill="#173F3D"/><text x="877" y="172" font-size="19" font-weight="700" fill="#FFFFFF">对账 / 补偿</text><text x="877" y="207" font-size="15" fill="#D8EBE5">已有副作用单独处理</text><text x="877" y="233" font-size="15" fill="#D8EBE5">不能伪造未发生</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M260 195h18"/><path d="M484 195h18"/><path d="M708 195h18"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">撤销是状态变化，不是等待 TTL；每个副作用入口都要重新检查 epoch</text>
</svg>
