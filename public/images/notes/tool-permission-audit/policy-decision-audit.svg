<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">策略决定与审计闭环</title>
  <desc id="desc">调用上下文进入策略引擎，形成允许或拒绝以及义务，执行和审计回执闭环。</desc>
  <rect width="1080" height="360" rx="28" fill="#f7f8f5"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="38" y="120" width="190" height="100" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="133" y="158" font-size="19" font-weight="700" fill="#24556a">调用上下文</text><text x="133" y="190" font-size="14" fill="#5a737d">主体 · 租户 · 参数 hash</text>
    <rect x="270" y="102" width="200" height="136" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="370" y="142" font-size="19" font-weight="700" fill="#173f3d">策略引擎</text><text x="370" y="172" font-size="14" fill="#52706b">规则 + 风险 + 审批</text><text x="370" y="199" font-size="13" fill="#52706b">allow / deny / obligations</text>
    <rect x="512" y="62" width="150" height="78" rx="16" fill="#dfeee8" stroke="#afd0c3"/><text x="587" y="95" font-size="18" font-weight="700" fill="#173f3d">允许</text><text x="587" y="120" font-size="13" fill="#52706b">短期 capability</text>
    <rect x="512" y="198" width="150" height="78" rx="16" fill="#fae8e1" stroke="#e0b9ae"/><text x="587" y="231" font-size="18" font-weight="700" fill="#753f32">拒绝</text><text x="587" y="256" font-size="13" fill="#8c5d51">原因 + 人工任务</text>
    <rect x="704" y="120" width="160" height="100" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="784" y="158" font-size="19" font-weight="700" fill="#704c20">执行回执</text><text x="784" y="190" font-size="14" fill="#856a42">request_id + 状态</text>
    <rect x="906" y="120" width="140" height="100" rx="18" fill="#173f3d"/><text x="976" y="158" font-size="19" font-weight="700" fill="#fff">审计链</text><text x="976" y="190" font-size="13" fill="#dfeee8">规则 + 证据</text>
  </g>
  <g fill="none" stroke="#86a59d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M228 170h42l-10-7m10 7-10 7"/><path d="M470 145l42-45"/><path d="M470 195l42 40"/><path d="M662 101l42 55"/><path d="M662 237l42-50"/><path d="M864 170h42l-10-7m10 7-10 7"/></g>
</svg>
