<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 角色切片回放卡</title><desc id="desc">角色按任务切片进行基线、候选和路由决策回放</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">角色切片回放：收益要落到路由条件</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">同一角色，在不同风险和成本切片上可能有不同结论</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">切片</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">风险 / 预算</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">证据缺口</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">基线</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">single_writer</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">质量 / P95</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">候选</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">+ verifier</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">收益 / 成本</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">决策</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">off / canary</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">human gate</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回滚</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">条件</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">owner</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">平均分只决定是否继续看，切片回放才决定怎么路由</text>
</svg>
