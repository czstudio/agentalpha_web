<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 角色贡献卡</title><desc id="desc">下游消费、质量增益、资源代价和路由边界共同描述角色价值</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">角色贡献卡：有输出，不等于有价值</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">看下游有没有消费，再看质量、成本和风险是否值得</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">角色</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">critic</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">citation_review</text>
    <rect x="258" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="353" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">消费</text><text x="353" y="191" text-anchor="middle" font-size="13" fill="#48635f">downstream = true</text><text x="353" y="215" text-anchor="middle" font-size="13" fill="#48635f">改变最终状态</text>
    <rect x="464" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="559" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">收益</text><text x="559" y="191" text-anchor="middle" font-size="13" fill="#48635f">groundedness +6.2pp</text><text x="559" y="215" text-anchor="middle" font-size="13" fill="#48635f">失败类型变少</text>
    <rect x="670" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="765" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">代价</text><text x="765" y="191" text-anchor="middle" font-size="13" fill="#48635f">tokens +18%</text><text x="765" y="215" text-anchor="middle" font-size="13" fill="#48635f">P95 +240ms</text>
    <rect x="876" y="122" width="152" height="126" rx="17" fill="#173f3d"/><text x="952" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">路由</text><text x="952" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">high_risk</text><text x="952" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">按需启用</text>
  </g>
  <path d="M242 185h16M448 185h16M654 185h16M860 185h16" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">角色价值 = 下游消费 × 质量增益 ÷ 资源与风险代价</text>
</svg>
