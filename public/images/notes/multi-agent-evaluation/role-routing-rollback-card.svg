<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">角色路由回滚卡</title><desc id="desc">角色收益、成本、护栏、灰度比例和撤回条件组成路由决策</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">角色路由回滚卡：有收益，不等于全量开启</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">用收益、成本和护栏决定灰度边界</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">角色</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">citation-verifier</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">下游有消费</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">收益</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">支持率 +8.4pp</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">成功率 +2.1pp</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">成本</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">P95 +310ms</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">token +18%</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">灰度</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">10% canary</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">两日观察</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回滚</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">阈值触发</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">旧路由</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">默认路由面对所有任务，必须提前写出撤回条件</text>
</svg>
