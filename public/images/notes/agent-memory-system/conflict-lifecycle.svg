<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Memory conflict and deletion lifecycle</title>
  <desc id="desc">A memory moves through active, superseded, review and tombstoned states with evidence.</desc>
  <rect width="1200" height="500" rx="28" fill="#f7f8f5"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#17211d">Memory must be able to change, conflict and disappear</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="16" fill="#5f6d66">Versions and tombstones make updates visible instead of asking the model to guess.</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="190" width="190" height="98" rx="18" fill="#d8efe7" stroke="#217d6e" stroke-width="2"/>
    <text x="151" y="230" font-size="21" font-weight="700" fill="#176658">active</text>
    <text x="115" y="258" font-size="15" fill="#23423b">source + scope + version</text>
    <path d="M280 239h88" stroke="#6d8c82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="368" y="190" width="190" height="98" rx="18" fill="#f0eee3" stroke="#b8a766" stroke-width="2"/>
    <text x="405" y="230" font-size="21" font-weight="700" fill="#7a681d">冲突检查</text>
    <text x="391" y="258" font-size="15" fill="#514b31">time · scope · authority</text>
    <path d="M558 239h68" stroke="#6d8c82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="626" y="140" width="190" height="82" rx="18" fill="#f4e7d9" stroke="#bc8052" stroke-width="2"/>
    <text x="685" y="175" font-size="20" font-weight="700" fill="#8f5430">review</text>
    <text x="649" y="201" font-size="14" fill="#5a3f31">无法判定 → 澄清</text>
    <path d="M558 239h34v120h34" stroke="#6d8c82" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="626" y="318" width="190" height="82" rx="18" fill="#ffffff" stroke="#9ab8ad" stroke-width="2"/>
    <text x="666" y="353" font-size="20" font-weight="700" fill="#21473d">superseded</text>
    <text x="655" y="379" font-size="14" fill="#5f6d66">旧事实保留证据</text>
    <path d="M816 181h70" stroke="#6d8c82" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M816 359h70" stroke="#6d8c82" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="886" y="190" width="220" height="98" rx="18" fill="#eeeeee" stroke="#858b87" stroke-width="2"/>
    <text x="962" y="230" font-size="21" font-weight="700" fill="#535a56">tombstone</text>
    <text x="917" y="258" font-size="15" fill="#5f6d66">先过滤，再清理副本</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#5f6d66">
    <text x="88" y="445">任何状态都必须带 memory_id、source_ids、更新时间和作用域。</text>
    <text x="728" y="445">删除事件同步：结构化库 · 向量 · 缓存 · 日志 · 备份。</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#6d8c82"/></marker></defs>
</svg>
