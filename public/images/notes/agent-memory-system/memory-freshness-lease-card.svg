<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">记忆新鲜度租约</title><desc id="desc">记忆写入、租约、验证、降级读取流程</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">记忆也要过期：给事实一张“新鲜度租约”</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">过期不等于删除，而是从默认事实降级为待验证线索</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">写入</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">fact + source</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">observed_at</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">租约</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">expires_at</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">confidence</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">验证</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">source check</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">new evidence</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">读取</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">fresh → fact</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">stale → hint</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">旧记忆先降权、再验证、最后淘汰，避免一次清理抹掉仍有价值的线索</text>
</svg>
