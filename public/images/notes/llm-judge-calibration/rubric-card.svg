<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">可执行评分 rubric</title><desc id="desc">分值、观察项和硬失败条件。</desc><rect width="900" height="360" rx="28" fill="#f7f8f5"/><g font-family="sans-serif"><rect x="70" y="60" width="760" height="240" rx="18" fill="#fff" stroke="#d4ddd9" stroke-width="2"/><text x="105" y="103" font-size="20" font-weight="700" fill="#173f3d">Groundedness · 权重 0.4</text><line x1="105" y1="124" x2="790" y2="124" stroke="#d4ddd9"/><text x="105" y="158" font-size="15" fill="#52706b">5 分</text><text x="180" y="158" font-size="15" fill="#4b514e">每个 claim 都有精确引用，版本与范围匹配</text><text x="105" y="196" font-size="15" fill="#856a42">3 分</text><text x="180" y="196" font-size="15" fill="#4b514e">核心结论有引用，但有一处定位宽泛</text><text x="105" y="234" font-size="15" fill="#845a50">1 分</text><text x="180" y="234" font-size="15" fill="#4b514e">引用存在，但不能支持主要结论</text><rect x="105" y="258" width="220" height="25" rx="8" fill="#fae8e1"/><text x="215" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#753f32">硬失败：编造来源</text></g></svg>
