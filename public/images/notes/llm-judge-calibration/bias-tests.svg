<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Judge 偏差对照实验</title><desc id="desc">通过交换顺序、控制长度和匿名化检测偏差。</desc><rect width="900" height="350" rx="28" fill="#f7f8f5"/><g font-family="sans-serif"><text x="70" y="56" font-size="20" font-weight="700" fill="#173f3d">同一对答案，至少做四次对照</text><g transform="translate(75 98)"><rect width="170" height="76" rx="14" fill="#eaf3f7"/><text x="85" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#24556a">A / B</text><rect x="195" width="170" height="76" rx="14" fill="#dfeee8"/><text x="280" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#173f3d">B / A</text><rect x="390" width="170" height="76" rx="14" fill="#fff1d9"/><text x="475" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#704c20">A / A</text><rect x="585" width="170" height="76" rx="14" fill="#fae8e1"/><text x="670" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#753f32">B / B</text></g><g transform="translate(85 220)"><text x="0" y="0" font-size="15" fill="#52706b">位置翻转</text><text x="200" y="0" font-size="15" fill="#52706b">长度增益</text><text x="400" y="0" font-size="15" fill="#52706b">自偏好</text><text x="600" y="0" font-size="15" fill="#52706b">一致性</text><path d="M0 28h690" stroke="#9baba6" stroke-width="2" stroke-dasharray="7 7"/></g></g></svg>
