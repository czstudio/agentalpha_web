<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Judge 桥接回放</title><desc id="desc">旧 Judge、新 Judge、重叠金样、人工结论和换尺子标记组成 Judge 桥接回放</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Judge 升级：先做桥接回放再接历史曲线</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">换了评分尺子，分数就不能直接拼接</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">旧 Judge</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">v4</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">score 3.42</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">新 Judge</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">v5</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">score 3.68</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">重叠金样</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">n = 240</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">same rubric</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">人工结论</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">high-risk flips</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">3%</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">标记</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">break point</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">publish</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">桥接不是抹平差异，而是让换尺子的断点可解释</text>
</svg>
