<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Judge 放行单</title><desc id="desc">把评分、证据、风险和后续动作绑定成可重算的判定包</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Judge 放行单：分数、证据、动作同屏</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">规则层做决定，Judge 只提供可回放的观察</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="210" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="157" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">评分</text><text x="157" y="191" text-anchor="middle" font-size="13" fill="#48635f">score: 3</text><text x="157" y="215" text-anchor="middle" font-size="13" fill="#48635f">hard_fail: false</text>
    <rect x="282" y="122" width="210" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="387" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据</text><text x="387" y="191" text-anchor="middle" font-size="13" fill="#48635f">claim-2 · citation-5</text><text x="387" y="215" text-anchor="middle" font-size="13" fill="#48635f">限制条件遗漏</text>
    <rect x="512" y="122" width="210" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="617" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">风险</text><text x="617" y="191" text-anchor="middle" font-size="13" fill="#48635f">高风险切片</text><text x="617" y="215" text-anchor="middle" font-size="13" fill="#48635f">confidence &lt; 0.70</text>
    <rect x="742" y="122" width="286" height="126" rx="17" fill="#173f3d"/><text x="885" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">动作</text><text x="885" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">decision: review</text><text x="885" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">fingerprint 固定版本</text>
  </g>
  <path d="M262 185h20M492 185h20M722 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">放行单可回到原始证据重算，历史分数不被覆盖</text>
</svg>
