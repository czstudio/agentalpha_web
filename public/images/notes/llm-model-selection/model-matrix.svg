  <line x1="155" y1="395" x2="1040" y2="395" stroke="#9aa8a2" stroke-width="2"/><line x1="155" y1="140" x2="155" y2="395" stroke="#9aa8a2" stroke-width="2"/>
  <text x="540" y="445" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#718078">单位成功成本 →</text><text x="80" y="210" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#718078" transform="rotate(-90 80 210)">任务质量 ↑</text>
  <circle cx="340" cy="190" r="22" fill="#477e68"/><text x="380" y="197" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#365c4e">高质量、低成本：优先候选</text>
