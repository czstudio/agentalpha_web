  <circle cx="850" cy="340" r="22" fill="#c9785e"/><text x="890" y="347" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#925541">便宜但失败多：不能只看单价</text>
  <rect x="250" y="260" width="600" height="80" fill="none" stroke="#86b49d" stroke-width="3" stroke-dasharray="9 8"/><text x="430" y="306" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#4d7665">高风险任务的质量 / 安全硬门槛区域</text>
