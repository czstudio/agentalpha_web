<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">权限撤销后的残留能力探针</title>
  <desc id="desc">文件、网络、子进程和秘密读取逐项确认已经拒绝</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="58" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#173f3d">权限撤销后的残留能力探针</text>
  <text x="52" y="89" font-family="Inter,Arial,sans-serif" font-size="17" fill="#5b7470">管理面板显示 revoked，还要从能力边界反向验证</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="75" y="160" font-size="20" font-weight="700" fill="#173f3d">01</text>
    <text x="75" y="190" font-size="17" fill="#365b61">文件写入</text>
    <text x="75" y="219" font-size="15" fill="#5b7470">expected denied</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="285" y="160" font-size="20" font-weight="700" fill="#173f3d">02</text>
    <text x="285" y="190" font-size="17" fill="#365b61">网络出口</text>
    <text x="285" y="219" font-size="15" fill="#5b7470">含继承代理</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="495" y="160" font-size="20" font-weight="700" fill="#173f3d">03</text>
    <text x="495" y="190" font-size="17" fill="#365b61">子进程</text>
    <text x="495" y="219" font-size="15" fill="#5b7470">无残留句柄</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="705" y="160" font-size="20" font-weight="700" fill="#173f3d">04</text>
    <text x="705" y="190" font-size="17" fill="#365b61">秘密读取</text>
    <text x="705" y="219" font-size="15" fill="#5b7470">缓存 token</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="915" y="172" font-size="18" font-weight="700" fill="#f7f8f5">05</text>
    <text x="915" y="204" font-size="17" fill="#f7f8f5">关闭</text>
    <text x="915" y="229" font-size="14" fill="#c7ded6">零残留</text>
    <path d="M242 185H258M452 185H468M662 185H678M872 185H888" fill="none" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-family="Inter,Arial,sans-serif" font-size="16" fill="#365b61">停止条件：探针全部拒绝 + 子进程、挂载、缓存无残留</text>
</svg>
