<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">沙箱降级演练卡</title><desc id="desc">策略服务异常时缩小能力集合而不是放开外网</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#173f3d">策略异常：能力要收紧，不要放行</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5b7470">把超时、审计中断和过期授权都纳入演练</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="165" font-size="18" font-weight="700" fill="#275261">正常</text><text x="147" y="198" font-size="15" fill="#52727a">工作区可写</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="165" font-size="18" font-weight="700" fill="#6e5223">策略超时</text><text x="357" y="198" font-size="15" fill="#806a3d">只读 + 阻断</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="165" font-size="18" font-weight="700" fill="#2b6353">审计中断</text><text x="567" y="198" font-size="15" fill="#53786b">停止副作用</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="165" font-size="18" font-weight="700" fill="#78454d">授权过期</text><text x="777" y="198" font-size="15" fill="#855c63">重新审批</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="169" font-size="18" font-weight="700" fill="#fff">可恢复</text><text x="960" y="202" font-size="15" fill="#d8ebe5">留证据</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round"><path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/></g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="76" y="322" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#365b61">故障是安全信号：保存状态、返回阻断原因、等待重新审批</text>
</svg>
