<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Code Agent 沙箱威胁模型</title>
  <desc id="desc">用户任务、模型、工具和环境之间的信任边界与审计边界。</desc>
  <rect width="1200" height="620" fill="#fbfaf7"/>
  <text x="72" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17221b">沙箱要防两类东西：模型犯错，工具被诱导</text>
  <text x="72" y="106" font-family="Arial,sans-serif" font-size="16" fill="#627066">工具返回的网页、日志和文件内容都可能携带“看起来像指令”的文本。</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="220" width="190" height="120" rx="16" fill="#17221b"/><text x="104" y="266" font-size="18" font-weight="700" fill="#f7f4ee">用户任务</text><text x="104" y="298" font-size="15" fill="#cbd7ce">目标/约束</text>
    <rect x="350" y="180" width="220" height="200" rx="16" fill="#e9edf4" stroke="#7f93b0" stroke-width="2"/><text x="386" y="230" font-size="18" font-weight="700" fill="#334b6a">策略层</text><text x="386" y="270" font-size="15" fill="#3e4a5a">解析 action</text><text x="386" y="300" font-size="15" fill="#3e4a5a">校验参数/权限</text><text x="386" y="330" font-size="15" fill="#3e4a5a">绑定 operation_id</text>
    <rect x="660" y="180" width="220" height="200" rx="16" fill="#f3ead9" stroke="#c39b55" stroke-width="2"/><text x="696" y="230" font-size="18" font-weight="700" fill="#705426">工具层</text><text x="696" y="270" font-size="15" fill="#53472f">文件 / 网络 / 进程</text><text x="696" y="300" font-size="15" fill="#53472f">最小权限</text><text x="696" y="330" font-size="15" fill="#53472f">结构化返回</text>
    <rect x="970" y="220" width="158" height="120" rx="16" fill="#f2e6e5" stroke="#ba7a73" stroke-width="2"/><text x="1000" y="266" font-size="18" font-weight="700" fill="#703e39">环境</text><text x="1000" y="298" font-size="15" fill="#5c4140">状态/副作用</text>
  </g>
  <g stroke="#51645a" stroke-width="3" fill="none"><path d="M262 280 H340"/><path d="M570 280 H650"/><path d="M880 280 H960"/></g><g fill="#51645a"><path d="M340 280 l-12 -8 v16z"/><path d="M650 280 l-12 -8 v16z"/><path d="M960 280 l-12 -8 v16z"/></g>
  <rect x="350" y="448" width="530" height="66" rx="14" fill="#17221b"/><text x="388" y="490" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f7f4ee">每次升级权限，都要留下：谁批准、为什么、改了什么</text>
</svg>
