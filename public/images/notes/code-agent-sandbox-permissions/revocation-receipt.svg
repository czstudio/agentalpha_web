<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">权限撤销回执</title>
  <desc id="desc">撤销回执检查挂载、网络、子进程、秘密和残留权限。</desc>
  <rect width="1080" height="390" rx="24" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">临时权限：撤销也要被逐项验收</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5d7271">到期时间只是计划，实际挂载、网络、进程和 token 状态才是结果。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#173f3d">
    <rect x="52" y="122" width="178" height="122" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="103" y="171">挂载</text><text x="91" y="202" font-size="14" font-weight="500">workspace removed</text>
    <rect x="250" y="122" width="178" height="122" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="309" y="171">网络</text><text x="283" y="202" font-size="14" font-weight="500">allowlist cleared</text>
    <rect x="448" y="122" width="178" height="122" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="507" y="171">进程</text><text x="480" y="202" font-size="14" font-weight="500">children reaped</text>
    <rect x="646" y="122" width="178" height="122" rx="18" fill="#f5d9dc" stroke="#dfb2b9"/><text x="704" y="171">秘密</text><text x="677" y="202" font-size="14" font-weight="500">env + proxy unset</text>
    <rect x="844" y="122" width="184" height="122" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="903" y="171">残留</text><text x="875" y="202" font-size="14" font-weight="500">isolate if nonempty</text>
  </g>
  <g stroke="#6d8989" stroke-width="3" fill="none"><path d="M230 183h20"/><path d="M428 183h20"/><path d="M626 183h20"/><path d="M824 183h20"/></g>
  <rect x="52" y="294" width="976" height="48" rx="14" fill="#173f3d"/>
  <text x="376" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#e7f4ef">权限结束，能力才真正结束</text>
</svg>
