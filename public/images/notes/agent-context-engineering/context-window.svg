<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">上下文窗口组装</title><desc id="desc">原始事件经过选择、压缩、排序后形成决策窗口</desc>
  <rect width="1400" height="470" rx="28" fill="#f7f8fa"/>
  <g font-family="Arial, sans-serif" fill="#17202a">
    <text x="72" y="72" font-size="22" letter-spacing="3" fill="#68717c">CONTEXT WINDOW</text>
    <text x="72" y="116" font-size="32" font-weight="700">不是收集更多，而是留下当前决策需要的事实</text>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <rect x="90" y="196" width="220" height="120" rx="14" fill="#f3f5f7" stroke="#aab2bb"/><text x="200" y="246">原始事件</text><text x="200" y="280" font-size="16" font-weight="400" fill="#68717c">历史 / 工具 / 记忆</text>
      <rect x="390" y="196" width="220" height="120" rx="14" fill="#fff1d8" stroke="#bd7a19"/><text x="500" y="246">选择与过滤</text><text x="500" y="280" font-size="16" font-weight="400" fill="#68717c">权限 / 时间 / 相关性</text>
      <rect x="690" y="196" width="220" height="120" rx="14" fill="#e8f5ed" stroke="#39865b"/><text x="800" y="246">结构与压缩</text><text x="800" y="280" font-size="16" font-weight="400" fill="#68717c">状态 / 摘要 / 引用</text>
      <rect x="990" y="196" width="280" height="120" rx="14" fill="#e3efff" stroke="#3978c8"/><text x="1130" y="246">决策窗口</text><text x="1130" y="280" font-size="16" font-weight="400" fill="#68717c">目标 + 证据 + 动作</text>
    </g>
    <g fill="none" stroke="#68717c" stroke-width="3"><path d="M310 256h80"/><path d="m374 244 16 12-16 12"/><path d="M610 256h80"/><path d="m674 244 16 12-16 12"/><path d="M910 256h80"/><path d="m974 244 16 12-16 12"/></g>
  </g>
</svg>
