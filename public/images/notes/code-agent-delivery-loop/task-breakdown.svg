<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Code Agent 任务拆分</title><desc id="desc">任务合同映射到仓库入口、状态所有者、测试和交付证据。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><rect x="42" y="154" width="180" height="90" rx="18" fill="#fff1d9" stroke="#c69a58" stroke-width="2"/><text x="132" y="190" text-anchor="middle" font-size="20" font-weight="700">任务合同</text><text x="132" y="220" text-anchor="middle" font-size="14">目标 · 假设 · 验收</text><path d="M222 199h54" stroke="#86a59d" stroke-width="4" marker-end="url(#a)"/><rect x="276" y="62" width="180" height="90" rx="18" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="366" y="98" text-anchor="middle" font-size="19" font-weight="700">入口</text><text x="366" y="128" text-anchor="middle" font-size="14">路由 · 调用者</text><rect x="276" y="268" width="180" height="90" rx="18" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><text x="366" y="304" text-anchor="middle" font-size="19" font-weight="700">状态</text><text x="366" y="334" text-anchor="middle" font-size="14">表 · 队列 · 所有者</text><path d="M456 107h88M456 313h88" stroke="#86a59d" stroke-width="4" marker-end="url(#a)"/><rect x="544" y="62" width="180" height="90" rx="18" fill="#fae8e1" stroke="#b96d59" stroke-width="2"/><text x="634" y="98" text-anchor="middle" font-size="19" font-weight="700">测试</text><text x="634" y="128" text-anchor="middle" font-size="14">契约 · 权限 · 回归</text><rect x="544" y="268" width="180" height="90" rx="18" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="634" y="304" text-anchor="middle" font-size="19" font-weight="700">证据</text><text x="634" y="334" text-anchor="middle" font-size="14">diff · 命令 · 回执</text><path d="M724 107h80v206h-80" fill="none" stroke="#86a59d" stroke-width="4" marker-end="url(#a)"/><text x="450" y="218" text-anchor="middle" font-size="16" fill="#4d6562">先找到事实，再决定怎么改</text></g><defs><marker id="a" mar