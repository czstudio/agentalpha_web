<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Code Agent 交付闭环</title><desc id="desc">需求合同、仓库证据、任务拆分、小步补丁和分层验收组成循环。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><circle cx="450" cy="210" r="132" fill="none" stroke="#86a59d" stroke-width="20" stroke-dasharray="190 24"/><g font-size="20" font-weight="700" text-anchor="middle"><rect x="355" y="32" width="190" height="58" rx="18" fill="#eaf3f7" stroke="#24556a"/><text x="450" y="68">需求合同</text><rect x="641" y="145" width="190" height="58" rx="18" fill="#dfeee8" stroke="#86a59d"/><text x="736" y="181">仓库证据</text><rect x="530" y="312" width="190" height="58" rx="18" fill="#fff1d9" stroke="#c69a58"/><text x="625" y="348">任务拆分</text><rect x="180" y="312" width="190" height="58" rx="18" fill="#fae8e1" stroke="#b96d59"/><text x="275" y="348">小步补丁</text><rect x="69" y="145" width="190" height="58" rx="18" fill="#eaf3f7" stroke="#24556a"/><text x="164" y="181">分层验收</text></g><text x="450" y="206" text-anchor="middle" font-size="26" font-weight="700">可交付</text><text x="450" y="238" text-anchor="middle" font-size="16" fill="#4d6562">每一步都有证据</text></g></svg>
