<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Code Agent 补丁状态机</title>
  <desc id="desc">补丁从计划到放行，遇到未知风险进入阻塞状态</desc>
  <rect width="1080" height="390" rx="28" fill="#f7f8f5"/>
  <text x="56" y="56" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#173f3d">Patch gate</text>
  <text x="56" y="84" font-family="Arial,sans-serif" font-size="15" fill="#58716e">绿色不是终点，证据完整才允许 releasable</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#173f3d">
    <rect x="56" y="132" width="180" height="112" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="82" y="168">planned</text><text x="82" y="202">contract</text><text x="82" y="226">allowed paths</text>
    <rect x="270" y="132" width="180" height="112" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="296" y="168">editing</text><text x="296" y="202">small diff</text><text x="296" y="226">local feedback</text>
    <rect x="484" y="132" width="180" height="112" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="510" y="168">checked</text><text x="510" y="202">matrix</text><text x="510" y="226">evidence</text>
    <rect x="698" y="132" width="180" height="112" rx="18" fill="#173f3d"/><text x="724" y="168" fill="#f7f8f5">reviewed</text><text x="724" y="202" fill="#dfeee8">human gate</text><text x="724" y="226" fill="#dfeee8">release</text>
    <rect x="912" y="132" width="112" height="112" rx="18" fill="#f5d9dc" stroke="#d99da6"/><text x="928" y="168">blocked</text><text x="928" y="202">gap</text><text x="928" y="226">rollback</text>
  </g>
  <g stroke="#79908c" stroke-width="3" fill="none" stroke-linecap="round"><path d="M236 188h34"/><path d="M450 188h34"/><path d="M664 188h34"/><path d="M878 188h34"/><path d="M968 132v-42H574v42"/></g>
  <rect x="56" y="296" width="968" height="50" rx="15" fill="#182033"/><text x="540" y="328" font-family="monospace" font-size="15" text-anchor="middle" fill="#f7f8f5">blocked is a truthful state, never silently promoted to pass</text>
</svg>
