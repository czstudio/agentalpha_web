<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Code Agent 交接回放 manifest</title><desc id="desc">运行时、fixture、feature flag 和输出 hash 组成可执行的交接证据</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">交接回放：让另一个人能复现结论</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">命令只是入口，环境和不变量才是证据</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">运行时</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">Node / Python</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">lock hash</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">数据与开关</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">schema / fixture</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">feature flags</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">最短回放</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">safe command</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">no prod secret</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">结论</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">output hash</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">invariants pass</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">可接手不是共享更多权限，而是提供最小可复现证据</text>
</svg>
