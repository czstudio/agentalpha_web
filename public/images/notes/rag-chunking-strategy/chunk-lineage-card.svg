<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Chunk lineage 边界理由</title>
  <desc id="desc">边界理由、父子关系、邻接和检索补上下文策略一起保存。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F4EE"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#193C3A">Chunk 要记录“为什么在这里断开”</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#58706D">边界理由比盲目加 overlap 更能解释 bad case</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="214" height="126" rx="18" fill="#EAF3F7"/><text x="161" y="172" font-size="19" font-weight="700" fill="#275261">边界</text><text x="161" y="207" font-size="15" fill="#52727A">heading / table</text><text x="161" y="233" font-size="15" fill="#52727A">code / token limit</text>
    <rect x="292" y="132" width="214" height="126" rx="18" fill="#E5F0ED"/><text x="399" y="172" font-size="19" font-weight="700" fill="#1C615A">lineage</text><text x="399" y="207" font-size="15" fill="#31514E">parent / neighbors</text><text x="399" y="233" font-size="15" fill="#31514E">title path</text>
    <rect x="530" y="132" width="214" height="126" rx="18" fill="#FFF0D6"/><text x="637" y="172" font-size="19" font-weight="700" fill="#875B26">检索提示</text><text x="637" y="207" font-size="15" fill="#6C5632">add parent</text><text x="637" y="233" font-size="15" fill="#6C5632">preserve header</text>
    <rect x="768" y="132" width="260" height="126" rx="18" fill="#173F3D"/><text x="898" y="182" font-size="19" font-weight="700" fill="#FFFFFF">可回放</text><text x="898" y="218" font-size="15" fill="#D8EBE5">证据完整率 / 重复率</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M268 195h24"/><path d="M506 195h24"/><path d="M744 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">命中表格行就补表头，命中函数就补签名，结构信息驱动上下文</text>
</svg>
