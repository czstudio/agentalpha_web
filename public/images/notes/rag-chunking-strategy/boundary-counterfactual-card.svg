<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">边界反事实卡</title>
  <desc id="desc">移动关键前提到相邻段落、表格或代码边界，检查 chunk 是否真的包含充分证据。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">分块评测之后：做一次边界反事实</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">把关键前提挪一下，排除“靠堆上下文碰巧答对”</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="167" font-size="18" font-weight="700" fill="#275261">固定问题</text><text x="147" y="199" font-size="15" fill="#52727a">标最小充分证据</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="167" font-size="18" font-weight="700" fill="#6e5223">移动前提</text><text x="357" y="199" font-size="15" fill="#806a3d">段落 / 表格 / 代码</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="167" font-size="18" font-weight="700" fill="#2b6353">回放召回</text><text x="567" y="199" font-size="15" fill="#53786b">完整率 / 噪声 / 定位</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="167" font-size="18" font-weight="700" fill="#78454d">定位首因</text><text x="777" y="199" font-size="15" fill="#855c63">修解析或父子块</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="175" font-size="18" font-weight="700" fill="#ffffff">再调参</text><text x="960" y="207" font-size="15" fill="#d8ebe5">有依据</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round"><path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/></g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">只有调整 top-k 才找回前提，通常说明结构边界仍有问题</text>
</svg>
