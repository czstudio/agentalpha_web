<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">MCP 协议兼容性矩阵</title><desc id="desc">客户端、Server、schema、无副作用探针和升级决策组成 MCP 兼容性矩阵</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">协议升级：先跑兼容性探针</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">名字不变，不代表参数语义没变</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">客户端</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">host-2.4</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">legacy fixture</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">Server</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">billing-mcp-3.1</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">signed build</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">Schema</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">hash diff</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">semantic change</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">探针</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">no side effect</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">old / new client</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">决策</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">upgrade</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">block</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">结构校验通过后，还要确认语义和副作用兼容</text>
</svg>
