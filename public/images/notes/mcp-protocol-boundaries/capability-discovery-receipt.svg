<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">MCP 能力发现登记回执</title><desc id="desc">来源、工具契约、策略快照、租约和执行前核对组成能力发现回执</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">MCP 能力发现登记回执</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">先登记事实，再把能力交给模型</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="178" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="141" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">来源</text><text x="141" y="191" text-anchor="middle" font-size="13" fill="#48635f">server + transport</text><text x="141" y="215" text-anchor="middle" font-size="13" fill="#48635f">签名与租户</text>
    <rect x="250" y="122" width="178" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="339" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">契约</text><text x="339" y="191" text-anchor="middle" font-size="13" fill="#48635f">schema_hash</text><text x="339" y="215" text-anchor="middle" font-size="13" fill="#48635f">risk + side effect</text>
    <rect x="448" y="122" width="178" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="537" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">策略</text><text x="537" y="191" text-anchor="middle" font-size="13" fill="#48635f">policy snapshot</text><text x="537" y="215" text-anchor="middle" font-size="13" fill="#48635f">环境与风险</text>
    <rect x="646" y="122" width="178" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="735" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">租约</text><text x="735" y="191" text-anchor="middle" font-size="13" fill="#48635f">expires_at</text><text x="735" y="215" text-anchor="middle" font-size="13" fill="#48635f">失效可追踪</text>
    <rect x="844" y="122" width="184" height="126" rx="17" fill="#173f3d"/><text x="936" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">调用前</text><text x="936" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">重新核对</text><text x="936" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">冻结或放行</text>
  </g>
  <path d="M230 185h20M428 185h20M626 185h20M824 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">完整回执留在网关，模型只消费经过过滤的能力卡</text>
</svg>
