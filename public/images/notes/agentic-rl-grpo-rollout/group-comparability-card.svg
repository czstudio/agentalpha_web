<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 组可比性检查</title>
  <desc id="desc">同一提示、策略、环境和 verifier 通过后才进入更新</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Group comparability</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">组内条件不一致时，奖励差异不能直接当作学习信号</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">同一 prompt</text>
    <text x="147" y="194" font-size="15" fill="#365b61">prompts_hash</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">组内固定</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">策略</text>
    <text x="357" y="194" font-size="15" fill="#365b61">policy + tokenizer</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">拒绝 policy lag</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">环境</text>
    <text x="567" y="194" font-size="15" fill="#365b61">snapshot + tools</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">排除 infra fail</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">筛选</text>
    <text x="777" y="194" font-size="15" fill="#365b61">valid members</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">记录排除原因</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">入批</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">算 advantage</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">或只做统计</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：prompt、策略、环境、verifier 与随机性一致，排除原因可回放</text>
</svg>
