<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Rollout 新鲜度回执</title>
  <desc id="desc">策略版本、环境、等待时间、奖励和入批门槛组成 rollout 新鲜度回执。</desc>
  <rect width="1080" height="390" rx="24" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Rollout 入批：先检查样本新鲜度</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5d7271">组内优势只有在策略、环境和验证器可比时才有解释力。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#173f3d">
    <rect x="52" y="122" width="178" height="122" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="103" y="171">策略</text><text x="91" y="202" font-size="14" font-weight="500">sample / current</text>
    <rect x="250" y="122" width="178" height="122" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="309" y="171">环境</text><text x="283" y="202" font-size="14" font-weight="500">snapshot + verifier</text>
    <rect x="448" y="122" width="178" height="122" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="507" y="171">等待</text><text x="480" y="202" font-size="14" font-weight="500">queue + lag</text>
    <rect x="646" y="122" width="178" height="122" rx="18" fill="#f5d9dc" stroke="#dfb2b9"/><text x="704" y="171">奖励</text><text x="677" y="202" font-size="14" font-weight="500">std + terminal</text>
    <rect x="844" y="122" width="184" height="122" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="903" y="171">入批</text><text x="875" y="202" font-size="14" font-weight="500">allow / isolate</text>
  </g>
  <g stroke="#6d8989" stroke-width="3" fill="none"><path d="M230 183h20"/><path d="M428 183h20"/><path d="M626 183h20"/><path d="M824 183h20"/></g>
  <rect x="52" y="294" width="976" height="48" rx="14" fill="#173f3d"/>
  <text x="349" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#e7f4ef">样本新鲜度是训练信号的一部分</text>
</svg>
