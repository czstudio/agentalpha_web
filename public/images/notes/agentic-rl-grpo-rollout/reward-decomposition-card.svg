<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Rollout 奖励拆解</title><desc id="desc">总奖励、任务成功、证据支持、工具安全和入批门禁</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">总 reward 之外，要知道模型凭什么得分</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">把能力、证据、安全和风格拆开，才能识别 verifier 捷径</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">任务</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">success</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">outcome</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">support</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">readback</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">安全</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">tool policy</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">side effects</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">风格</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">style cap</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">format</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">入批</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">admit</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">hold</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">风格分上涨不等于任务变好，先看事实回读和工具安全</text>
</svg>
