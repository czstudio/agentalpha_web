<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">GRPO Agent rollout 分组流程</title>
  <desc id="desc">固定问题与环境快照后生成多条轨迹，经工具执行、统一验收和组内优势计算进入更新。</desc>
  <rect width="1200" height="640" fill="#f7f4ee"/>
  <text x="72" y="72" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17221b">GRPO 的“组”先要能比较</text>
  <text x="72" y="106" font-family="Arial, sans-serif" font-size="16" fill="#627066">同一问题 + 同一环境契约 + 同一验收器，才是有效的相对优势。</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="180" width="200" height="120" rx="16" fill="#17221b"/>
    <text x="102" y="226" font-size="18" font-weight="700" fill="#f7f4ee">Prompt + 快照</text>
    <text x="102" y="258" font-size="15" fill="#cbd7ce">problem v3 / env v7</text>
    <g>
      <rect x="360" y="140" width="260" height="72" rx="14" fill="#e7f1e8" stroke="#7ca587" stroke-width="2"/><text x="390" y="184" font-size="17" fill="#285339">rollout 1：成功，R=1</text>
      <rect x="360" y="232" width="260" height="72" rx="14" fill="#f3ead9" stroke="#c39b55" stroke-width="2"/><text x="390" y="276" font-size="17" fill="#705426">rollout 2：超时，R=0</text>
      <rect x="360" y="324" width="260" height="72" rx="14" fill="#e9edf4" stroke="#7f93b0" stroke-width="2"/><text x="390" y="368" font-size="17" fill="#334b6a">rollout 3：部分正确，R=.5</text>
      <rect x="360" y="416" width="260" height="72" rx="14" fill="#f2e6e5" stroke="#ba7a73" stroke-width="2"/><text x="390" y="460" font-size="17" fill="#703e39">rollout 4：环境错，丢弃</text>
    </g>
    <rect x="730" y="220" width="220" height="150" rx="16" fill="#e9edf4" stroke="#7f93b0" stroke-width="2"/>
    <text x="762" y="264" font-size="18" font-weight="700" fill="#334b6a">统一验收</text>
    <text x="762" y="300" font-size="15" fill="#3e4a5a">verifier v4</text>
    <text x="762" y="328" font-size="15" fill="#3e4a5a">过滤 infra failure</text>
    <text x="762" y="356" font-size="15" fill="#3e4a5a">计算组内均值/方差</text>
    <rect x="1010" y="220" width="118" height="150" rx="16" fill="#17221b"/>
    <text x="1036" y="276" font-size="18" font-weight="700" fill="#f7f4ee">更新</text>
    <text x="1036" y="310" font-size="15" fill="#cbd7ce">Aᵢ</text>
    <text x="1036" y="340" font-size="15" fill="#cbd7ce">+ KL</text>
  </g>
  <g stroke="#51645a" stroke-width="3" fill="none" stroke-linecap="round"><path d="M272 240 H350"/><path d="M620 315 H720"/><path d="M950 295 H1000"/></g>
  <g fill="#51645a"><path d="M350 240 l-12 -8 v16z"/><path d="M720 315 l-12 -8 v16z"/><path d="M1000 295 l-12 -8 v16z"/></g>
  <rect x="72" y="548" width="1056" height="52" rx="12" fill="#f3ead9"/>
  <text x="100" y="581" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#705426">环境故障不能进入优势：否则模型学到的是“避开坏网络”，不是“选更好动作”。</text>
</svg>
