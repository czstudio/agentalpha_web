<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">提交回执契约</title><desc id="desc">传输 ACK、业务状态、回读校验和下一步动作组成可消费的提交回执</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">提交回执契约</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">消息收到了，不代表业务状态已经可以被下游消费</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">传输</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">ack: true</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">message_id</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">业务</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">committed</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">version: 42</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">验证</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">read_back: true</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">hash verified</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">未知</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">暂停依赖命令</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">启动对账</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">下一步</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">publish</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">或停下</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">只有三层事实都通过，产物才从 pending 进入可消费状态</text>
</svg>
