<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 协议兼容窗口</title><desc id="desc">版本声明、字段分类、兼容窗口、权限拒绝流程</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">协议升级要有窗口，别让 Agent 靠猜字段协作</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">未知展示字段可忽略，未知权限字段必须拒绝并记录</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">声明</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">protocol_version</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">capabilities</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">分类</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">display / optional</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">permission / required</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">窗口</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">dual read/write</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">sunset_at</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">处理</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">ignore / reject</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">audit event</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">兼容不是放过所有未知字段，而是把安全边界写进协议</text>
</svg>
