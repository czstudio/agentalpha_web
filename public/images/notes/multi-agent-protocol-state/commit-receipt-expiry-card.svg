<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">提交回执过期卡</title><desc id="desc">版本、幂等键、有效窗口和重放处理组成状态边界</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">提交回执过期卡：旧消息不能覆盖新事实</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">过期、重放和未知结果都要有明确出口</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">回执</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">committed</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">版本 18</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">窗口</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">09:30—09:35</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">到期即停</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">同键重放</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">返回当前状态</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">不重复写入</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">旧版本</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">拒绝</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">读回对账</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">未知</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">暂停</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">人工</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">消息送达只是传输事实，读回才是业务事实</text>
</svg>
