<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">重复投递探针</title>
  <desc id="desc">对相同 key、改变 payload、旧版本、错消费者和乱序事件执行不同协议边界。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">过期回执之后：做一次重复投递探针</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">消息到达、业务提交、权限正确是三件不同的事</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="167" font-size="18" font-weight="700" fill="#275261">投递 envelope</text><text x="147" y="199" font-size="15" fill="#52727a">同 key 多变体</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="167" font-size="18" font-weight="700" fill="#6e5223">识别边界</text><text x="357" y="199" font-size="15" fill="#806a3d">版本 / consumer</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="167" font-size="18" font-weight="700" fill="#2b6353">读回状态</text><text x="567" y="199" font-size="15" fill="#53786b">提交还是 pending</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="167" font-size="18" font-weight="700" fill="#78454d">分流处置</text><text x="777" y="199" font-size="15" fill="#855c63">去重 / 拒绝 / 人工</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="175" font-size="18" font-weight="700" fill="#ffffff">边界完整</text><text x="960" y="207" font-size="15" fill="#d8ebe5">可回放</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round"><path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/></g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">同 key 同 payload 才去重，同 key 改 payload 要拒绝冲突</text>
</svg>
