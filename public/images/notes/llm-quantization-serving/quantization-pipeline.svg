  </g>
  <g fill="none" stroke="#5e8d7c" stroke-width="4"><path d="M270 240H330"/><path d="m317 228 18 12-18 12" fill="#5e8d7c"/><path d="M545 240H605"/><path d="m592 228 18 12-18 12" fill="#5e8d7c"/><path d="M820 240H880"/><path d="m867 228 18 12-18 12" fill="#5e8d7c"/></g>
  <text x="90" y="380" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#6b7d75">关键层保留高精度；结构化输出、长上下文和工具调用必须进入回归集。</text>
</svg>
