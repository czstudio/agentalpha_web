<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#f8faf9"/>
  <text x="70" y="70" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#19372f">量化上线链路：校准、回归、灰度、回退</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="70" y="200" width="200" height="80" rx="16" fill="#e9f1f8" stroke="#a6bfd5" stroke-width="2"/><text x="170" y="248" font-size="18" fill="#2d607e">线上样本校准</text>
    <rect x="345" y="200" width="200" height="80" rx="16" fill="#e8f3ee" stroke="#9ec8b3" stroke-width="2"/><text x="445" y="248" font-size="18" fill="#285d4d">质量 + 性能回归</text>
    <rect x="620" y="200" width="200" height="80" rx="16" fill="#f2eee2" stroke="#d3bb7d" stroke-width="2"/><text x="720" y="248" font-size="18" fill="#7c622e">小流量灰度</text>
