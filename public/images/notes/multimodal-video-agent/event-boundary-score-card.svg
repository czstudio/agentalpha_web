<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">视频事件边界评测</title><desc id="desc">时间召回、边界误差、证据支持率和无关覆盖率分开验收</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">视频事件评测：找到了，不等于边界准</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">同一条命中率里可能藏着完全不同的时间质量</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">时间召回</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">overlap gold</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">event type</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">边界误差</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">start / end MAE</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">allowed window</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据支持</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">ASR / OCR / frame</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">replayable</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">无关覆盖</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">irrelevant span</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">pass / watch</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">事件定位要同时证明“命中哪里”和“边界为什么在那里”</text>
</svg>
