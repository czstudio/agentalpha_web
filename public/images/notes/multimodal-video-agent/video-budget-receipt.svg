<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">视频帧预算回执</title><desc id="desc">路由、时间窗、信号、证据结果和成本组成视频采样预算回执</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">视频帧预算回执：每多一帧都要有收益</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">把采样升级、证据质量和视觉成本放在一条链路里</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">路由</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">coarse → fine</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">事件命中</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">时间窗</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">6 → 18 frames</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">4.4 seconds</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">信号</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">ASR / motion</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">OCR optional</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">recall 1.0</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">error 240ms</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">成本</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">4820 tokens</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">P95 910ms</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">增加采样要同时带来更好的定位，不能只带来更高账单</text>
</svg>
