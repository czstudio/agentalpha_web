<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">视频证据预算</title><desc id="desc">视频 Agent 按问题类型分配帧预算，缓存稳定索引，最终证据受版本权限约束</desc>
  <rect width="1080" height="360" rx="24" fill="#f7f8f5"/>
  <text x="52" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#173f3d">视频证据预算：帧越多不等于答案越好</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#5b7470">先复用稳定索引，再按问题的信息增益追加帧</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="52" y="126" width="210" height="154" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="78" y="158" font-size="18" font-weight="700" fill="#173f3d">稳定索引</text><text x="78" y="190" font-size="14" fill="#48635f">低频时间轴</text><text x="78" y="216" font-size="14" fill="#48635f">镜头 / ASR / OCR</text><text x="78" y="242" font-size="14" fill="#48635f">source hash</text>
    <rect x="288" y="126" width="210" height="154" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="314" y="158" font-size="18" font-weight="700" fill="#173f3d">静态事实</text><text x="314" y="190" font-size="14" fill="#48635f">代表帧优先</text><text x="314" y="216" font-size="14" fill="#48635f">小窗口 / 小预算</text><text x="314" y="242" font-size="14" fill="#48635f">重复帧聚类</text>
    <rect x="524" y="126" width="210" height="154" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="550" y="158" font-size="18" font-weight="700" fill="#173f3d">动作因果</text><text x="550" y="190" font-size="14" fill="#48635f">前后短片段</text><text x="550" y="216" font-size="14" fill="#48635f">变化点加密</text><text x="550" y="242" font-size="14" fill="#48635f">窗口有上限</text>
    <rect x="760" y="126" width="268" height="154" rx="18" fill="#fae8e1" stroke="#e0b9ae"/><text x="786" y="158" font-size="18" font-weight="700" fill="#173f3d">最终证据</text><text x="786" y="190" font-size="14" fill="#48635f">权限 / 租户过滤</text><text x="786" y="216" font-size="14" fill="#48635f">index_version</text><text x="786" y="242" font-size="14" fill="#48635f">不可回答就停止</text>
  </g>
  <path d="M262 203h26M498 203h26M734 203h26" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
</svg>
