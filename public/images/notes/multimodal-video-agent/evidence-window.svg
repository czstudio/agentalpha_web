<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Video evidence window</title>
  <desc id="desc">视频时间窗将时间、帧、ASR、OCR和原片回放绑定</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Evidence window：答案要能跳回原片</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">同一时间轴串起“看到了什么”和“怎么找到的”</text>
  <line x1="74" y1="172" x2="1005" y2="172" stroke="#71918c" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" text-anchor="middle">
    <circle cx="176" cy="172" r="12" fill="#205a5e"/><text x="176" y="135" font-size="13" font-weight="700" fill="#205a5e">ASR</text><text x="176" y="210" font-size="12" fill="#5b7470">416.1s</text>
    <circle cx="420" cy="172" r="12" fill="#d49a35"/><text x="420" y="135" font-size="13" font-weight="700" fill="#8a5d16">OCR</text><text x="420" y="210" font-size="12" fill="#5b7470">419.0s</text>
    <circle cx="646" cy="172" r="15" fill="#c66b62"/><text x="646" y="135" font-size="13" font-weight="700" fill="#8c4b46">frame</text><text x="646" y="210" font-size="12" fill="#5b7470">421.6s</text>
    <circle cx="892" cy="172" r="12" fill="#173f3d"/><text x="892" y="135" font-size="13" font-weight="700" fill="#173f3d">seek</text><text x="892" y="210" font-size="12" fill="#5b7470">原片回放</text>
  </g>
  <rect x="112" y="258" width="856" height="58" rx="15" fill="#e8f2f3"/>
  <text x="540" y="293" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" fill="#205a5e" text-anchor="middle">supported / partial / unknown：不确定性也要落在证据窗上</text>
</svg>
