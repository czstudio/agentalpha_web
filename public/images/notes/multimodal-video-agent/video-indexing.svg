<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">视频 Agent 分层索引</title>
  <desc id="desc">低频帧、镜头切分、ASR 和 OCR 构成时间轴，候选窗口再进入视觉精读。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <path d="M80 180h120M290 180h120M500 180h120M710 180h100" stroke="#8eb8af" stroke-width="4" stroke-linecap="round"/><path d="m190 170 18 10-18 10M400 170l18 10-18 10M610 170l18 10-18 10M800 170l18 10-18 10" fill="#8eb8af"/>
  <rect x="24" y="106" width="180" height="148" rx="18" fill="#e9f1ed" stroke="#9bc1b5"/><text x="114" y="148" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#173f3d">视频</text><text x="114" y="184" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4c7068">百万级帧</text><text x="114" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4c7068">统一时间轴</text>
  <rect x="214" y="106" width="180" height="148" rx="18" fill="#f4dca6" stroke="#e5c58a"/><text x="304" y="148" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#704c20">粗筛</text><text x="304" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#87683d">低频帧 · ASR</text><text x="304" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#87683d">OCR · 镜头</text>
  <rect x="424" y="106" width="180" height="148" rx="18" fill="#eaf3f7" stroke="#a7c8d6"/><text x="514" y="148" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#24556a">候选窗口</text><text x="514" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#587783">命中时间</text><text x="514" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#587783">前后扩窗</text>
  <rect x="634" y="106" width="230" height="148" rx="18" fill="#f2eaf7" stroke="#c6aed7"/><text x="749" y="148" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#604774">精读与回放</text><text x="749" y="184" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#765d86">关键帧 · 短片段</text><text x="749" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#765d86">答案 → 时间戳</text>
  <text x="24" y="322" font-family="sans-serif" font-size="16" fill="#647775">先索引时间，再把昂贵的视觉理解用在候选窗口。</text>
</svg>
