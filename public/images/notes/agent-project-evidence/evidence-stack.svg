<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">项目证据四层</title>
  <desc id="desc">从行为证据到运行、对照和回归证据逐层增强项目结论的可信度</desc>
  <rect width="1080" height="360" rx="28" fill="#f7f8f5"/>
  <text x="54" y="58" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#173f3d">证据四层：截图只是第一层</text>
  <text x="54" y="88" font-family="Inter,Arial,sans-serif" font-size="15" fill="#50706c">行为 → 运行 → 对照 → 回归，越往右越能回答“是否可复现”</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="54" y="132" width="224" height="140" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="84" y="170" font-size="18" font-weight="700" fill="#173f3d">01 行为</text><text x="84" y="204" font-size="15" fill="#315653">输入 / 输出</text><text x="84" y="228" font-size="15" fill="#315653">引用 / 回执</text><text x="84" y="252" font-size="14" fill="#50706c">用户看到什么</text>
    <path d="M288 202h34" stroke="#7eaaa7" stroke-width="3"/><path d="m314 192 12 10-12 10" fill="none" stroke="#7eaaa7" stroke-width="3"/>
    <rect x="336" y="132" width="224" height="140" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="366" y="170" font-size="18" font-weight="700" fill="#173f3d">02 运行</text><text x="366" y="204" font-size="15" fill="#315653">trace / 日志</text><text x="366" y="228" font-size="15" fill="#315653">延迟 / 成本</text><text x="366" y="252" font-size="14" fill="#50706c">系统怎么跑</text>
    <path d="M570 202h34" stroke="#7eaaa7" stroke-width="3"/><path d="m596 192 12 10-12 10" fill="none" stroke="#7eaaa7" stroke-width="3"/>
    <rect x="618" y="132" width="190" height="140" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="648" y="170" font-size="18" font-weight="700" fill="#173f3d">03 对照</text><text x="648" y="204" font-size="15" fill="#315653">基线 / 变量</text><text x="648" y="228" font-size="15" fill="#315653">分桶 / 结果</text><text x="648" y="252" font-size="14" fill="#50706c">改动有效吗</text>
    <path d="M818 202h34" stroke="#7eaaa7" stroke-width="3"/><path d="m844 192 12 10-12 10" fill="none" stroke="#7eaaa7" stroke-width="3"/>
    <rect x="870" y="132" width="156" height="140" rx="18" fill="#fae8e1" stroke="#e0b9ae"/><text x="900" y="170" font-size="18" font-weight="700" fill="#173f3d">04 回归</text><text x="900" y="204" font-size="15" fill="#315653">失败样本</text><text x="900" y="228" font-size="15" fill="#315653">演练 / 门槛</text><text x="900" y="252" font-size="14" fill="#50706c">下次能挡住吗</text>
  </g>
</svg>
