<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">指标证据链</title><desc id="desc">数据集、基线、唯一变量、指标和代价共同支撑一个结论。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><rect x="65" y="160" width="140" height="80" rx="16" fill="#eaf3f7" stroke="#24556a"/><text x="135" y="194" font-size="17" font-weight="700">数据集</text><text x="135" y="218" font-size="13">version / n</text><path d="M205 200h38M373 200h38M541 200h38M709 200h38" stroke="#86a59d" stroke-width="4"/><rect x="243" y="160" width="130" height="80" rx="16" fill="#dfeee8" stroke="#86a59d"/><text x="308" y="206" font-size="17" font-weight="700">基线</text><rect x="411" y="160" width="130" height="80" rx="16" fill="#fff1d9" stroke="#c69a58"/><text x="476" y="206" font-size="17" font-weight="700">变量</text><rect x="579" y="160" width="130" height="80" rx="16" fill="#fae8e1" stroke="#b96d59"/><text x="644" y="206" font-size="17" font-weight="700">指标</text><rect x="747" y="160" width="100" height="80" rx="16" fill="#173f3d"/><text x="797" y="206" font-size="17" font-weight="700" fill="#fff">代价</text><text x="450" y="320" font-size="17" fill="#4d6562">没有口径的提升，只是一个形容词</text></g></svg>
