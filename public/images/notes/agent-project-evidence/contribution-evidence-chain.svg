<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">项目个人贡献证据链</title><desc id="desc">动作、版本、指标、样本和复核人组成个人贡献证据链</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">项目个人贡献证据链</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">一个结论，沿着改动和数据走得通</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="178" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="141" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">动作</text><text x="141" y="191" text-anchor="middle" font-size="13" fill="#48635f">发现问题</text><text x="141" y="215" text-anchor="middle" font-size="13" fill="#48635f">设计与实现</text>
    <rect x="250" y="122" width="178" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="339" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">版本</text><text x="339" y="191" text-anchor="middle" font-size="13" fill="#48635f">commit / config</text><text x="339" y="215" text-anchor="middle" font-size="13" fill="#48635f">变更边界</text>
    <rect x="448" y="122" width="178" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="537" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">指标</text><text x="537" y="191" text-anchor="middle" font-size="13" fill="#48635f">基线 / 结果</text><text x="537" y="215" text-anchor="middle" font-size="13" fill="#48635f">收益与代价</text>
    <rect x="646" y="122" width="178" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="735" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">样本</text><text x="735" y="191" text-anchor="middle" font-size="13" fill="#48635f">回放集</text><text x="735" y="215" text-anchor="middle" font-size="13" fill="#48635f">反事实</text>
    <rect x="844" y="122" width="184" height="126" rx="17" fill="#173f3d"/><text x="936" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">复核</text><text x="936" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">owner + reviewer</text><text x="936" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">可交接</text>
  </g>
  <path d="M230 185h20M428 185h20M626 185h20M824 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">贡献不是一句“我负责”，而是一条可核对的链</text>
</svg>
