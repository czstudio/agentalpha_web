<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">项目证据卡</title><desc id="desc">背景、基线、改动、结果和风险组成一页证据卡。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><rect x="100" y="58" width="700" height="300" rx="18" fill="#fff" stroke="#86a59d" stroke-width="2"/><path d="M100 122h700M100 180h700M100 238h700M100 296h700" stroke="#c5d4cf" stroke-width="2"/><g font-size="18" font-weight="700"><text x="135" y="99">场景</text><text x="270" y="99" font-size="16" font-weight="400">谁在什么约束下遇到什么问题</text><text x="135" y="157">基线</text><text x="270" y="157" font-size="16" font-weight="400">原方案、数据集和失败口径</text><text x="135" y="215">动作</text><text x="270" y="215" font-size="16" font-weight="400">自己改了哪个边界</text><text x="135" y="273">结果</text><text x="270" y="273" font-size="16" font-weight="400">指标、延迟、成本和安全</text><text x="135" y="331">风险</text><text x="270" y="331" font-size="16" font-weight="400">仍未覆盖的失败与下一步</text></g></g></svg>
