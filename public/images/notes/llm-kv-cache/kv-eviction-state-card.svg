<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">KV Cache 回收状态</title>
  <desc id="desc">活跃序列不驱逐，可复用块按租户配额回收，未知分支保留对账状态。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F8F5"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#173F3D">KV Cache 回收先保护活跃状态</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#5B7470">命中率不是唯一目标，未知分支也要留出对账空间</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="214" height="126" rx="18" fill="#F5D9DC"/><text x="161" y="172" font-size="19" font-weight="700" fill="#78454D">active</text><text x="161" y="207" font-size="15" fill="#855C63">evict = false</text><text x="161" y="233" font-size="15" fill="#855C63">live decode</text>
    <rect x="292" y="132" width="214" height="126" rx="18" fill="#E5F0ED"/><text x="399" y="172" font-size="19" font-weight="700" fill="#1C615A">reusable</text><text x="399" y="207" font-size="15" fill="#31514E">LRU + tenant quota</text><text x="399" y="233" font-size="15" fill="#31514E">safe to evict</text>
    <rect x="530" y="132" width="214" height="126" rx="18" fill="#FFF0D6"/><text x="637" y="172" font-size="19" font-weight="700" fill="#875B26">reconcile_hold</text><text x="637" y="207" font-size="15" fill="#6C5632">TTL 900s</text><text x="637" y="233" font-size="15" fill="#6C5632">unknown branch</text>
    <rect x="768" y="132" width="260" height="126" rx="18" fill="#173F3D"/><text x="898" y="182" font-size="19" font-weight="700" fill="#FFFFFF">降级</text><text x="898" y="218" font-size="15" fill="#D8EBE5">拒绝长请求 → 排队</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M268 195h24"/><path d="M506 195h24"/><path d="M744 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">GPU/CPU/磁盘迁移都要重新验证模型、位置、adapter 和租户兼容指纹</text>
</svg>
