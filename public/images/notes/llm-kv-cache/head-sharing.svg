<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">MHA GQA MQA 的 KV head 共享</title>
  <desc id="desc">展示相同数量的 Query head 如何共享不同数量的 K/V head。</desc>
  <rect width="1200" height="500" rx="24" fill="#f7f3ec"/>
  <text x="70" y="70" font-family="Arial, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#323e3e">减少 KV head，就能减少缓存和带宽</text>
  <g font-family="Arial, PingFang SC, sans-serif" text-anchor="middle">
    <text x="140" y="128" font-size="19" font-weight="700" fill="#323e3e">MHA</text><text x="500" y="128" font-size="19" font-weight="700" fill="#323e3e">GQA</text><text x="860" y="128" font-size="19" font-weight="700" fill="#323e3e">MQA</text>
    <g fill="#fffaf1" stroke="#ce741e" stroke-width="2"><rect x="80" y="170" width="110" height="42" rx="8"/><rect x="80" y="230" width="110" height="42" rx="8"/><rect x="80" y="290" width="110" height="42" rx="8"/><rect x="80" y="350" width="110" height="42" rx="8"/></g>
    <g fill="#e8d9c4" stroke="#ce741e" stroke-width="2"><rect x="250" y="170" width="110" height="42" rx="8"/><rect x="250" y="230" width="110" height="42" rx="8"/><rect x="250" y="290" width="110" height="42" rx="8"/><rect x="250" y="350" width="110" height="42" rx="8"/></g>
    <g fill="#323e3e" font-size="16"><text x="135" y="197">Q₁</text><text x="135" y="257">Q₂</text><text x="135" y="317">Q₃</text><text x="135" y="377">Q₄</text><text x="305" y="197">K/V₁</text><text x="305" y="257">K/V₂</text><text x="305" y="317">K/V₃</text><text x="305" y="377">K/V₄</text></g>
    <g stroke="#7fb069" stroke-width="2"><path d="M440 190h100M440 250h100M440 310h100M440 370h100"/></g><g fill="#eef5e9" stroke="#7fb069" stroke-width="2"><rect x="550" y="170" width="110" height="42" rx="8"/><rect x="550" y="290" width="110" height="42" rx="8"/></g><g fill="#fffaf1" stroke="#ce741e" stroke-width="2"><rect x="380" y="170" width="50" height="42" rx="8"/><rect x="380" y="230" width="50" height="42" rx="8"/><rect x="380" y="290" width="50" height="42" rx="8"/><rect x="380" y="350" width="50" height="42" rx="8"/></g><g fill="#323e3e" font-size="16"><text x="405" y="197">Q</text><text x="405" y="257">Q</text><text x="405" y="317">Q</text><text x="405" y="377">Q</text><text x="605" y="197">K/V₁</text><text x="605" y="317">K/V₂</text></g>
    <g stroke="#7fb069" stroke-width="2"><path d="M790 190h100M790 250h100M790 310h100M790 370h100"/></g><g fill="#eef5e9" stroke="#7fb069" stroke-width="2"><rect x="900" y="250" width="110" height="42" rx="8"/></g><g fill="#fffaf1" stroke="#ce741e" stroke-width="2"><rect x="730" y="170" width="50" height="42" rx="8"/><rect x="730" y="230" width="50" height="42" rx="8"/><rect x="730" y="290" width="50" height="42" rx="8"/><rect x="730" y="350" width="50" height="42" rx="8"/></g><g fill="#323e3e" font-size="16"><text x="755" y="197">Q</text><text x="755" y="257">Q</text><text x="755" y="317">Q</text><text x="755" y="377">Q</text><text x="955" y="277">K/V₁</text></g>
    <text x="220" y="440" font-size="15" fill="#7b7770">4 个 Q → 4 组 KV</text><text x="500" y="440" font-size="15" fill="#7b7770">4 个 Q → 2 组 KV</text><text x="820" y="440" font-size="15" fill="#7b7770">4 个 Q → 1 组 KV</text>
  </g>
</svg>
