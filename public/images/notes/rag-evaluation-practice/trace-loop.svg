<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">RAG 评测回归闭环</title>
  <desc id="desc">从真实问题集到检索回放、人工复核和版本比较，形成可持续的评测回归闭环。</desc>
  <rect width="1200" height="390" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">评测不是发布前的一次考试，而是版本回归</text>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="70" y="145" width="190" height="76" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="165" y="177" fill="#1d1d1f" font-weight="700">真实问题集</text><text x="165" y="201" fill="#6b6e70">golden + bad case</text>
    <rect x="315" y="145" width="190" height="76" rx="14" fill="#edf1f6" stroke="#c5d1e2"/><text x="410" y="177" fill="#1d1d1f" font-weight="700">离线回放</text><text x="410" y="201" fill="#6b6e70">固定版本与环境</text>
    <rect x="560" y="145" width="190" height="76" rx="14" fill="#f4ead0" stroke="#dfc783"/><text x="655" y="177" fill="#1d1d1f" font-weight="700">分层比较</text><text x="655" y="201" fill="#6b6e70">召回 / 证据 / 生成</text>
    <rect x="805" y="145" width="190" height="76" rx="14" fill="#e6f1ed" stroke="#9bc9bc"/><text x="900" y="177" fill="#1d1d1f" font-weight="700">人工复核</text><text x="900" y="201" fill="#6b6e70">确认真值与偏差</text>
    <rect x="1040" y="145" width="100" height="76" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="1090" y="177" fill="#1d1d1f" font-weight="700">合并</text><text x="1090" y="201" fill="#6b6e70">回归集</text>
    <g fill="#247a6b" font-size="26"><text x="278" y="193">→</text><text x="523" y="193">→</text><text x="768" y="193">→</text><text x="1013" y="193">→</text></g>
  </g>
  <path d="M1090 270 C1090 335 170 335 170 270" fill="none" stroke="#247a6b" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="510" y="325" fill="#247a6b" font-family="Arial, sans-serif" font-size="15">线上新 bad case 回流，下一次版本继续验证</text>
</svg>
