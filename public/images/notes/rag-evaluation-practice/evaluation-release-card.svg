<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">RAG 评测发布卡</title><desc id="desc">RAG 评测同时检查覆盖、证据支持、拒答校准和切片阻断条件</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">RAG 评测发布卡：总分之外还有行为校准</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">覆盖、支持、拒答和成本必须能回放到同一份 golden set</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">覆盖</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">Recall@20</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">multi-hop</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">支持</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">citation 0.86</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">claim coverage</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">校准</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">answer / clarify</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">/ refuse</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">切片</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">stale version</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">阻断条件</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">发布</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">canary</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">回放</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">RAG 评测不是追一个分数，而是决定能否安全发布</text>
</svg>
