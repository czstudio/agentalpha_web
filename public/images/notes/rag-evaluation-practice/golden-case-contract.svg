<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Golden case 契约</title><desc id="desc">问题、期望模式、证据条件、拒答触发器和回归责任组成评测样本</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Golden case：把“允许不回答”写进标准答案</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">评测的不只是会不会答，还包括什么时候停下来</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">问题</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">版本冲突</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">权限不明</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">期望模式</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">answer</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">clarify / refuse</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据条件</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">policy_version</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">effective_date</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">触发器</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">version missing</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">scope unknown</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回归</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">owner</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">可复跑</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">拒答不是失败，编造才是失败</text>
</svg>
