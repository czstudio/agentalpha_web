<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">数据质量闸门</title>
  <desc id="desc">数据进入训练前经过来源许可、安全、完整性、重复和目标相关性五道闸门，并保留 quarantine。</desc>
  <rect width="1200" height="370" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">数据进入训练前，先过五道闸门</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#dfe4df"><rect x="60" y="145" width="190" height="112" rx="14"/><rect x="280" y="145" width="190" height="112" rx="14"/><rect x="500" y="145" width="190" height="112" rx="14"/><rect x="720" y="145" width="190" height="112" rx="14"/><rect x="940" y="145" width="200" height="112" rx="14"/></g>
    <text x="155" y="180" fill="#247a6b" font-size="16" font-weight="700">来源 / 许可</text><text x="155" y="211" fill="#6b6e70" font-size="13">可追溯、可使用</text>
    <text x="375" y="180" fill="#9b6b21" font-size="16" font-weight="700">安全 / 隐私</text><text x="375" y="211" fill="#6b6e70" font-size="13">PII 与恶意内容</text>
    <text x="595" y="180" fill="#247a6b" font-size="16" font-weight="700">完整 / 可读</text><text x="595" y="211" fill="#6b6e70" font-size="13">编码、截断、格式</text>
    <text x="815" y="180" fill="#247a6b" font-size="16" font-weight="700">重复 / 污染</text><text x="815" y="211" fill="#6b6e70" font-size="13">exact、near、benchmark</text>
    <text x="1040" y="180" fill="#247a6b" font-size="16" font-weight="700">目标相关</text><text x="1040" y="211" fill="#6b6e70" font-size="13">进入对应 bucket</text>
    <path d="M252 201 H272 M472 201 H492 M692 201 H712 M912 201 H932" stroke="#247a6b" stroke-width="2"/><text x="262" y="184" fill="#247a6b" font-size="20">→</text><text x="482" y="184" fill="#247a6b" font-size="20">→</text><text x="702" y="184" fill="#247a6b" font-size="20">→</text><text x="922" y="184" fill="#247a6b" font-size="20">→</text>
  </g>
  <text x="600" y="305" text-anchor="middle" fill="#6b6e70" font-family="Arial, sans-serif" font-size="14">不通过的样本进入 quarantine，保留原因与版本，不要静默删除</text>
</svg>
