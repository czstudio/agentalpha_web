<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">数据配比消融矩阵</title>
  <desc id="desc">固定总训练预算，只改变一个数据桶权重，比较目标能力、通用回归、风险和成本。</desc>
  <rect width="1200" height="360" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">用固定预算做 mixture ablation</text>
  <text x="58" y="88" fill="#6b6e70" font-family="Arial, sans-serif" font-size="16">只改一个权重，才知道边际收益来自哪一桶数据</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="130" width="1060" height="150" rx="14" fill="#ffffff" stroke="#dfe4df"/>
    <g fill="#247a6b" font-size="15" font-weight="700"><text x="120" y="165">实验</text><text x="300" y="165">总 token</text><text x="470" y="165">代码通过率</text><text x="660" y="165">数学准确率</text><text x="850" y="165">通用回归</text><text x="1010" y="165">GPU 时长</text></g>
    <line x1="90" y1="180" x2="1110" y2="180" stroke="#dfe4df"/>
    <g fill="#1d1d1f" font-size="14"><text x="120" y="210">baseline</text><text x="300" y="210">2B</text><text x="490" y="210">72%</text><text x="680" y="210">61%</text><text x="870" y="210">-0.4</text><text x="1030" y="210">1.0×</text><text x="120" y="245">code +10%</text><text x="300" y="245">2B</text><text x="490" y="245">78%</text><text x="680" y="245">60%</text><text x="870" y="245">-0.8</text><text x="1030" y="245">1.0×</text></g>
    <rect x="90" y="219" width="1020" height="38" rx="8" fill="#fff5e8" opacity=".65"/>
    <text x="600" y="320" text-anchor="middle" fill="#9b6b21" font-size="14">接受变化要看能力增益、回归底线、污染风险和成本，而不是只看一个冠军指标</text>
  </g>
</svg>
