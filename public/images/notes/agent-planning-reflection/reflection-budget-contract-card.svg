<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Reflection 预算契约</title>
  <desc id="desc">触发原因、预算、可变假设和计划差异共同限制反思循环。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F4EE"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#193C3A">Reflection 要有预算和变化契约</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#58706D">再想一次不等于完成修复，计划必须出现可验证差异</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="206" height="126" rx="18" fill="#EAF3F7"/><text x="157" y="172" font-size="19" font-weight="700" fill="#275261">触发</text><text x="157" y="207" font-size="15" fill="#52727A">timeout / conflict</text><text x="157" y="233" font-size="15" fill="#52727A">new evidence</text>
    <rect x="278" y="132" width="206" height="126" rx="18" fill="#FFF0D6"/><text x="381" y="172" font-size="19" font-weight="700" fill="#875B26">诊断</text><text x="381" y="207" font-size="15" fill="#6C5632">reads trace</text><text x="381" y="233" font-size="15" fill="#6C5632">side effects = 0</text>
    <rect x="502" y="132" width="206" height="126" rx="18" fill="#E5F0ED"/><text x="605" y="172" font-size="19" font-weight="700" fill="#1C615A">重规划</text><text x="605" y="207" font-size="15" fill="#31514E">allowed changes</text><text x="605" y="233" font-size="15" fill="#31514E">diff required</text>
    <rect x="726" y="132" width="302" height="126" rx="18" fill="#173F3D"/><text x="877" y="182" font-size="19" font-weight="700" fill="#FFFFFF">停止</text><text x="877" y="218" font-size="15" fill="#D8EBE5">no diff / budget exhausted → escalate</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M260 195h18"/><path d="M484 195h18"/><path d="M708 195h18"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">Reflection 只有在新证据、参数、路由或停止条件发生变化时才算有效</text>
</svg>
