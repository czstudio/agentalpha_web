<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RL 责任分配流程</title>
  <desc id="desc">从轨迹记录到环境事件、反事实比较，再到分层奖励的责任分配流程图。</desc>
  <rect width="1200" height="620" fill="#f7f4ee"/>
  <text x="72" y="74" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17221b">不要把一个 0 平均撒给二十步</text>
  <text x="72" y="108" font-family="Arial, sans-serif" font-size="16" fill="#627066">先记录事实，再估计动作改变了什么，最后才把信号交给训练。</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="180" width="220" height="180" rx="18" fill="#e7f1e8" stroke="#7ca587" stroke-width="2"/>
    <text x="98" y="222" font-size="18" font-weight="700" fill="#285339">1. 轨迹</text>
    <text x="98" y="258" font-size="15" fill="#35443b">state → action</text>
    <text x="98" y="286" font-size="15" fill="#35443b">tool → observation</text>
    <text x="98" y="314" font-size="15" fill="#35443b">终止原因 + 版本</text>
    <rect x="344" y="180" width="220" height="180" rx="18" fill="#f3ead9" stroke="#c39b55" stroke-width="2"/>
    <text x="370" y="222" font-size="18" font-weight="700" fill="#705426">2. 事件归类</text>
    <text x="370" y="258" font-size="15" fill="#53472f">策略错？工具超时？</text>
    <text x="370" y="286" font-size="15" fill="#53472f">环境脏？验收器异常？</text>
    <text x="370" y="314" font-size="15" fill="#53472f">未知就标 unknown</text>
    <rect x="616" y="180" width="220" height="180" rx="18" fill="#e9edf4" stroke="#7f93b0" stroke-width="2"/>
    <text x="642" y="222" font-size="18" font-weight="700" fill="#334b6a">3. 反事实</text>
    <text x="642" y="258" font-size="15" fill="#3e4a5a">保留同一状态</text>
    <text x="642" y="286" font-size="15" fill="#3e4a5a">替换一个动作</text>
    <text x="642" y="314" font-size="15" fill="#3e4a5a">比较最终结果差</text>
    <rect x="888" y="180" width="240" height="180" rx="18" fill="#f2e6e5" stroke="#ba7a73" stroke-width="2"/>
    <text x="914" y="222" font-size="18" font-weight="700" fill="#703e39">4. 分层信号</text>
    <text x="914" y="258" font-size="15" fill="#5c4140">硬约束：拒绝/重试</text>
    <text x="914" y="286" font-size="15" fill="#5c4140">证据层：支持/改变</text>
    <text x="914" y="314" font-size="15" fill="#5c4140">结果层：成功/失败</text>
  </g>
  <g stroke="#51645a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M292 270 H338"/><path d="M564 270 H610"/><path d="M836 270 H882"/>
  </g>
  <g fill="#51645a"><path d="M338 270 l-12 -8 v16z"/><path d="M610 270 l-12 -8 v16z"/><path d="M882 270 l-12 -8 v16z"/></g>
  <rect x="72" y="430" width="1056" height="92" rx="16" fill="#17221b"/>
  <text x="100" y="468" font-family="Arial, sans-serif" font-size="17" fill="#f7f4ee">训练前要能回答：</text>
  <text x="100" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f1c36b">“如果只替换这一步，结果会不会改变？”</text>
</svg>
