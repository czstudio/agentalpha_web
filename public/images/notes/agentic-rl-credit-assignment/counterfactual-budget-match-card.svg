<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">反事实归因预算对齐</title>
  <desc id="desc">原动作和替换动作锁住步数、工具额度、超时与随机种子，再比较 reward 差异。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">反事实归因预算对齐</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">先锁住实验机会，再解释 reward 差异是不是动作本身带来的</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#dcecf4"/>
    <text x="74" y="153" font-size="17" font-weight="700" fill="#173f3d">原动作</text>
    <text x="74" y="181" font-size="13" fill="#365e67">8 steps / 3 tools</text>
    <text x="74" y="208" font-size="13" fill="#365e67">timeout 2400 / seed 17</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#f4e9bd"/>
    <text x="314" y="153" font-size="17" font-weight="700" fill="#5a4b19">替换动作</text>
    <text x="314" y="181" font-size="13" fill="#786726">同状态、同环境</text>
    <text x="314" y="208" font-size="13" fill="#786726">只替换一个候选动作</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#dceadf"/>
    <text x="554" y="153" font-size="17" font-weight="700" fill="#2f6042">budget lock</text>
    <text x="554" y="181" font-size="13" fill="#4e785d">步数、工具、超时、seed</text>
    <text x="554" y="208" font-size="13" fill="#4e785d">不对称就标不可比</text>
    <rect x="772" y="122" width="220" height="126" rx="17" fill="#173f3d"/>
    <text x="794" y="153" font-size="17" font-weight="700" fill="#f7f8f5">comparable</text>
    <text x="794" y="181" font-size="13" fill="#d8e7e1">只保留可信 pairwise signal</text>
    <text x="794" y="208" font-size="13" fill="#d8e7e1">预算不匹配则降权</text>
  </g>
  <path d="M272 185H286M512 185H526M752 185H766" fill="none" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <path d="m280 177 8 8-8 8M520 177l8 8-8 8M760 177l8 8-8 8" fill="none" stroke="#7d9a95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="78" y="322" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#173f3d">没有预算对齐的反事实，reward 差异不具可比性</text>
</svg>
