<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Code Agent 事实追踪</title>
  <desc id="desc">事实、证据、可信度和下一步验证组成可回溯的事实表。</desc>
  <rect width="1200" height="620" fill="#fbfaf7"/>
  <text x="72" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17221b">每个判断都要能回到文件和命令</text>
  <text x="72" y="106" font-family="Arial,sans-serif" font-size="16" fill="#627066">上下文不是摘要比赛，是一张能被复核的事实表。</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="170" width="220" height="270" rx="16" fill="#17221b"/><text x="106" y="218" font-size="19" font-weight="700" fill="#f7f4ee">事实</text><text x="106" y="268" font-size="16" fill="#cbd7ce">分页参数在 resolver</text><text x="106" y="308" font-size="16" fill="#cbd7ce">默认顺序按 created_at</text><text x="106" y="348" font-size="16" fill="#cbd7ce">测试覆盖 3 条</text>
    <rect x="350" y="170" width="220" height="270" rx="16" fill="#e7f1e8" stroke="#7ca587" stroke-width="2"/><text x="384" y="218" font-size="19" font-weight="700" fill="#285339">证据</text><text x="384" y="268" font-size="16" fill="#35443b">src/graphql/resolver.ts</text><text x="384" y="308" font-size="16" fill="#35443b">tests/api/pagination</text><text x="384" y="348" font-size="16" fill="#35443b">命令输出 + commit</text>
    <rect x="628" y="170" width="220" height="270" rx="16" fill="#f3ead9" stroke="#c39b55" stroke-width="2"/><text x="662" y="218" font-size="19" font-weight="700" fill="#705426">可信度</text><text x="662" y="268" font-size="16" fill="#53472f">运行结果：高</text><text x="662" y="308" font-size="16" fill="#53472f">现有测试：高</text><text x="662" y="348" font-size="16" fill="#53472f">旧文档：中/低</text>
    <rect x="906" y="170" width="220" height="270" rx="16" fill="#e9edf4" stroke="#7f93b0" stroke-width="2"/><text x="940" y="218" font-size="19" font-weight="700" fill="#334b6a">下一步</text><text x="940" y="268" font-size="16" fill="#3e4a5a">查调用者</text><text x="940" y="308" font-size="16" fill="#3e4a5a">跑接口测试</text><text x="940" y="348" font-size="16" fill="#3e4a5a">确认工作树</text>
  </g>
  <g stroke="#51645a" stroke-width="3" fill="none"><path d="M292 305 H340"/><path d="M570 305 H618"/><path d="M848 305 H896"/></g><g fill="#51645a"><path d="M340 305 l-12 -8 v16z"/><path d="M618 305 l-12 -8 v16z"/><path d="M896 305 l-12 -8 v16z"/></g>
</svg>
