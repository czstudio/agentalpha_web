<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Code Agent 仓库上下文分层</title>
  <desc id="desc">从任务约束、仓库结构、符号关系、行为证据到相似实现的五层上下文。</desc>
  <rect width="1200" height="640" fill="#f7f4ee"/>
  <text x="72" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17221b">仓库上下文要分层，不要一锅端</text>
  <text x="72" y="106" font-family="Arial,sans-serif" font-size="16" fill="#627066">越靠下越接近“可能相关”，越靠上越接近“必须遵守”。</text>
  <g font-family="Arial,sans-serif">
    <rect x="100" y="160" width="1000" height="70" rx="14" fill="#17221b"/><text x="132" y="204" font-size="19" font-weight="700" fill="#f7f4ee">1 任务与硬约束：目标、禁止项、验收命令</text>
    <rect x="150" y="245" width="900" height="70" rx="14" fill="#e7f1e8" stroke="#7ca587" stroke-width="2"/><text x="182" y="289" font-size="19" font-weight="700" fill="#285339">2 结构：目录、入口、配置、模块边界</text>
    <rect x="200" y="330" width="800" height="70" rx="14" fill="#e9edf4" stroke="#7f93b0" stroke-width="2"/><text x="232" y="374" font-size="19" font-weight="700" fill="#334b6a">3 符号关系：定义、调用者、依赖、测试映射</text>
    <rect x="250" y="415" width="700" height="70" rx="14" fill="#f3ead9" stroke="#c39b55" stroke-width="2"/><text x="282" y="459" font-size="19" font-weight="700" fill="#705426">4 行为证据：日志、失败样例、最近提交</text>
    <rect x="300" y="500" width="600" height="70" rx="14" fill="#f2e6e5" stroke="#ba7a73" stroke-width="2"/><text x="332" y="544" font-size="19" font-weight="700" fill="#703e39">5 相似实现：只用来补缺口</text>
  </g>
</svg>
