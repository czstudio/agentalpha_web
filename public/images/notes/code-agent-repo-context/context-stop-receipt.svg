<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">上下文停止回执</title><desc id="desc">闭合证据、预算、开放问题、排除项和下一步动作组成上下文停止回执</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">上下文停止回执：证据闭合就停</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">把已确认的事实和仍待验证的问题分开交接</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">闭合证据</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">symbol / callers</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">tests / command</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">预算</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">14 files</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">6800 tokens</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">开放问题</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">feature flag</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">needs staging</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">排除项</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">generated API</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">unrelated module</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">交接</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">next action</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">可恢复</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">停止不是放弃，而是把下一步变成可验证动作</text>
</svg>
