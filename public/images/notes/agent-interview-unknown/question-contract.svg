<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">面试题任务合同</title><desc id="desc">模糊问题被拆成目标、约束、动作和验收。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><rect x="140" y="62" width="620" height="282" rx="20" fill="#fff" stroke="#86a59d" stroke-width="3"/><path d="M140 124h620" stroke="#86a59d" stroke-width="2"/><text x="450" y="103" text-anchor="middle" font-size="22" font-weight="700">问题 → 任务合同</text><g text-anchor="middle" font-size="18" font-weight="700"><rect x="180" y="157" width="220" height="54" rx="14" fill="#eaf3f7"/><text x="290" y="191">目标：谁要什么</text><rect x="500" y="157" width="220" height="54" rx="14" fill="#dfeee8"/><text x="610" y="191">约束：不能做什么</text><rect x="180" y="237" width="220" height="54" rx="14" fill="#fff1d9"/><text x="290" y="271">动作：读还是写</text><rect x="500" y="237" width="220" height="54" rx="14" fill="#fae8e1"/><text x="610" y="271">验收：怎样算成</text></g></g></svg>
