<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">陌生 Agent 题目的假设边界验证</title>
  <desc id="desc">用假设、边界和验证三列组织设计题并支持条件变化时局部重算</desc>
  <rect width="1080" height="360" rx="28" fill="#f7f8f5"/>
  <text x="54" y="58" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#173f3d">陌生题三列法：条件变化时，只重算受影响的边界</text>
  <text x="54" y="88" font-family="Inter,Arial,sans-serif" font-size="15" fill="#50706c">假设决定边界，边界决定验证；安全不变量先固定</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="54" y="126" width="290" height="158" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="86" y="166" font-size="19" font-weight="700" fill="#173f3d">假设</text><text x="86" y="202" font-size="15" fill="#315653">用户已登录</text><text x="86" y="228" font-size="15" fill="#315653">订单已支付</text><text x="86" y="254" font-size="14" fill="#50706c">规则按版本生效</text>
    <path d="M360 205h38" stroke="#7eaaa7" stroke-width="3"/><path d="m390 195 12 10-12 10" fill="none" stroke="#7eaaa7" stroke-width="3"/>
    <rect x="416" y="126" width="290" height="158" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="448" y="166" font-size="19" font-weight="700" fill="#173f3d">边界</text><text x="448" y="202" font-size="15" fill="#315653">只读可自动</text><text x="448" y="228" font-size="15" fill="#315653">退款需审批</text><text x="448" y="254" font-size="14" fill="#50706c">未知结果不重试</text>
    <path d="M722 205h38" stroke="#7eaaa7" stroke-width="3"/><path d="m752 195 12 10-12 10" fill="none" stroke="#7eaaa7" stroke-width="3"/>
    <rect x="778" y="126" width="248" height="158" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="810" y="166" font-size="19" font-weight="700" fill="#173f3d">验证</text><text x="810" y="202" font-size="15" fill="#315653">越权 / 重复</text><text x="810" y="228" font-size="15" fill="#315653">旧版本回放</text><text x="810" y="254" font-size="14" fill="#50706c">超时 / 对账演练</text>
  </g>
</svg>
