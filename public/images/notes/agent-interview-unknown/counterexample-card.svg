<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">假设反例测试</title>
  <desc id="desc">改变一条约束后，沿受影响模块局部修正方案</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Counterexample test</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">把关键假设当变量，改一个条件看系统能否局部演进</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">假设</text>
    <text x="147" y="194" font-size="15" fill="#365b61">单租户 / 800ms</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">说清边界</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">反例</text>
    <text x="357" y="194" font-size="15" fill="#365b61">20 租户 / 30 秒</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">只改一条</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">影响模块</text>
    <text x="567" y="194" font-size="15" fill="#365b61">路由 / 缓存 / 超时</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">权限 / 审计</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">局部调整</text>
    <text x="777" y="194" font-size="15" fill="#365b61">异步恢复</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">租户级隔离</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">验证</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">反例通过</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">边界清楚</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：能指出哪条假设改变、哪些模块受影响、哪些安全边界不变</text>
</svg>
