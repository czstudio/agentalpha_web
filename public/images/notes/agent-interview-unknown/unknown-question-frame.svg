<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">陌生题假设清单</title><desc id="desc">未知条件、风险、证据来源和调整触发器组成面试设计题的起点</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">陌生题假设清单</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">先声明未知，再用最小闭环验证，而不是用组件名填空</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">假设</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">租户隔离</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">只生成草稿</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">风险</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">high / critical</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">权限与副作用</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">策略 · 样本</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">审批流程</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">触发器</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">if_false → dry-run</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">最小闭环先行</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">约束变化时局部重算，已验证的安全与状态边界保持不变</text>
</svg>
