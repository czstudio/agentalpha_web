<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Rollout 归因卡</title><desc id="desc">动作、观测、环境状态、策略责任和回放决定组成归因记录</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Rollout 归因卡：先分清策略错还是环境坏</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">不要让服务器 500 变成模型的负样本</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">动作</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">search_docs</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">query / args</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">观测</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">timeout</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">latency 3000ms</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">环境</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">service degraded</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">retryable</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">责任</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">policy_error false</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">infra_error true</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回放</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">keep</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">infra queue</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">环境坏要修环境，策略错才进入负向训练</text>
</svg>
