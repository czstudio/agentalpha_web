<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Rollout 诊断四张表</title><desc id="desc">用动作、环境、责任和奖励四张表定位 Agent 训练问题。</desc><rect width="1200" height="520" rx="28" fill="#fbfbf8"/><text x="70" y="72" font-size="34" font-family="sans-serif" font-weight="700" fill="#273128">训练没提升，先别急着换算法</text><g font-family="sans-serif" text-anchor="middle"><rect x="100" y="155" width="210" height="145" rx="18" fill="#e3efff"/><text x="205" y="205" font-size="24" fill="#203a59">动作表</text><text x="205" y="245" font-size="18" fill="#43617f">模型做了什么</text><rect x="355" y="155" width="210" height="145" rx="18" fill="#e4f5ea"/><text x="460" y="205" font-size="24" fill="#244f35">环境表</text><text x="460" y="245" font-size="18" fill="#47705a">工具返回什么</text><rect x="610" y="155" width="210" height="145" rx="18" fill="#fff0d7"/><text x="715" y="205" font-size="24" fill="#6d4a1d">责任表</text><text x="715" y="245" font-size="18" fill="#806237">换动作会怎样</text><rect x="865" y="155" width="210" height="145" rx="18" fill="#f8e1ea"/><text x="970" y="205" font-size="24" fill="#673044">奖励表</text><text x="970" y="245" font-size="18" fill="#855267">分数来自哪里</text><path d="M205 330v65h765v-65" fill="none" stroke="#6b7785" stroke-width="4" marker-end="url(#a)"/><text x="600" y="455" font-size="23" fill="#273128">四张表对齐，才知道坏在策略、环境还是验收器</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#6b7785"/></marker></defs></svg>
