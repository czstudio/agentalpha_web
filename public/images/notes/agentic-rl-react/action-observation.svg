<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Action 与 Observation 的边界</title><desc id="desc">模型生成的动作参与损失，工具和环境返回的观察不参与策略损失。</desc><rect width="1200" height="500" rx="28" fill="#fffaf4"/><text x="65" y="70" font-size="32" font-family="sans-serif" font-weight="700" fill="#352817">训练数据里，谁该对哪句话负责？</text><g font-family="sans-serif"><rect x="75" y="140" width="480" height="250" rx="20" fill="#e2f1ff"/><text x="110" y="185" font-size="24" font-weight="700" fill="#12304d">ACTION · policy token</text><text x="110" y="235" font-size="20" fill="#244d70">调用 search</text><text x="110" y="275" font-size="20" fill="#244d70">query = Agentic RL credit assignment</text><text x="110" y="315" font-size="20" fill="#244d70">停止 / 继续 / 修改参数</text><text x="110" y="365" font-size="18" fill="#147a50">loss_mask = 1</text><rect x="645" y="140" width="480" height="250" rx="20" fill="#e6f7ed"/><text x="680" y="185" font-size="24" font-weight="700" fill="#173d2c">OBSERVATION · environment</text><text x="680" y="235" font-size="20" fill="#285e45">搜索结果、文件内容</text><text x="680" y="275" font-size="20" fill="#285e45">测试日志、traceback、网页 DOM</text><text x="680" y="315" font-size="20" fill="#285e45">工具超时与服务状态</text><text x="680" y="365" font-size="18" fill="#147a50">loss_mask = 0</text></g><path d="M555 265h90" stroke="#6b86a3" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#6b86a3"/></marker></defs></svg>
