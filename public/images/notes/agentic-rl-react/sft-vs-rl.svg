<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">SFT 与 Agentic RL 分工</title><desc id="desc">SFT 学习已有成功轨迹，Agentic RL 优化新状态下的连续决策。</desc><rect width="1200" height="470" rx="28" fill="#f8faff"/><text x="70" y="70" font-size="34" font-family="sans-serif" font-weight="700" fill="#1f2b44">先把路走像，再学会在岔路口判断</text><g font-family="sans-serif"><rect x="90" y="135" width="450" height="220" rx="20" fill="#dcecff"/><text x="315" y="185" text-anchor="middle" font-size="27" font-weight="700" fill="#173f65">SFT</text><text x="315" y="235" text-anchor="middle" font-size="21" fill="#335f83">模仿高质量成功轨迹</text><text x="315" y="275" text-anchor="middle" font-size="19" fill="#335f83">工具格式、基本步骤、输出习惯</text><text x="315" y="315" text-anchor="middle" font-size="19" fill="#335f83">解决“不会走”的问题</text><rect x="660" y="135" width="450" height="220" rx="20" fill="#e5f5e8"/><text x="885" y="185" text-anchor="middle" font-size="27" font-weight="700" fill="#1e5435">Agentic RL</text><text x="885" y="235" text-anchor="middle" font-size="21" fill="#397152">从环境反馈优化动作</text><text x="885" y="275" text-anchor="middle" font-size="19" fill="#397152">探索、停止、回滚、成本权衡</text><text x="885" y="315" text-anchor="middle" font-size="19" fill="#397152">解决“岔路口怎么选”的问题</text></g><path d="M540 245h120" stroke="#68778b" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#68778b"/></marker></defs></svg>
