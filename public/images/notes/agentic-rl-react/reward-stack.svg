<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Agentic RL 分层奖励</title><desc id="desc">任务结果、约束、过程信号、成本和故障归因构成分层奖励。</desc><rect width="1200" height="560" rx="28" fill="#f7f8fc"/><text x="70" y="70" font-size="34" font-family="sans-serif" font-weight="700" fill="#20283a">不要把所有失败都压成一个 0</text><g font-family="sans-serif"><rect x="160" y="120" width="880" height="70" rx="14" fill="#ffd8d8"/><text x="600" y="165" text-anchor="middle" font-size="24" fill="#5c1d27">任务级结果：目标是否真正完成</text><rect x="210" y="215" width="780" height="70" rx="14" fill="#ffe7c1"/><text x="600" y="260" text-anchor="middle" font-size="23" fill="#6b4316">约束层：权限、格式、预算是否满足</text><rect x="260" y="310" width="680" height="70" rx="14" fill="#d9edff"/><text x="600" y="355" text-anchor="middle" font-size="23" fill="#214b71">过程层：测试、引用、参数等可验证事实</text><rect x="310" y="405" width="580" height="70" rx="14" fill="#dff3e7"/><text x="600" y="450" text-anchor="middle" font-size="23" fill="#24573d">成本与故障：调用次数、时延、环境错误</text></g></svg>
