<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">是否值得上 Agentic RL 的判断矩阵</title><desc id="desc">用可验证性、环境稳定性、SFT 瓶颈和采样收益判断是否启动 Agentic RL。</desc><rect width="1200" height="520" rx="28" fill="#fffdf8"/><text x="70" y="70" font-size="34" font-family="sans-serif" font-weight="700" fill="#312a1e">不是所有 Agent 都值得直接上 RL</text><g font-family="sans-serif"><text x="105" y="135" font-size="20" font-weight="700" fill="#5a4b32">先问四个问题</text><text x="105" y="185" font-size="21" fill="#514936">① 成功能稳定验证吗？</text><text x="105" y="230" font-size="21" fill="#514936">② 环境能稳定重置和回放吗？</text><text x="105" y="275" font-size="21" fill="#514936">③ SFT 与提示词是否已经到瓶颈？</text><text x="105" y="320" font-size="21" fill="#514936">④ 收益是否覆盖 rollout 成本？</text><rect x="720" y="130" width="360" height="230" rx="20" fill="#e5f5e8"/><text x="900" y="185" text-anchor="middle" font-size="27" font-weight="700" fill="#1d5234">四项大多为“是”</text><text x="900" y="235" text-anchor="middle" font-size="21" fill="#326a4a">先做小规模 RL 实验</text><text x="900" y="280" text-anchor="middle" font-size="19" fill="#326a4a">训练外评测 + 成本 + 安全</text><rect x="720" y="390" width="360" height="70" rx="14" fill="#ffe7c7"/><text x="900" y="435" text-anchor="middle" font-size="20" fill="#704b1d">否则先修环境、评测和 SFT</text></g></svg>
