<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RL rollout 预算卡</title><desc id="desc">Rollout 记录探索收益、工具成本、停止原因和副作用边界</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Rollout 预算卡：探索不能越过副作用边界</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">每一步都记录成本、证据增益和为什么停</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">预算</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">steps / tools</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">vision tokens</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">探索</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">evidence gain</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">marginal value</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">停止</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">budget / threshold</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">environment error</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">副作用</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">write_actions = 0</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">dry-run</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">学习</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">完整回执</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">才入池</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">没有环境版本和停止原因的 rollout，不应该进入策略更新</text>
</svg>
