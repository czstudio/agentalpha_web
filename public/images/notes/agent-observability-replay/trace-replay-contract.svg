<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">可观测性回放契约</title>
  <desc id="desc">字段分类经过脱敏、回放来源、保留期限后进入审计。</desc>
  <rect width="1080" height="390" rx="24" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Trace 回放：脱敏也要成为一份契约</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5d7271">最小可用 trace 不是保存全部原文，而是保存完整的因果链。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#173f3d">
    <rect x="52" y="122" width="178" height="122" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="98" y="171">字段分类</text><text x="91" y="202" font-size="14" font-weight="500">PII / sensitive / audit</text>
    <rect x="250" y="122" width="178" height="122" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="309" y="171">动作</text><text x="283" y="202" font-size="14" font-weight="500">redact / hash / keep</text>
    <rect x="448" y="122" width="178" height="122" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="507" y="171">回放源</text><text x="480" y="202" font-size="14" font-weight="500">synthetic / fixture</text>
    <rect x="646" y="122" width="178" height="122" rx="18" fill="#f5d9dc" stroke="#dfb2b9"/><text x="704" y="171">保留</text><text x="677" y="202" font-size="14" font-weight="500">hot / cold / ttl</text>
    <rect x="844" y="122" width="184" height="122" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="903" y="171">审计</text><text x="875" y="202" font-size="14" font-weight="500">policy + diff</text>
  </g>
  <g stroke="#6d8989" stroke-width="3" fill="none"><path d="M230 183h20"/><path d="M428 183h20"/><path d="M626 183h20"/><path d="M824 183h20"/></g>
  <rect x="52" y="294" width="976" height="48" rx="14" fill="#173f3d"/>
  <text x="299" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#e7f4ef">最小可用 trace 是完整因果，而不是完整原文</text>
</svg>
