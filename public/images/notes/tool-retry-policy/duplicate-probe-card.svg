<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">重复提交探针</title>
  <desc id="desc">同一幂等键重放后只保留一个业务效果</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">Duplicate probe</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">对账成功后，验证重试入口不会制造第二次效果</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="164" font-size="18" font-weight="700" fill="#173f3d">同一 key</text>
    <text x="147" y="194" font-size="15" fill="#365b61">refund-order-8848</text>
    <text x="147" y="220" font-size="13" fill="#5b7470">隔离测试租户</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="164" font-size="18" font-weight="700" fill="#173f3d">第一次</text>
    <text x="357" y="194" font-size="15" fill="#365b61">COMMITTED</text>
    <text x="357" y="220" font-size="13" fill="#5b7470">业务账本 +1</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="164" font-size="18" font-weight="700" fill="#173f3d">第二次</text>
    <text x="567" y="194" font-size="15" fill="#365b61">IDEMPOTENT</text>
    <text x="567" y="220" font-size="13" fill="#5b7470">不新增效果</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="164" font-size="18" font-weight="700" fill="#173f3d">审计链</text>
    <text x="777" y="194" font-size="15" fill="#365b61">one_effect</text>
    <text x="777" y="220" font-size="13" fill="#5b7470">供应商去重</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="164" font-size="18" font-weight="700" fill="#ffffff">安全</text>
    <text x="960" y="194" font-size="15" fill="#e6f1ee">可恢复</text>
    <text x="960" y="220" font-size="13" fill="#b9d3df">关闭盲重放</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round">
    <path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/>
  </g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">验收：同一幂等键、同一业务单号、下游审计只出现一个效果</text>
</svg>
