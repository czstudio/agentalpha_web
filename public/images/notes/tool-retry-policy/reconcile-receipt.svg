<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">UNKNOWN 对账回执</title>
  <desc id="desc">外部状态、查询回执、本地状态、禁止动作和下一步组成 UNKNOWN 对账回执。</desc>
  <rect width="1080" height="390" rx="24" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">UNKNOWN：先对账，再决定下一步</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5d7271">发送后超时不能盲重放，外部状态和禁止动作都要进入回执。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#173f3d">
    <rect x="52" y="122" width="178" height="122" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="103" y="171">观察</text><text x="91" y="202" font-size="14" font-weight="500">sent / timeout</text>
    <rect x="250" y="122" width="178" height="122" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="309" y="171">查询</text><text x="283" y="202" font-size="14" font-weight="500">provider status</text>
    <rect x="448" y="122" width="178" height="122" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="507" y="171">本地</text><text x="480" y="202" font-size="14" font-weight="500">UNKNOWN state</text>
    <rect x="646" y="122" width="178" height="122" rx="18" fill="#f5d9dc" stroke="#dfb2b9"/><text x="704" y="171">禁止</text><text x="677" y="202" font-size="14" font-weight="500">blind replay</text>
    <rect x="844" y="122" width="184" height="122" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="903" y="171">下一步</text><text x="875" y="202" font-size="14" font-weight="500">callback / human</text>
  </g>
  <g stroke="#6d8989" stroke-width="3" fill="none"><path d="M230 183h20"/><path d="M428 183h20"/><path d="M626 183h20"/><path d="M824 183h20"/></g>
  <rect x="52" y="294" width="976" height="48" rx="14" fill="#173f3d"/>
  <text x="361" y="325" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17" fill="#e7f4ef">未知状态不是失败，是需要对账的事实</text>
</svg>
