<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">重试阶段策略</title><desc id="desc">发送前、发送中、回执后、硬停止和恢复动作组成重试阶段策略</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">重试策略：先判断副作用发生到哪一步</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">同一个 timeout，可能对应两种完全不同的风险</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">发送前</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">not sent</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">retry budget</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">发送中</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">request_id?</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">query status</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">未知</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">no blind replay</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">reconcile</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">回执后</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">local commit</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">resume safely</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">停止</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">permission</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">scope mismatch</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">异常只提供线索，发送阶段和副作用证据才决定动作</text>
</svg>
