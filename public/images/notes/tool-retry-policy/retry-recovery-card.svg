<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">重试恢复决策卡</title><desc id="desc">错误阶段、未知副作用、预算、对账和禁止动作固定恢复策略</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">重试恢复决策卡</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">先判断发送阶段与副作用，再决定重试、对账或停下</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">错误</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">timeout_after_send</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">phase: sent</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">副作用</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">unknown</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">幂等键保留</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">预算</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">1 / 3</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">总时限</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">动作</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">reconcile_first</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">query status</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">禁止</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">blind replay</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">转人工</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">把恢复决策写进状态机，用户文案和审计日志才能保持一致</text>
</svg>
