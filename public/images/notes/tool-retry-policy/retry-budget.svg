<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">重试预算分层</title>
  <desc id="desc">重试预算需要同时受任务总预算、单工具预算和未知结果预算约束。</desc>
  <rect width="900" height="360" rx="28" fill="#f7f8f5"/>
  <g font-family="sans-serif">
    <rect x="70" y="54" width="760" height="248" rx="24" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="110" y="94" font-size="21" font-weight="700" fill="#24556a">任务级预算</text><text x="110" y="121" font-size="14" fill="#5a737d">总耗时、总成本、最大尝试次数</text>
    <rect x="120" y="145" width="660" height="112" rx="20" fill="#fff1d9" stroke="#e8c891"/>
    <text x="160" y="184" font-size="20" font-weight="700" fill="#704c20">工具级预算</text><text x="160" y="211" font-size="14" fill="#856a42">每个工具的退避、并发和失败阈值</text>
    <rect x="177" y="228" width="546" height="38" rx="15" fill="#173f3d"/>
    <text x="450" y="253" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">未知结果预算：对账完成前不重复产生副作用</text>
  </g>
</svg>
