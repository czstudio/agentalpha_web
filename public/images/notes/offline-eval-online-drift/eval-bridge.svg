<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">离线到线上评测桥</title><desc id="desc">黄金集、回放、影子流量和灰度组成评测桥。</desc><rect width="900" height="390" rx="28" fill="#f7f8f5"/><g font-family="sans-serif"><path d="M80 300 190 138 300 300M300 300 410 138 520 300M520 300 630 138 740 300" fill="none" stroke="#24556a" stroke-width="24" stroke-linejoin="round"/><rect x="70" y="62" width="170" height="64" rx="15" fill="#dfeee8"/><text x="155" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">离线黄金集</text><text x="155" y="113" text-anchor="middle" font-size="13" fill="#52706b">固定任务与真值</text><rect x="285" y="62" width="170" height="64" rx="15" fill="#eaf3f7"/><text x="370" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#24556a">轨迹回放</text><text x="370" y="113" text-anchor="middle" font-size="13" fill="#5a737d">复现失败</text><rect x="500" y="62" width="170" height="64" rx="15" fill="#fff1d9"/><text x="585" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#704c20">影子流量</text><text x="585" y="113" text-anchor="middle" font-size="13" fill="#856a42">真实分布无副作用</text><rect x="715" y="62" width="130" height="64" rx="15" fill="#fae8e1"/><text x="780" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#753f32">灰度</text><text x="780" y="113" text-anchor="middle" font-size="13" fill="#845a50">受限执行</text><text x="450" y="350" text-anchor="middle" font-size="14" fill="#68706c">线上失败 → 脱敏聚类 → 回归集</text></g></svg>
