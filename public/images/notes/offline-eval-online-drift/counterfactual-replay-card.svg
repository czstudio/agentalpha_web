<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">反事实回放</title><desc id="desc">线上失败 trace 通过单变量替换确认漂移修复的真正来源</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">反事实回放：指标恢复，真的是修对了吗？</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">同一批线上失败，只替换一个版本变量</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">失败 trace</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">42 条原样本</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">保留现场世界</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">模型替换</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">r38 → r39</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">其他不变</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">索引替换</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">r16 → r17</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">单变量对照</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">结果</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">通过率 0.91</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">未解释 2 条</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">决定</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">观察</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">不静音</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">恢复是结果，单变量对照才是归因证据</text>
</svg>
