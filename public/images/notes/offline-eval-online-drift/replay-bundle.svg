<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">可回放样本包</title><desc id="desc">回放需要输入、状态、版本、工具和副作用。</desc><rect width="900" height="350" rx="28" fill="#f7f8f5"/><g font-family="sans-serif"><rect x="65" y="75" width="770" height="210" rx="20" fill="#fff" stroke="#d4ddd9" stroke-width="2"/><rect x="95" y="108" width="150" height="64" rx="13" fill="#eaf3f7"/><text x="170" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#24556a">Input</text><text x="170" y="158" text-anchor="middle" font-size="13" fill="#5a737d">问题 + 历史</text><rect x="270" y="108" width="150" height="64" rx="13" fill="#dfeee8"/><text x="345" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#173f3d">State</text><text x="345" y="158" text-anchor="middle" font-size="13" fill="#52706b">权限 + 快照</text><rect x="445" y="108" width="150" height="64" rx="13" fill="#fff1d9"/><text x="520" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#704c20">Versions</text><text x="520" y="158" text-anchor="middle" font-size="13" fill="#856a42">模型 · Prompt · KB</text><rect x="620" y="108" width="150" height="64" rx="13" fill="#fae8e1"/><text x="695" y="137" text-anchor="middle" font-size="16" font-weight="700" fill="#753f32">Tools</text><text x="695" y="158" text-anchor="middle" font-size="13" fill="#845a50">schema + 返回</text><path d="M170 226h525" stroke="#24556a" stroke-width="3" stroke-dasharray="8 8"/><text x="450" y="258" text-anchor="middle" font-size="15" fill="#68706c">副作用记录：已提交 / 未知 / 已回滚</text></g></svg>
