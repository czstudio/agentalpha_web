<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">漂移告警关单卡</title><desc id="desc">漂移告警经过版本对照、反事实回放和交接后才能关闭</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">漂移告警关单卡：红灯不是一句“恢复了”</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">每一步都要留下可复核的差异和未解释样本</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">告警</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">线上差距</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">冻结灰度</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">对照</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">model / index</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">tool / policy</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">反事实</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">单变量回放</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">24 traces</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">回归</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">22 passed</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">2 unresolved</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">关单</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">owner</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">复查日</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">指标恢复只是信号，反事实和交接才是关单证据</text>
</svg>
