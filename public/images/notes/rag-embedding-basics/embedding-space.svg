<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Embedding 把查询与文档映射到语义空间</title>
  <desc id="desc">左侧是查询向量，右侧是文档向量、关键词和元数据过滤，展示向量相似度只是候选证据的一部分。</desc>
  <rect width="1200" height="520" rx="28" fill="#f7f8f5"/>
  <text x="62" y="68" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="27" font-weight="700">向量空间只回答：哪些片段“可能相关”？</text>
  <text x="62" y="102" fill="#6b6e70" font-family="Arial, sans-serif" font-size="17">相似度召回候选，事实、权限、版本仍要在检索链路里单独判断</text>
  <line x1="90" y1="410" x2="650" y2="410" stroke="#b8c0bc" stroke-width="2"/>
  <line x1="125" y1="445" x2="125" y2="155" stroke="#b8c0bc" stroke-width="2"/>
  <text x="610" y="448" fill="#8a918e" font-family="Arial, sans-serif" font-size="15">语义维度 1</text>
  <text x="77" y="171" fill="#8a918e" font-family="Arial, sans-serif" font-size="15" transform="rotate(-90 77 171)">语义维度 2</text>
  <circle cx="318" cy="260" r="14" fill="#247a6b"/>
  <text x="290" y="232" fill="#247a6b" font-family="Arial, sans-serif" font-size="16" font-weight="700">query</text>
  <line x1="318" y1="260" x2="408" y2="234" stroke="#247a6b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="318" y1="260" x2="474" y2="322" stroke="#d2a545" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="318" y1="260" x2="566" y2="196" stroke="#b7bcb8" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="408" cy="234" r="11" fill="#d2a545"/>
  <text x="425" y="226" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="15">登录失败处理（近）</text>
  <circle cx="474" cy="322" r="11" fill="#b7bcb8"/>
  <text x="490" y="327" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="15">旧版本说明（像，但过期）</text>
  <circle cx="566" cy="196" r="11" fill="#b7bcb8"/>
  <text x="583" y="201" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="15">相似词汇（无答案）</text>
  <rect x="720" y="155" width="410" height="255" rx="18" fill="#ffffff" stroke="#dfe4df"/>
  <text x="754" y="197" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="19" font-weight="700">进入上下文前的三道闸门</text>
  <circle cx="764" cy="244" r="8" fill="#247a6b"/>
  <text x="786" y="250" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="16">相似度：候选是否相关</text>
  <circle cx="764" cy="294" r="8" fill="#d2a545"/>
  <text x="786" y="300" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="16">关键词：错误码、版本号</text>
  <circle cx="764" cy="344" r="8" fill="#3f6f9f"/>
  <text x="786" y="350" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="16">元数据：租户、权限、有效期</text>
  <text x="754" y="389" fill="#6b6e70" font-family="Arial, sans-serif" font-size="14">Embedding 是入口，不是裁判</text>
</svg>
