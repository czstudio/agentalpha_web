<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Embedding 编码一致性探针</title>
  <desc id="desc">检查查询与索引两侧的模型、维度、归一化、距离和租户过滤是否一致。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="54" font-size="25" font-weight="700" fill="#173f3d">换 Embedding：先做编码一致性探针</text>
  <text x="52" y="84" font-size="16" fill="#5b7470">向量分数可变，编码契约和安全边界不能悄悄变</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/>
    <text x="147" y="167" font-size="18" font-weight="700" fill="#275261">锁定编码</text><text x="147" y="199" font-size="15" fill="#52727a">模型 / 维度 / 范数</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/>
    <text x="357" y="167" font-size="18" font-weight="700" fill="#6e5223">双跑查询</text><text x="357" y="199" font-size="15" fill="#806a3d">旧索引 / 新索引</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/>
    <text x="567" y="167" font-size="18" font-weight="700" fill="#2b6353">切片对照</text><text x="567" y="199" font-size="15" fill="#53786b">错误码 / 版本 / 多跳</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/>
    <text x="777" y="167" font-size="18" font-weight="700" fill="#78454d">阻断混用</text><text x="777" y="199" font-size="15" fill="#855c63">过滤 / 引用也验</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/>
    <text x="960" y="175" font-size="18" font-weight="700" fill="#ffffff">可切流</text><text x="960" y="207" font-size="15" fill="#d8ebe5">有证据</text>
  </g>
  <g fill="none" stroke="#7d9a95" stroke-width="2.5" stroke-linecap="round"><path d="M242 185h20"/><path d="M452 185h20"/><path d="M662 185h20"/><path d="M872 185h20"/></g>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/>
  <text x="76" y="322" font-size="15" fill="#365b61">换模型不是只看相似度，还要确认权限过滤和引用定位没有回归</text>
</svg>
