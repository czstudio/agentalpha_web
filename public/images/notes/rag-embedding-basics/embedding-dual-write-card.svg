<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Embedding 双写迁移</title>
  <desc id="desc">锁定编码契约，双跑切片，对照引用后再灰度切流。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F8F5"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#173F3D">换 Embedding：双写、双跑、再切流</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#5B7470">不要让 v1 文档向量和 v2 查询向量悄悄混用</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="214" height="126" rx="18" fill="#EAF3F7"/><text x="161" y="172" font-size="19" font-weight="700" fill="#275261">锁定契约</text><text x="161" y="207" font-size="15" fill="#52727A">model / dim / norm</text><text x="161" y="233" font-size="15" fill="#52727A">content hash</text>
    <rect x="292" y="132" width="214" height="126" rx="18" fill="#E5F0ED"/><text x="399" y="172" font-size="19" font-weight="700" fill="#1C615A">双写索引</text><text x="399" y="207" font-size="15" fill="#31514E">v1 + v2</text><text x="399" y="233" font-size="15" fill="#31514E">same snapshot</text>
    <rect x="530" y="132" width="214" height="126" rx="18" fill="#FFF0D6"/><text x="637" y="172" font-size="19" font-weight="700" fill="#875B26">切片双跑</text><text x="637" y="207" font-size="15" fill="#6C5632">error / version / ACL</text><text x="637" y="233" font-size="15" fill="#6C5632">citation replay</text>
    <rect x="768" y="132" width="260" height="126" rx="18" fill="#173F3D"/><text x="898" y="182" font-size="19" font-weight="700" fill="#FFFFFF">灰度</text><text x="898" y="218" font-size="15" fill="#D8EBE5">可回滚切流</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M268 195h24"/><path d="M506 195h24"/><path d="M744 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">平均 Recall 只是门槛，引用、权限和 hard negative 通过后才有资格切换</text>
</svg>
