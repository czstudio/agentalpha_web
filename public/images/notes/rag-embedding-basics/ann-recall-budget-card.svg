<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">ANN 召回预算</title><desc id="desc">向量、索引、量化、分片回归流程</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">向量相同，ANN 索引也可能给出不同答案</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">把 Recall@k 当成预算：索引、量化和分片都要分配误差</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">向量</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">model + normalize</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">gold neighbors</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">索引</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">HNSW / IVF</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">ef / nprobe</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">压缩</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">PQ / int8</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">distance error</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回归</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">slice recall</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">ACL / error code</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">平均召回率只是起点，真正要守住的是关键切片的最小召回</text>
</svg>
