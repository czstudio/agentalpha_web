<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 交接边界探针</title><desc id="desc">完整交接包、删除版本、删除禁止动作、篡改租户和拒绝路由组成交接边界探针</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">交接边界：关键字段丢了就要停</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">送达消息，不等于送达了约束</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">完整交接</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">tenant / trace</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">version / acceptance</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">删版本</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">missing evidence</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">reject</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">删禁止动作</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">policy review</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">no default allow</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">篡改租户</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">scope mismatch</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">block</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回执</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">reason</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">route</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">下游缺少边界字段时，拒绝比猜测更安全</text>
</svg>
