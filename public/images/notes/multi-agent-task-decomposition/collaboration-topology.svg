<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 协作拓扑</title>
  <desc id="desc">协调器把可并行的研究与计算任务分发给角色，再将结构化产物交给合并、写作和审核。</desc>
  <rect width="900" height="350" rx="28" fill="#f7f8f5"/>
  <g stroke="#9bbab1" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M450 72v52M450 152v52M450 232v44"/>
    <path d="M380 126H190M520 126h190"/>
    <path d="M190 126v52M710 126v52"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="355" y="28" width="190" height="54" rx="15" fill="#d7e9e2"/>
    <text x="450" y="62" font-size="18" font-weight="700" fill="#173f3d">协调器</text>
    <rect x="92" y="98" width="196" height="58" rx="15" fill="#eaf3f7"/>
    <text x="190" y="133" font-size="17" font-weight="700" fill="#24556a">研究 Agent A</text>
    <rect x="612" y="98" width="196" height="58" rx="15" fill="#fff1d9"/>
    <text x="710" y="133" font-size="17" font-weight="700" fill="#704c20">计算 Agent B</text>
    <rect x="355" y="120" width="190" height="62" rx="15" fill="#f0eee8"/>
    <text x="450" y="157" font-size="17" font-weight="700" fill="#4b514e">结构化合并</text>
    <rect x="355" y="198" width="190" height="54" rx="15" fill="#dfeee8"/>
    <text x="450" y="232" font-size="17" font-weight="700" fill="#173f3d">写作 Agent</text>
    <rect x="355" y="278" width="190" height="46" rx="14" fill="#fae8e1"/>
    <text x="450" y="307" font-size="16" font-weight="700" fill="#753f32">审核闸门</text>
  </g>
</svg>
