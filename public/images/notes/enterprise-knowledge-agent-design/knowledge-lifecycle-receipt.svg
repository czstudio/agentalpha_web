<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">知识文档删除生命周期回执</title><desc id="desc">墓碑、索引、缓存、探针和审计组成知识文档删除流程</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">知识文档删除生命周期回执</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">删除意图先传播，物理清理再收尾</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="178" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="141" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">墓碑</text><text x="141" y="191" text-anchor="middle" font-size="13" fill="#48635f">文档 + 版本</text><text x="141" y="215" text-anchor="middle" font-size="13" fill="#48635f">删除原因</text>
    <rect x="250" y="122" width="178" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="339" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">索引</text><text x="339" y="191" text-anchor="middle" font-size="13" fill="#48635f">chunks + vectors</text><text x="339" y="215" text-anchor="middle" font-size="13" fill="#48635f">generation</text>
    <rect x="448" y="122" width="178" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="537" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">缓存</text><text x="537" y="191" text-anchor="middle" font-size="13" fill="#48635f">answer keys</text><text x="537" y="215" text-anchor="middle" font-size="13" fill="#48635f">失效与回收</text>
    <rect x="646" y="122" width="178" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="735" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">探针</text><text x="735" y="191" text-anchor="middle" font-size="13" fill="#48635f">ID 检索</text><text x="735" y="215" text-anchor="middle" font-size="13" fill="#48635f">问题 + 引用</text>
    <rect x="844" y="122" width="184" height="126" rx="17" fill="#173f3d"/><text x="936" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回执</text><text x="936" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">audit_event</text><text x="936" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">通过 / 告警</text>
  </g>
  <path d="M230 185h20M428 185h20M626 185h20M824 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">验证“找不到”比报告“删完了”更重要</text>
</svg>
