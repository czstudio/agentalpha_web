<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">知识 Agent 评测矩阵</title><desc id="desc">召回、权限、证据和新鲜度四个维度共同决定质量。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><path d="M130 330V72M130 330h650" stroke="#24556a" stroke-width="3"/><text x="455" y="382" text-anchor="middle" font-size="17">证据新鲜度 →</text><text x="44" y="210" transform="rotate(-90 44 210)" text-anchor="middle" font-size="17">可用质量 →</text><circle cx="300" cy="260" r="44" fill="#fff1d9" stroke="#c69a58" stroke-width="3"/><text x="300" y="256" text-anchor="middle" font-size="16" font-weight="700">召回</text><text x="300" y="278" text-anchor="middle" font-size="13">找得到</text><circle cx="470" cy="190" r="44" fill="#dfeee8" stroke="#86a59d" stroke-width="3"/><text x="470" y="186" text-anchor="middle" font-size="16" font-weight="700">权限</text><text x="470" y="208" text-anchor="middle" font-size="13">看得对</text><circle cx="630" cy="132" r="44" fill="#eaf3f7" stroke="#24556a" stroke-width="3"/><text x="630" y="128" text-anchor="middle" font-size="16" font-weight="700">证据</text><text x="630" y="150" text-anchor="middle" font-size="13">说得清</text><circle cx="730" cy="90" r="28" fill="#173f3d"/><text x="730" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">上线</text><path d="M300 260 470 190 630 132 702 100" fill="none" stroke="#86a59d" stroke-width="4" stroke-dasharray="8 8"/></g></svg>
