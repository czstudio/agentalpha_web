<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">知识更新版本对照</title><desc id="desc">旧版本、候选版本、回答引用、缓存代次和回滚组成知识更新版本对照</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">知识更新：新旧版本要并排验收</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">新文档入库，不等于旧答案已经消失</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">旧版本</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">v11</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">should be zero hit</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">候选版本</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">v12</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">effective_at</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">回答引用</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">citation v12</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">mixed = 0</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">缓存代次</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">generation g33</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">tenant scoped</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">发布</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">accept</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">rollback</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">知识版本的验收终点，是回答不再混用旧证据</text>
</svg>
