<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">多租户知识流</title><desc id="desc">身份、租户和权限在检索前绑定，并贯穿证据和回答。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d"><path d="M70 210h760" stroke="#86a59d" stroke-width="8" stroke-linecap="round"/><g text-anchor="middle" font-size="18" font-weight="700"><circle cx="125" cy="210" r="63" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="125" y="204">身份</text><text x="125" y="232" font-size="14" font-weight="400">user_id</text><circle cx="315" cy="210" r="63" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><text x="315" y="204">租户</text><text x="315" y="232" font-size="14" font-weight="400">tenant_id</text><circle cx="505" cy="210" r="63" fill="#fff1d9" stroke="#c69a58" stroke-width="2"/><text x="505" y="204">权限</text><text x="505" y="232" font-size="14" font-weight="400">scope / role</text><circle cx="695" cy="210" r="63" fill="#fae8e1" stroke="#b96d59" stroke-width="2"/><text x="695" y="204">证据</text><text x="695" y="232" font-size="14" font-weight="400">doc_id / span</text></g><rect x="270" y="54" width="360" height="58" rx="16" fill="#173f3d"/><text x="450" y="90" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#fff">先过滤，再召回；先授权，再生成</text><path d="M315 112v34M505 112v34" stroke="#173f3d" stroke-width="3" stroke-dasharray="6 6"/><text x="450" y="337" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#4d6562">任何一个字段丢失，回答都可能越权</text></g></svg>
