<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">企业知识库 Agent 架构</title><desc id="desc">内容接入、索引、检索、编排和评测组成知识 Agent。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><g font-size="19" font-weight="700"><rect x="42" y="150" width="145" height="88" rx="16" fill="#fff1d9" stroke="#c69a58" stroke-width="2"/><text x="114" y="187">内容接入</text><text x="114" y="216" font-size="14" font-weight="400">文档 · 工单 · 网页</text><rect x="214" y="150" width="145" height="88" rx="16" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="286" y="187">索引</text><text x="286" y="216" font-size="14" font-weight="400">切分 · 向量 · 版本</text><rect x="386" y="150" width="145" height="88" rx="16" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><text x="458" y="187">检索</text><text x="458" y="216" font-size="14" font-weight="400">召回 · 重排 · 过滤</text><rect x="558" y="150" width="145" height="88" rx="16" fill="#fae8e1" stroke="#b96d59" stroke-width="2"/><text x="630" y="187">编排</text><text x="630" y="216" font-size="14" font-weight="400">工具 · 权限 · 回答</text><rect x="730" y="150" width="128" height="88" rx="16" fill="#173f3d"/><text x="794" y="187" fill="#fff">评测</text><text x="794" y="216" fill="#fff" font-size="14" font-weight="400">证据 · 反馈</text></g><path d="M187 194h27M359 194h27M531 194h27M703 194h27" stroke="#86a59d" stroke-width="4"/><text x="450" y="310" font-size="18" font-weight="700">答案不是终点，证据和反馈要回到索引</text><path d="M794 250v64H114v-64" fill="none" stroke="#86a59d" stroke-width="3" stroke-dasharray="8 8"/><path d="m120 307-10 7 10 7" fill="none" stroke="#86a59d" stroke-width="3"/></g></svg>
