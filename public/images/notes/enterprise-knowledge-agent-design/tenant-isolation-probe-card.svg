<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">多租户知识隔离探针</title>
  <desc id="desc">同名、共享、撤销和跨租户相似文档分别验证可见性与泄露边界。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F8F5"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#173F3D">多租户知识隔离要测正反两面</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#5B7470">允许的能引用，禁止的不能从缓存或摘要漏出来</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="206" height="126" rx="18" fill="#E5F0ED"/><text x="157" y="172" font-size="19" font-weight="700" fill="#1C615A">允许</text><text x="157" y="207" font-size="15" fill="#31514E">same title</text><text x="157" y="233" font-size="15" fill="#31514E">cite allowed</text>
    <rect x="278" y="132" width="206" height="126" rx="18" fill="#F5D9DC"/><text x="381" y="172" font-size="19" font-weight="700" fill="#78454D">跨租户</text><text x="381" y="207" font-size="15" fill="#855C63">similar doc</text><text x="381" y="233" font-size="15" fill="#855C63">no leak</text>
    <rect x="502" y="132" width="206" height="126" rx="18" fill="#FFF0D6"/><text x="605" y="172" font-size="19" font-weight="700" fill="#875B26">撤销</text><text x="605" y="207" font-size="15" fill="#6C5632">cached doc</text><text x="605" y="233" font-size="15" fill="#6C5632">deny + invalidate</text>
    <rect x="726" y="132" width="302" height="126" rx="18" fill="#173F3D"/><text x="877" y="182" font-size="19" font-weight="700" fill="#FFFFFF">四层复核</text><text x="877" y="218" font-size="15" fill="#D8EBE5">retrieval / rerank / generation / cache</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M260 195h18"/><path d="M484 195h18"/><path d="M708 195h18"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">内部 reason 区分无权限与不存在，对外再统一安全表达</text>
</svg>
