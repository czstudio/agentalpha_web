<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">RAG 证据来源链</title><desc id="desc">原文、解析、分块、查询改写、召回和选择组成 RAG 证据来源链</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">证据来源链：别只留下一个 rerank 分数</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">每一次改写和过滤，都应该能追溯到原文</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">原文</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">source id</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">version / owner</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">解析分块</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">parser / chunk id</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">offsets</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">查询改写</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">query hash</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">filters</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">召回重排</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">retriever / rerank</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">scores</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回放</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">claim → source</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">audit</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">检索质量的终点不是分数，而是能否从回答回到原始证据</text>
</svg>
