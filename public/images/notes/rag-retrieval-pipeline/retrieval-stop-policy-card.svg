<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">检索自适应停止</title><desc id="desc">查询、候选、证据覆盖、停止或继续流程</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">top-k 不是答案：检索要能自己判断何时停</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">证据覆盖够了就停，覆盖不足就换查询或继续扩展候选</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">查询</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">intent</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">missing facets</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">候选</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">dense + sparse</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">dedupe</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">覆盖</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">claim coverage</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">contradiction</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">决策</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">stop / expand</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">rewrite query</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">少而完整的证据，比一堆相似片段更能支撑可引用的答案</text>
</svg>
