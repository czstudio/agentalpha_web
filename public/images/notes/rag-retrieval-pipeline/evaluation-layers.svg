<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">RAG 四层评测</title><desc id="desc">RAG 评测分为数据、检索、生成和系统四层。</desc><rect width="1200" height="420" rx="28" fill="#fffdf8"/><text x="60" y="65" font-family="sans-serif" font-size="33" font-weight="700" fill="#3a3022">四层评测，定位四类不同问题</text><g font-family="sans-serif" text-anchor="middle"><rect x="90" y="125" width="235" height="150" rx="18" fill="#ffe0d8"/><text x="207" y="180" font-size="24" fill="#6a3024">数据层</text><text x="207" y="225" font-size="18" fill="#7e544b">完整、更新、权限</text><rect x="355" y="125" width="235" height="150" rx="18" fill="#ffeaca"/><text x="472" y="180" font-size="24" fill="#6a4a1d">检索层</text><text x="472" y="225" font-size="18" fill="#81663c">Recall / MRR / NDCG</text><rect x="620" y="125" width="235" height="150" rx="18" fill="#e2efff"/><text x="737" y="180" font-size="24" fill="#2c5275">生成层</text><text x="737" y="225" font-size="18" fill="#55728e">依据、冲突、引用</text><rect x="885" y="125" width="235" height="150" rx="18" fill="#e4f5e9"/><text x="1002" y="180" font-size="24" fill="#2d6041">系统层</text><text x="1002" y="225" font-size="18" fill="#54775f">时延、成本、失败率</text></g></svg>
