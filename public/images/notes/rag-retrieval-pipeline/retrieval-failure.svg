<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">RAG 错误定位</title><desc id="desc">RAG 失败需要区分数据、召回、重排、生成和评测问题。</desc><rect width="1200" height="460" rx="28" fill="#fffaf6"/><text x="60" y="65" font-family="sans-serif" font-size="33" font-weight="700" fill="#4a2c21">答案错了，不等于模型错了</text><g font-family="sans-serif" text-anchor="middle"><rect x="85" y="140" width="190" height="115" rx="16" fill="#ffe0d7"/><text x="180" y="185" font-size="22" fill="#6b3022">数据</text><text x="180" y="220" font-size="17" fill="#7d554a">缺页 / 过期 / 脏</text><rect x="320" y="140" width="190" height="115" rx="16" fill="#ffeac7"/><text x="415" y="185" font-size="22" fill="#6a4a1d">召回</text><text x="415" y="220" font-size="17" fill="#80663b">没找到相关片段</text><rect x="555" y="140" width="190" height="115" rx="16" fill="#e5efff"/><text x="650" y="185" font-size="22" fill="#2d5278">重排</text><text x="650" y="220" font-size="17" fill="#557492">正确片段被挤掉</text><rect x="790" y="140" width="190" height="115" rx="16" fill="#e5f5e8"/><text x="885" y="185" font-size="22" fill="#2f6541">生成</text><text x="885" y="220" font-size="17" fill="#54785f">看到了却没用对</text><rect x="1015" y="140" width="110" height="115" rx="16" fill="#f3e2f4"/><text x="1070" y="185" font-size="22" fill="#633d68">评测</text><text x="1070" y="220" font-size="17" fill="#7f5d84">指标失真</text><path d="M180 315h890" stroke="#9a7e71" stroke-width="4"/><text x="600" y="375" font-size="21" fill="#5e4b42">先定位哪一段链路失效，再决定改数据、检索器、提示词还是验收器</text></g></svg>
