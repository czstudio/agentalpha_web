<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">RAG 全链路</title><desc id="desc">文档经过清洗、分块、向量化和索引，问题经过改写、召回、重排后与上下文一起交给模型。</desc><rect width="1200" height="430" rx="28" fill="#f7fbff"/><text x="60" y="65" font-family="sans-serif" font-size="33" font-weight="700" fill="#17334f">RAG 不是一个组件，而是两条链路的汇合</text><g font-family="sans-serif" text-anchor="middle"><rect x="55" y="125" width="205" height="78" rx="14" fill="#dceeff"/><text x="157" y="172" font-size="22" fill="#214e73">文档清洗</text><rect x="300" y="125" width="205" height="78" rx="14" fill="#dceeff"/><text x="402" y="172" font-size="22" fill="#214e73">分块与 Embedding</text><rect x="545" y="125" width="205" height="78" rx="14" fill="#dceeff"/><text x="647" y="172" font-size="22" fill="#214e73">索引与过滤</text><rect x="790" y="125" width="205" height="78" rx="14" fill="#e5f5e9"/><text x="892" y="172" font-size="22" fill="#29563a">召回与重排</text><rect x="1035" y="125" width="110" height="78" rx="14" fill="#ffe8c4"/><text x="1090" y="172" font-size="22" fill="#6b4b1b">生成</text><path d="M260 164h36M505 164h36M750 164h36M995 164h35" stroke="#6c8297" stroke-width="4" marker-end="url(#a)"/><path d="M1090 220v85H157v-85" fill="none" stroke="#6c8297" stroke-width="4" marker-end="url(#a)"/><text x="600" y="355" font-size="22" fill="#34536d">用户问题：改写 / 扩展 → 召回 → 过滤 → 重排 → 上下文组装</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0l9 3-9 3z" fill="#6c8297"/></marker></defs></svg>
