<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">RAG 分块选择</title><desc id="desc">按结构切分、父子块和 token 上限共同决定分块方案。</desc><rect width="1200" height="420" rx="28" fill="#f9fbff"/><text x="60" y="65" font-family="sans-serif" font-size="33" font-weight="700" fill="#203b57">分块的三个约束：边界、完整性、预算</text><g font-family="sans-serif"><rect x="80" y="125" width="300" height="170" rx="18" fill="#dceeff"/><text x="230" y="180" text-anchor="middle" font-size="25" fill="#234f73">结构边界</text><text x="230" y="225" text-anchor="middle" font-size="19" fill="#4d6e89">标题 / 段落 / 表格</text><text x="230" y="260" text-anchor="middle" font-size="19" fill="#4d6e89">不从句子中间切开</text><rect x="450" y="125" width="300" height="170" rx="18" fill="#e4f5ea"/><text x="600" y="180" text-anchor="middle" font-size="25" fill="#2b5c3d">语义完整</text><text x="600" y="225" text-anchor="middle" font-size="19" fill="#4b7459">问题所需前提在一起</text><text x="600" y="260" text-anchor="middle" font-size="19" fill="#4b7459">必要时用父子块补上下文</text><rect x="820" y="125" width="300" height="170" rx="18" fill="#ffe9c9"/><text x="970" y="180" text-anchor="middle" font-size="25" fill="#6a4a1d">上下文预算</text><text x="970" y="225" text-anchor="middle" font-size="19" fill="#80633d">token 上限 / 重叠</text><text x="970" y="260" text-anchor="middle" font-size="19" fill="#80633d">不能为了完整塞满窗口</text></g></svg>
