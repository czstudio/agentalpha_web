<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Unit cost per success</title>
  <desc id="desc">模型、检索、工具、重试和人工成本汇总后，除以成功任务数。</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="58" y="54" fill="#17342f" font-size="25" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">Unit cost per success</text>
  <text x="58" y="82" fill="#71837d" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">所有成本回到同一条 trace，再除以真正完成的成功任务</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="72" y="130" width="148" height="100" rx="18" fill="#eaf1f8" stroke="#b6cce0"/><text x="94" y="166" fill="#31516d" font-size="17" font-weight="700">模型</text><text x="94" y="197" fill="#587085" font-size="14">input / output</text>
    <rect x="240" y="130" width="148" height="100" rx="18" fill="#e4f2ec" stroke="#a8d2bf"/><text x="262" y="166" fill="#205b4c" font-size="17" font-weight="700">检索</text><text x="262" y="197" fill="#4e6c63" font-size="14">index / storage</text>
    <rect x="408" y="130" width="148" height="100" rx="18" fill="#fff1d9" stroke="#e9c987"/><text x="430" y="166" fill="#795a20" font-size="17" font-weight="700">工具</text><text x="430" y="197" fill="#896d39" font-size="14">attempts / retries</text>
    <rect x="576" y="130" width="148" height="100" rx="18" fill="#f5e7ee" stroke="#dfb2c7"/><text x="598" y="166" fill="#7a3f5a" font-size="17" font-weight="700">人工</text><text x="598" y="197" fill="#8a6073" font-size="14">handoff / rework</text>
    <rect x="776" y="116" width="232" height="128" rx="20" fill="#17342f"/><text x="800" y="159" fill="#f5fbf8" font-size="18" font-weight="700">÷ 成功任务</text><text x="800" y="193" fill="#c7e7d9" font-size="16">cost_per_success</text><text x="800" y="219" fill="#91c5b0" font-size="14">success ≠ 只生成文本</text>
  </g>
  <g stroke="#6e9588" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 180h20"/><path d="M388 180h20"/><path d="M556 180h20"/><path d="M724 180h52"/>
    <path d="M226 170l14 10-14 10"/><path d="M394 170l14 10-14 10"/><path d="M562 170l14 10-14 10"/><path d="M758 170l18 10-18 10"/>
  </g>
  <rect x="72" y="286" width="936" height="52" rx="15" fill="#edf4f0" stroke="#c8ddd3"/>
  <text x="98" y="319" fill="#28594c" font-size="17" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">单次调用便宜了，不等于单位成功任务便宜了</text>
</svg>
