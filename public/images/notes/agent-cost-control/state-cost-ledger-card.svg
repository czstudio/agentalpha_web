<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">按任务状态分账的成本账本</title><desc id="desc">成功、恢复、人工接管、未知和单位成功成本组成任务状态成本账本</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">成本账本：先确认任务最后停在哪</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">请求结束，不等于任务完成</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">成功</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">副作用可验证</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">completed</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">恢复</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">重试 / 补偿</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">recovered</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">人工</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">handoff minutes</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">review cost</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">未知</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">待对账</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">exclude success</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">结算</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">all-in</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">per success</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">状态分开记，单位成功成本才不会被恢复成本掩盖</text>
</svg>
