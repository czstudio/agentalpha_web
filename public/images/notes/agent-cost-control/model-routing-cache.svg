<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">模型路由与缓存</title><desc id="desc">按任务风险选择模型，并在稳定请求前加缓存。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><rect x="52" y="155" width="170" height="90" rx="18" fill="#fff1d9" stroke="#c69a58" stroke-width="2"/><text x="137" y="192" font-size="19" font-weight="700">任务风险</text><text x="137" y="221" font-size="14">低 · 中 · 高</text><path d="M222 200h48" stroke="#86a59d" stroke-width="4"/><rect x="270" y="75" width="170" height="74" rx="16" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="355" y="106" font-size="18" font-weight="700">小模型</text><text x="355" y="130" font-size="14">分类 / 改写</text><rect x="270" y="173" width="170" height="74" rx="16" fill="#dfeee8" stroke="#86a59d" stroke-width="2"/><text x="355" y="204" font-size="18" font-weight="700">平衡模型</text><text x="355" y="228" font-size="14">规划 / 检索</text><rect x="270" y="271" width="170" height="74" rx="16" fill="#fae8e1" stroke="#b96d59" stroke-width="2"/><text x="355" y="302" font-size="18" font-weight="700">大模型</text><text x="355" y="326" font-size="14">高风险决策</text><path d="M440 112h80M440 210h80M440 308h80" stroke="#86a59d" stroke-width="4"/><rect x="520" y="155" width="170" height="90" rx="18" fill="#173f3d"/><text x="605" y="192" font-size="19" font-weight="700" fill="#fff">缓存门</text><text x="605" y="221" font-size="14" fill="#fff">命中即复用</text><path d="M690 200h48" stroke="#86a59d" stroke-width="4"/><rect x="738" y="155" width="110" height="90" rx="18" fill="#eaf3f7" stroke="#24556a" stroke-width="2"/><text x="793" y="192" font-size="18" font-weight="700">交付</text><text x="793" y="221" font-size="14">结果</text></g></svg>
