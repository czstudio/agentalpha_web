<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Agent 成本栈</title><desc id="desc">模型、检索、工具、存储和交接共同构成一次任务成本。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" text-anchor="middle" font-weight="700"><rect x="140" y="55" width="620" height="54" rx="14" fill="#173f3d"/><text x="450" y="90" font-size="19" fill="#fff">模型输入 / 输出</text><rect x="180" y="119" width="540" height="54" rx="14" fill="#eaf3f7" stroke="#24556a"/><text x="450" y="154" font-size="19" fill="#173f3d">检索与上下文</text><rect x="220" y="183" width="460" height="54" rx="14" fill="#dfeee8" stroke="#86a59d"/><text x="450" y="218" font-size="19" fill="#173f3d">工具调用</text><rect x="260" y="247" width="380" height="54" rx="14" fill="#fff1d9" stroke="#c69a58"/><text x="450" y="282" font-size="19" fill="#173f3d">存储与网络</text><rect x="300" y="311" width="300" height="54" rx="14" fill="#fae8e1" stroke="#b96d59"/><text x="450" y="346" font-size="19" fill="#173f3d">多 Agent 交接</text></g></svg>
