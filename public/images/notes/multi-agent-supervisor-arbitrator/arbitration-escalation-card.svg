<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">仲裁升级卡</title>
  <desc id="desc">先过硬门禁，再比较证据与风险，差距过小时升级人工。</desc>
  <rect width="1080" height="390" rx="28" fill="#F7F4EE"/>
  <text x="54" y="56" font-family="Arial,'Noto Sans SC',sans-serif" font-size="26" font-weight="700" fill="#193C3A">仲裁先过硬门禁，再谈分数</text>
  <text x="54" y="88" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16" fill="#58706D">高自信不能覆盖版本、权限和补偿缺口</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
    <rect x="54" y="132" width="214" height="126" rx="18" fill="#E5F0ED"/><text x="161" y="172" font-size="19" font-weight="700" fill="#1C615A">硬门禁</text><text x="161" y="207" font-size="15" fill="#31514E">evidence / ACL</text><text x="161" y="233" font-size="15" fill="#31514E">budget / compensate</text>
    <rect x="292" y="132" width="214" height="126" rx="18" fill="#EAF3F7"/><text x="399" y="172" font-size="19" font-weight="700" fill="#275261">可解释比较</text><text x="399" y="207" font-size="15" fill="#52727A">独立性 / 新鲜度</text><text x="399" y="233" font-size="15" fill="#52727A">风险 / 成本</text>
    <rect x="530" y="132" width="214" height="126" rx="18" fill="#FFF0D6"/><text x="637" y="172" font-size="19" font-weight="700" fill="#875B26">差距 0.03</text><text x="637" y="207" font-size="15" fill="#6C5632">margin &lt; 0.05</text><text x="637" y="233" font-size="15" fill="#6C5632">keep alternatives</text>
    <rect x="768" y="132" width="260" height="126" rx="18" fill="#173F3D"/><text x="898" y="182" font-size="19" font-weight="700" fill="#FFFFFF">人工复核</text><text x="898" y="218" font-size="15" fill="#D8EBE5">next owner + missing evidence</text>
  </g>
  <g fill="none" stroke="#7D9A95" stroke-width="3" stroke-linecap="round"><path d="M268 195h24"/><path d="M506 195h24"/><path d="M744 195h24"/></g>
  <rect x="54" y="296" width="974" height="43" rx="14" fill="#E8EFEB"/><text x="76" y="324" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15" fill="#365B61">保留被淘汰候选和理由，人工接管也要成为可回放状态</text>
</svg>
