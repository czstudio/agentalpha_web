<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">监督仲裁状态机</title><desc id="desc">监督者检查状态迁移和硬门槛，仲裁器处理冲突，无法判定时升级人工</desc>
  <rect width="1080" height="360" rx="24" fill="#f7f8f5"/>
  <text x="52" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#173f3d">监督仲裁状态机</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#5b7470">谁能推进状态，谁只能比较候选，边界必须写进记录</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="52" y="126" width="190" height="154" rx="18" fill="#eaf3f7" stroke="#b9d3df"/><text x="78" y="158" font-size="18" font-weight="700" fill="#173f3d">Candidate</text><text x="78" y="190" font-size="14" fill="#48635f">artifact</text><text x="78" y="216" font-size="14" fill="#48635f">输入版本</text><text x="78" y="242" font-size="14" fill="#48635f">来源 Agent</text>
    <rect x="266" y="126" width="220" height="154" rx="18" fill="#dfeee8" stroke="#afd0c3"/><text x="292" y="158" font-size="18" font-weight="700" fill="#173f3d">Supervisor</text><text x="292" y="190" font-size="14" fill="#48635f">schema / ACL</text><text x="292" y="216" font-size="14" fill="#48635f">预算 / 状态迁移</text><text x="292" y="242" font-size="14" fill="#48635f">不合格就阻断</text>
    <rect x="510" y="126" width="220" height="154" rx="18" fill="#fff1d9" stroke="#e8c891"/><text x="536" y="158" font-size="18" font-weight="700" fill="#173f3d">Arbitrator</text><text x="536" y="190" font-size="14" fill="#48635f">证据归一化</text><text x="536" y="216" font-size="14" fill="#48635f">最小区分实验</text><text x="536" y="242" font-size="14" fill="#48635f">不确定就升级</text>
    <rect x="754" y="126" width="274" height="154" rx="18" fill="#fae8e1" stroke="#e0b9ae"/><text x="780" y="158" font-size="18" font-weight="700" fill="#173f3d">Resolved / Human</text><text x="780" y="190" font-size="14" fill="#48635f">决策、责任人、版本</text><text x="780" y="216" font-size="14" fill="#48635f">撤销条件 / 响应时间</text><text x="780" y="242" font-size="14" fill="#48635f">可回放、可追责</text>
  </g>
  <path d="M242 203h24M486 203h24M730 203h24" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
</svg>
