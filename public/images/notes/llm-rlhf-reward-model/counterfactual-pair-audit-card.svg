<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">奖励模型反事实成对审计</title><desc id="desc">只改变格式、证据或安全边界，检查奖励分是否按预期变化</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">反事实成对：把奖励模型的捷径单独照出来</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">只改一个因素，分数应该怎样变化</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">基准回答</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">same task</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">same evidence</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">格式变化</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">length / tone</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">delta near zero</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据变化</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">citation / guess</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">lower if unsafe</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">审计结论</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">shortcut slice</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">retrain / hold</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">真正的偏好要对证据和安全敏感，对无关格式保持稳定</text>
</svg>
