<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">偏好数据到奖励模型</title>
  <desc id="desc">同一个 prompt 配两条回答，标注 chosen 和 rejected，奖励模型学习偏好差异而不是背答案。</desc>
  <rect width="1200" height="390" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">奖励模型学的是“哪一个更好”</text>
  <text x="58" y="88" fill="#6b6e70" font-family="Arial, sans-serif" font-size="16">偏好标注不是事实标签，必须定义比较标准和不确定性</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="140" width="230" height="82" rx="14" fill="#ffffff" stroke="#dfe4df"/>
    <text x="185" y="174" text-anchor="middle" fill="#1d1d1f" font-size="16" font-weight="700">同一个 prompt</text><text x="185" y="199" text-anchor="middle" fill="#6b6e70" font-size="14">“如何处理库存未知？”</text>
    <path d="M310 181 H380" stroke="#247a6b" stroke-width="2"/><text x="345" y="166" text-anchor="middle" fill="#247a6b" font-size="24">→</text>
    <rect x="400" y="128" width="300" height="72" rx="14" fill="#e6f1ed" stroke="#9bc9bc"/>
    <text x="430" y="158" fill="#247a6b" font-size="15" font-weight="700">chosen</text><text x="430" y="183" fill="#1d1d1f" font-size="14">先查库存，查不到就明确说明</text>
    <rect x="400" y="212" width="300" height="72" rx="14" fill="#fff5e8" stroke="#e5c98f"/>
    <text x="430" y="242" fill="#9b6b21" font-size="15" font-weight="700">rejected</text><text x="430" y="267" fill="#1d1d1f" font-size="14">直接猜一个数量让用户满意</text>
    <path d="M720 181 H800" stroke="#247a6b" stroke-width="2"/><text x="760" y="166" text-anchor="middle" fill="#247a6b" font-size="24">→</text>
    <rect x="820" y="140" width="300" height="144" rx="14" fill="#ffffff" stroke="#dfe4df"/>
    <text x="970" y="175" text-anchor="middle" fill="#1d1d1f" font-size="16" font-weight="700">奖励模型</text><text x="970" y="204" text-anchor="middle" fill="#6b6e70" font-size="14">r(prompt, answer)</text><text x="970" y="236" text-anchor="middle" fill="#6b6e70" font-size="14">学习 r(chosen) &gt; r(rejected)</text><text x="970" y="263" text-anchor="middle" fill="#247a6b" font-size="14">不是判断绝对真理</text>
  </g>
</svg>
