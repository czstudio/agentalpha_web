<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">RLHF PPO 闭环</title>
  <desc id="desc">策略模型生成答案，奖励模型打分，KL 惩罚约束偏离参考模型，PPO 更新策略。</desc>
  <rect width="1200" height="410" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">RLHF 的难点在闭环，不在四个字母</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="16">
    <rect x="70" y="150" width="210" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="175" y="184" fill="#1d1d1f" font-weight="700">policy</text><text x="175" y="208" fill="#6b6e70">生成回答 / 轨迹</text>
    <rect x="350" y="150" width="210" height="78" rx="14" fill="#e6f1ed" stroke="#9bc9bc"/><text x="455" y="184" fill="#1d1d1f" font-weight="700">reward model</text><text x="455" y="208" fill="#6b6e70">偏好分数</text>
    <rect x="630" y="150" width="210" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="735" y="184" fill="#1d1d1f" font-weight="700">KL / value</text><text x="735" y="208" fill="#6b6e70">限制策略漂移</text>
    <rect x="910" y="150" width="210" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="1015" y="184" fill="#1d1d1f" font-weight="700">PPO update</text><text x="1015" y="208" fill="#6b6e70">裁剪优势更新</text>
    <g fill="#247a6b" font-size="28"><text x="315" y="196">→</text><text x="595" y="196">→</text><text x="875" y="196">→</text></g>
    <path d="M1015 250 C1015 335 175 335 175 250" fill="none" stroke="#247a6b" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="600" y="364" fill="#247a6b">每轮都要检查奖励分布、KL、长度和真实任务，而不是只看 policy loss</text>
  </g>
</svg>
