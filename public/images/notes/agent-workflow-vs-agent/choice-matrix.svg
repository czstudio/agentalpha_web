<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Workflow 与 Agent 选择矩阵</title><desc id="desc">根据路径不确定性和副作用风险选择固定流程或受限 Agent</desc>
  <rect width="1400" height="500" rx="28" fill="#f7f8fa"/>
  <g font-family="Arial, sans-serif" fill="#17202a">
    <text x="72" y="82" font-size="22" letter-spacing="3" fill="#68717c">CHOICE MATRIX</text>
    <text x="72" y="128" font-size="34" font-weight="700">先问路径是否不确定，再问副作用有多大</text>
    <path d="M270 410V190M270 410h840" stroke="#68717c" stroke-width="3"/>
    <text x="620" y="458" font-size="20" fill="#68717c">路径不确定性 →</text><text x="104" y="250" font-size="20" fill="#68717c" transform="rotate(-90 104 250)">副作用风险 →</text>
    <rect x="320" y="300" width="300" height="80" rx="14" fill="#e8f5ed" stroke="#39865b"/><text x="470" y="348" text-anchor="middle" font-size="22" font-weight="700">Workflow</text>
    <rect x="670" y="300" width="300" height="80" rx="14" fill="#e3efff" stroke="#3978c8"/><text x="820" y="348" text-anchor="middle" font-size="22" font-weight="700">受限 Agent</text>
    <rect x="320" y="210" width="300" height="60" rx="14" fill="#f3f5f7" stroke="#aab2bb"/><text x="470" y="247" text-anchor="middle" font-size="18">固定规则 + 人工兜底</text>
    <rect x="670" y="210" width="300" height="60" rx="14" fill="#fff1d8" stroke="#bd7a19"/><text x="820" y="247" text-anchor="middle" font-size="18">计划 / 执行分离 + 审批</text>
    <text x="1010" y="230" font-size="18" fill="#68717c">高风险</text><text x="1010" y="345" font-size="18" fill="#68717c">低风险</text>
  </g>
</svg>
