<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">重排触发原因卡</title><desc id="desc">风险、证据缺口、候选质量、收益和升级决策组成动态重排记录</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">重排触发原因卡：每次升级都有理由</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">把额外延迟和证据收益绑定到同一个请求</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">风险</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">query high</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">权限 / 版本</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">证据缺口</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">required missing</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">margin 0.031</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">候选集</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">hybrid top 40</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">same ACL</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">收益 / 代价</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">support 0.62→0.86</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">P95 +86ms</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">升级</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">rerank</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">可回放</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">不是所有请求都要重排，但每次重排都应该能解释</text>
</svg>
