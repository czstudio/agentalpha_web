<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">混合检索与重排流水线</title>
  <desc id="desc">BM25 与向量检索并行召回候选，融合去重后交给重排模型，最后进行权限过滤和上下文组装。</desc>
  <rect width="1200" height="430" rx="28" fill="#f7f8f5"/>
  <text x="58" y="60" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">扩大候选集，再把真正能回答的片段排前面</text>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="70" y="155" width="180" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="160" y="188" fill="#1d1d1f" font-weight="700">用户问题</text><text x="160" y="212" fill="#6b6e70">错误码 + 自然语言</text>
    <rect x="330" y="105" width="190" height="78" rx="14" fill="#edf1f6" stroke="#c5d1e2"/><text x="425" y="138" fill="#1d1d1f" font-weight="700">BM25</text><text x="425" y="162" fill="#6b6e70">命中词项 / 版本</text>
    <rect x="330" y="215" width="190" height="78" rx="14" fill="#e6f1ed" stroke="#9bc9bc"/><text x="425" y="248" fill="#1d1d1f" font-weight="700">向量检索</text><text x="425" y="272" fill="#6b6e70">同义表达 / 语义</text>
    <rect x="600" y="155" width="190" height="78" rx="14" fill="#f4ead0" stroke="#dfc783"/><text x="695" y="188" fill="#1d1d1f" font-weight="700">融合 + 去重</text><text x="695" y="212" fill="#6b6e70">RRF / 加权排序</text>
    <rect x="870" y="105" width="230" height="78" rx="14" fill="#ffffff" stroke="#dfe4df"/><text x="985" y="138" fill="#1d1d1f" font-weight="700">Reranker</text><text x="985" y="162" fill="#6b6e70">问题 × 片段交互</text>
    <rect x="870" y="215" width="230" height="78" rx="14" fill="#e6f1ed" stroke="#9bc9bc"/><text x="985" y="248" fill="#1d1d1f" font-weight="700">过滤 + 组装</text><text x="985" y="272" fill="#6b6e70">权限 / 版本 / 引用</text>
    <g fill="#247a6b" font-size="28"><text x="276" y="202">→</text><text x="558" y="202">→</text><text x="828" y="202">→</text></g>
    <line x1="520" y1="144" x2="570" y2="186" stroke="#247a6b" stroke-width="2"/><line x1="520" y1="254" x2="570" y2="212" stroke="#247a6b" stroke-width="2"/>
  </g>
  <text x="70" y="360" fill="#6b6e70" font-family="Arial, sans-serif" font-size="15">重排不能找回候选集里没有的答案；召回失败和重排失败必须分开记账</text>
</svg>
