<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">重排失败定位图</title>
  <desc id="desc">将 RAG 的错误拆为候选集缺答案、重排顺序错误和生成引用错误三类。</desc>
  <rect width="1200" height="400" rx="28" fill="#f7f8f5"/>
  <text x="58" y="58" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="25" font-weight="700">看到答案错，先问它在哪一层掉了</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="125" width="315" height="170" rx="16" fill="#ffffff" stroke="#e3c1b3"/>
    <text x="98" y="164" fill="#b25e3f" font-size="18" font-weight="700">A · 召回失败</text><text x="98" y="197" fill="#1d1d1f" font-size="15">正确片段不在 top-k</text><text x="98" y="224" fill="#6b6e70" font-size="14">查：分块、查询改写、过滤、词典</text><text x="98" y="259" fill="#6b6e70" font-size="14">改：扩大候选或补检索路径</text>
    <rect x="442" y="125" width="315" height="170" rx="16" fill="#ffffff" stroke="#dfc783"/>
    <text x="470" y="164" fill="#a57c17" font-size="18" font-weight="700">B · 重排失败</text><text x="470" y="197" fill="#1d1d1f" font-size="15">正确片段在候选，却被排后</text><text x="470" y="224" fill="#6b6e70" font-size="14">查：reranker、候选数、截断</text><text x="470" y="259" fill="#6b6e70" font-size="14">改：训练/阈值/分层调用</text>
    <rect x="814" y="125" width="315" height="170" rx="16" fill="#e6f1ed" stroke="#9bc9bc"/>
    <text x="842" y="164" fill="#247a6b" font-size="18" font-weight="700">C · 生成失败</text><text x="842" y="197" fill="#1d1d1f" font-size="15">证据对了，回答仍没引用好</text><text x="842" y="224" fill="#6b6e70" font-size="14">查：上下文组装、提示、引用约束</text><text x="842" y="259" fill="#6b6e70" font-size="14">改：证据格式、拒答和回归集</text>
  </g>
</svg>
