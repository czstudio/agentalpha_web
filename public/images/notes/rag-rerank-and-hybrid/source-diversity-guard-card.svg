<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">重排同源证据防挤占</title><desc id="desc">候选、相关性、来源配额、覆盖决策</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">重排之后，再防同源证据把上下文挤满</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">相似片段很多，不等于证据覆盖更多</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">候选</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">dense + sparse</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">source ids</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">重排</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">relevance</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">freshness</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">配额</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">same source</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">same section</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">覆盖</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">claims</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">counterexample</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">让不同来源互相验证，而不是让同一篇文档重复占位</text>
</svg>
