<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">奖励契约</title><desc id="desc">硬门控、软目标、回放集、验收指标和回滚版本组成奖励契约</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">奖励契约：先定义什么绝对不能做</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">把训练曲线变成可审计、可回放、可回滚的接口</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">硬门控</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">越权写入</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">伪造引用</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">软目标</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">正确性</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">时延 / 调用数</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">回放集</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">hidden-redteam</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">固定版本</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">验收</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">高分低质 &lt; 2%</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">任务成功 ≥ 0.88</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">回滚</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">rw-04</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">保留证据</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">奖励可以推动能力，契约决定能力朝哪边长</text>
</svg>
