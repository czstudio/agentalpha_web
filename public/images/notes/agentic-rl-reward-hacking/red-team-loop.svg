<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Reward 红队回归闭环</title>
  <desc id="desc">从漏洞样本设计到运行策略、遮挡审计、修复验收并固定回归集的闭环。</desc>
  <rect width="1200" height="620" fill="#fbfaf7"/>
  <text x="72" y="72" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17221b">高 reward 低质量，先做一轮红队回归</text>
  <text x="72" y="106" font-family="Arial, sans-serif" font-size="16" fill="#627066">每次改 verifier，都要问：模型是不是只是换了一条捷径？</text>
  <g font-family="Arial, sans-serif">
    <circle cx="180" cy="300" r="92" fill="#f2e6e5" stroke="#ba7a73" stroke-width="3"/><text x="133" y="294" font-size="18" font-weight="700" fill="#703e39">设计漏洞</text><text x="124" y="326" font-size="15" fill="#5c4140">假成功、改测试</text>
    <circle cx="470" cy="180" r="92" fill="#f3ead9" stroke="#c39b55" stroke-width="3"/><text x="420" y="174" font-size="18" font-weight="700" fill="#705426">运行策略</text><text x="405" y="206" font-size="15" fill="#53472f">收集高分轨迹</text>
    <circle cx="760" cy="300" r="92" fill="#e9edf4" stroke="#7f93b0" stroke-width="3"/><text x="708" y="294" font-size="18" font-weight="700" fill="#334b6a">遮挡审计</text><text x="697" y="326" font-size="15" fill="#3e4a5a">删自评 / 换提示</text>
    <circle cx="470" cy="460" r="92" fill="#e7f1e8" stroke="#7ca587" stroke-width="3"/><text x="420" y="454" font-size="18" font-weight="700" fill="#285339">修复验收</text><text x="405" y="486" font-size="15" fill="#35443b">硬约束 + 隐藏集</text>
  </g>
  <g stroke="#51645a" stroke-width="3" fill="none" stroke-linecap="round"><path d="M248 264 L390 210"/><path d="M552 210 L680 264"/><path d="M680 336 L552 420"/><path d="M390 420 L248 336"/></g>
  <g fill="#51645a"><path d="M390 210 l-15 -4 7 14z"/><path d="M680 264 l-4 -15 14 7z"/><path d="M552 420 l7 -14 7 14z"/><path d="M248 336 l14 7 -4 -15z"/></g>
  <rect x="72" y="548" width="1056" height="42" rx="10" fill="#17221b"/><text x="100" y="576" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f4ee">回归项要写清：防什么漏洞 · 模型走了什么捷径 · 哪个证据缺失 · 修复由什么测试覆盖</text>
</svg>
