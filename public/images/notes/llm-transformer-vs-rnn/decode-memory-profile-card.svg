<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Transformer decode 内存 profile</title><desc id="desc">prefill 计算与 decode 的 KV 内存流量分开观察</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">Transformer 推理：复杂度之外还有 KV 内存流量</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">prefill 和 decode 的瓶颈不是同一件事</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="220" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="162" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">Prefill</text><text x="162" y="191" text-anchor="middle" font-size="13" fill="#48635f">input throughput</text><text x="162" y="215" text-anchor="middle" font-size="13" fill="#48635f">peak VRAM</text>
    <rect x="292" y="122" width="220" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="402" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">Decode</text><text x="402" y="191" text-anchor="middle" font-size="13" fill="#48635f">ITL / token</text><text x="402" y="215" text-anchor="middle" font-size="13" fill="#48635f">batch padding</text>
    <rect x="532" y="122" width="220" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="642" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">KV Cache</text><text x="642" y="191" text-anchor="middle" font-size="13" fill="#48635f">bytes / token</text><text x="642" y="215" text-anchor="middle" font-size="13" fill="#48635f">bandwidth</text>
    <rect x="772" y="122" width="256" height="126" rx="17" fill="#173f3d"/><text x="900" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">优化选择</text><text x="900" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">GQA / MQA</text><text x="900" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">paged KV / batch</text>
  </g>
  <path d="M272 185h20M512 185h20M752 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">参数量是静态规模，decode 速度还由缓存和内存访问决定</text>
</svg>
