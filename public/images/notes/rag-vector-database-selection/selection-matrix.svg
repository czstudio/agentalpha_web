<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f8faf9"/>
  <text x="70" y="70" font-family="Arial,'Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#19372f">向量库选型：目标 → 索引 → 运维</text>
  <text x="70" y="104" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" fill="#6a7d75">先测召回、过滤和尾延迟，再决定产品与部署方式</text>
  <g font-family="Arial,'Noto Sans SC',sans-serif">
    <rect x="80" y="170" width="290" height="250" rx="18" fill="#e8f3ee" stroke="#9ec9b4" stroke-width="2"/>
    <text x="120" y="218" font-size="22" font-weight="700" fill="#225c4b">1 · 检索目标</text>
    <text x="120" y="260" font-size="17" fill="#416457">Recall@k / 引用覆盖</text>
    <text x="120" y="294" font-size="17" fill="#416457">租户 / 时间 / 权限过滤</text>
    <text x="120" y="328" font-size="17" fill="#416457">更新频率与删除语义</text>
    <text x="120" y="362" font-size="17" fill="#416457">P95、成本、恢复时间</text>
    <rect x="455" y="170" width="290" height="250" rx="18" fill="#ffffff" stroke="#c7d8d1" stroke-width="2"/>
    <text x="495" y="218" font-size="22" font-weight="700" fill="#19372f">2 · 索引组合</text>
    <text x="495" y="260" font-size="17" fill="#526c63">HNSW：图近邻 / 内存高</text>
    <text x="495" y="294" font-size="17" fill="#526c63">IVF：簇搜索 / nprobe</text>
    <text x="495" y="328" font-size="17" fill="#526c63">倒排：精确 token / 过滤</text>
    <text x="495" y="362" font-size="17" fill="#526c63">混合 + rerank：补短板</text>
    <rect x="830" y="170" width="290" height="250" rx="18" fill="#e9f1f8" stroke="#a8c1d7" stroke-width="2"/>
    <text x="870" y="218" font-size="22" font-weight="700" fill="#2b5d7d">3 · 生产运维</text>
    <text x="870" y="260" font-size="17" fill="#44677c">副本、分片与快照</text>
    <text x="870" y="294" font-size="17" fill="#44677c">增量更新与版本切换</text>
    <text x="870" y="328" font-size="17" fill="#44677c">故障降级与恢复演练</text>
    <text x="870" y="362" font-size="17" fill="#44677c">单位成功任务成本</text>
  </g>
  <path d="M370 294H445" stroke="#5e8d7d" stroke-width="4"/><path d="m431 282 18 12-18 12" fill="#5e8d7d"/>
  <path d="M745 294H820" stroke="#5e8d7d" stroke-width="4"/><path d="m806 282 18 12-18 12" fill="#5e8d7d"/>
</svg>
