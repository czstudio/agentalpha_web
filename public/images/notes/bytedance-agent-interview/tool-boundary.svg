<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">工具调用安全边界</title><desc id="desc">模型意图经过契约、权限、幂等和回执才变成副作用。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><path d="M85 210h730" stroke="#86a59d" stroke-width="6"/><g font-size="17" font-weight="700"><circle cx="85" cy="210" r="50" fill="#eaf3f7" stroke="#24556a"/><text x="85" y="216">意图</text><circle cx="270" cy="210" r="50" fill="#dfeee8" stroke="#86a59d"/><text x="270" y="216">契约</text><circle cx="450" cy="210" r="50" fill="#fff1d9" stroke="#c69a58"/><text x="450" y="216">权限</text><circle cx="630" cy="210" r="50" fill="#fae8e1" stroke="#b96d59"/><text x="630" y="216">幂等</text><circle cx="815" cy="210" r="50" fill="#173f3d"/><text x="815" y="216" fill="#fff">回执</text></g><text x="450" y="335" font-size="17" fill="#4d6562">模型提出动作，系统决定动作能否发生</text></g></svg>
