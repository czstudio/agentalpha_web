<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">RAG 面试追问链</title><desc id="desc">接入、切分、召回、过滤、重排、组装和引用校验。</desc><rect width="900" height="420" rx="28" fill="#f7f8f5"/><g font-family="sans-serif" fill="#173f3d" text-anchor="middle"><g font-size="15" font-weight="700"><rect x="38" y="176" width="105" height="68" rx="14" fill="#fff1d9" stroke="#c69a58"/><text x="90" y="204">接入</text><text x="90" y="225" font-size="12">版本</text><rect x="158" y="176" width="105" height="68" rx="14" fill="#eaf3f7" stroke="#24556a"/><text x="210" y="204">切分</text><text x="210" y="225" font-size="12">结构</text><rect x="278" y="176" width="105" height="68" rx="14" fill="#dfeee8" stroke="#86a59d"/><text x="330" y="204">召回</text><text x="330" y="225" font-size="12">Recall</text><rect x="398" y="176" width="105" height="68" rx="14" fill="#fae8e1" stroke="#b96d59"/><text x="450" y="204">过滤</text><text x="450" y="225" font-size="12">ACL</text><rect x="518" y="176" width="105" height="68" rx="14" fill="#fff1d9" stroke="#c69a58"/><text x="570" y="204">重排</text><text x="570" y="225" font-size="12">MRR</text><rect x="638" y="176" width="105" height="68" rx="14" fill="#eaf3f7" stroke="#24556a"/><text x="690" y="204">组装</text><text x="690" y="225" font-size="12">预算</text><rect x="758" y="176" width="105" height="68" rx="14" fill="#173f3d"/><text x="810" y="204" fill="#fff">引用</text><text x="810" y="225" font-size="12" fill="#fff">覆盖</text></g><path d="M143 210h15M263 210h15M383 210h15M503 210h15M623 210h15M743 210h15" stroke="#86a59d" stroke-width="3"/><text x="450" y="335" font-size="17" fill="#4d6562">每一段都有可能成为错误的来源</text></g></svg>
