<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">灰度回滚 RACI</title><desc id="desc">告警、决策、执行、对账和现场证据</desc>
  <rect width="1080" height="390" rx="26" fill="#f7f8f5"/>
  <text x="52" y="56" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#173f3d">回滚计划还要写清：谁发现、谁决定、谁执行</text>
  <text x="52" y="84" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" fill="#5b7470">阈值之外，责任链和现场证据同样决定能否止损</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="52" y="122" width="190" height="126" rx="17" fill="#eaf3f7" stroke="#b9d3df"/><text x="147" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">发现</text><text x="147" y="191" text-anchor="middle" font-size="13" fill="#48635f">alert</text><text x="147" y="215" text-anchor="middle" font-size="13" fill="#48635f">on-call</text>
    <rect x="262" y="122" width="190" height="126" rx="17" fill="#fff1d9" stroke="#e8c891"/><text x="357" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">决策</text><text x="357" y="191" text-anchor="middle" font-size="13" fill="#48635f">threshold</text><text x="357" y="215" text-anchor="middle" font-size="13" fill="#48635f">ml owner</text>
    <rect x="472" y="122" width="190" height="126" rx="17" fill="#f5d9dc" stroke="#dfb2b9"/><text x="567" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">执行</text><text x="567" y="191" text-anchor="middle" font-size="13" fill="#48635f">freeze writes</text><text x="567" y="215" text-anchor="middle" font-size="13" fill="#48635f">route back</text>
    <rect x="682" y="122" width="190" height="126" rx="17" fill="#dfeee8" stroke="#afd0c3"/><text x="777" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#173f3d">对账</text><text x="777" y="191" text-anchor="middle" font-size="13" fill="#48635f">data owner</text><text x="777" y="215" text-anchor="middle" font-size="13" fill="#48635f">external state</text>
    <rect x="892" y="122" width="136" height="126" rx="17" fill="#173f3d"/><text x="960" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">留痕</text><text x="960" y="191" text-anchor="middle" font-size="13" fill="#dbe9e5">incident id</text><text x="960" y="215" text-anchor="middle" font-size="13" fill="#dbe9e5">snapshot</text>
  </g>
  <path d="M242 185h20M452 185h20M662 185h20M872 185h20" stroke="#7d9a95" stroke-width="3" stroke-linecap="round"/>
  <rect x="52" y="294" width="976" height="44" rx="14" fill="#e8efeb"/><text x="540" y="322" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#365b61">可回滚 = 有阈值、有 owner、有冻结动作、能保留现场</text>
</svg>
